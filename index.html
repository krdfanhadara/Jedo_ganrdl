    // --- مودال الإضافة السريع والشامل ---
    function QuickAddModal({ type: initialType, editData, onClose, onSave, ptnrs }) {
      const isEdit = !!editData; 
      const [type, setType] = useState(initialType);
      const [txType, setTxType] = useState(isEdit && editData.type ? editData.type : (type === 'trust' ? 'external' : 'income'));
      const [wallet, setWallet] = useState(isEdit && editData.wallet ? editData.wallet : 'bank');
      const [direction, setDirection] = useState('bank_to_cash'); 
      const [allocationMode, setAllocationMode] = useState(isEdit && editData.allocationMode ? editData.allocationMode : 'capital');
      const [partnersList, setPartnersList] = useState(isEdit && editData.partners ? editData.partners : [{name: 'أنت', amount: '', share: ''}, {name: 'شريك', amount: '', share: ''}]);
      const [formData, setFormData] = useState(isEdit ? {...editData} : { date: new Date().toISOString().split('T')[0], category: initialType === 'transaction' ? 'مصروف الأسرة' : '' });

      const handleSubmit = e => {
        e.preventDefault(); const dId = isEdit ? formData.id : null;
        if(type === 'transaction') {
          const finalCategory = txType === 'income' ? (formData.category || 'إيداع وارد') : formData.category;
          onSave('transaction', { type: txType, amount: parseFloat(formData.amount), wallet, category: finalCategory, date: formData.date }, dId);
        }
        else if(type === 'transfer') {
          const catName = direction === 'bank_to_cash' ? 'سحب كاش من البنك' : 'إيداع كاش للبنك';
          onSave('transaction', { type: 'transfer', direction, amount: parseFloat(formData.amount), category: catName, date: formData.date }, dId);
        }
        else if(type === 'debt') {
          onSave('debt', { type: txType, person: formData.person, amount: parseFloat(formData.amount), paid: parseFloat(formData.paid || 0), date: formData.date }, dId);
        }
        else if(type === 'trust') {
          onSave('trust', { type: txType, person: formData.person, amount: parseFloat(formData.amount), bankRef: formData.bankRef, paid: parseFloat(formData.paid || 0), date: formData.date }, dId);
        }
        else if(type === 'new_partnership') {
          let calculatedTotalCapital = parseFloat(formData.capital || 0);
          if (allocationMode === 'manual') {
            const sum = partnersList.reduce((s, p) => s + parseFloat(p.share || 0), 0);
            if(sum !== 100) return alert('النسب يجب أن تساوى 100%');
          } else {
            calculatedTotalCapital = partnersList.reduce((s, p) => s + parseFloat(p.amount || 0), 0);
            if(calculatedTotalCapital <= 0) return alert('أدخل مبالغ المساهمة بشكل صحيح');
          }
          onSave('new_partnership', { name: (formData.projectName || formData.name), capital: calculatedTotalCapital, allocationMode, wallet, partners: partnersList.map(pt=>({name: pt.name, amount: parseFloat(pt.amount || 0), share: parseFloat(pt.share || 0)})) }, dId);
        }
        else if(type === 'new_project') {
          onSave('new_project', { name: (formData.projectName || formData.name), capital: parseFloat(formData.capital || 0), date: formData.date }, dId);
        }
        else if(type === 'evaluation') {
          if(!formData.projectId) return alert('الرجاء اختيار المشروع');
          onSave('evaluation', { projectId: Number(formData.projectId), totalCash: parseFloat(formData.totalCash), wallet, date: formData.date });
        }
      };

      return (
        <div className="fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center p-4">
          <div className="bg-slate-900 w-full max-w-sm rounded-2xl p-5 border border-slate-700 max-h-[85vh] overflow-y-auto animate-pop shadow-2xl">
            <div className="flex justify-between items-center mb-4"><h2 className="font-bold text-base text-white">{isEdit?'تعديل سجل':'إدخال مالي جديد'}</h2><button onClick={onClose} className="bg-slate-800 hover:bg-slate-700 p-1.5 rounded-lg text-lg transition">❌</button></div>
            {!isEdit && ['transaction', 'transfer', 'debt', 'trust', 'evaluation'].includes(type) && (
              <div className="flex flex-wrap gap-1.5 bg-slate-800 p-1.5 rounded-xl mb-4">
                <button onClick={()=>setType('transaction')} className={`flex-1 py-1.5 rounded-lg text-[11px] font-bold transition ${type==='transaction'?'bg-emerald-500 text-white':'text-slate-400'}`}>تدفق</button>
                <button onClick={()=>setType('transfer')} className={`flex-1 py-1.5 rounded-lg text-[11px] font-bold transition ${type==='transfer'?'bg-emerald-500 text-white':'text-slate-400'}`}>تحويل 🔄</button>
                <button onClick={()=>setType('debt')} className={`flex-1 py-1.5 rounded-lg text-[11px] font-bold transition ${type==='debt'?'bg-emerald-500 text-white':'text-slate-400'}`}>دين</button>
                <button onClick={()=>{setType('trust'); setTxType('external');}} className={`flex-1 py-1.5 rounded-lg text-[11px] font-bold transition ${type==='trust'?'bg-blue-500 text-white':'text-slate-400'}`}>أمانة</button>
                <button onClick={()=>setType('evaluation')} className={`flex-1 py-1.5 rounded-lg text-[11px] font-bold transition ${type==='evaluation'?'bg-emerald-500 text-white':'text-slate-400'}`}>جرد</button>
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4">
              {type === 'transaction' && (
                 <>
                  <div className="flex gap-2"><button type="button" onClick={()=>setTxType('income')} className={`flex-1 py-2.5 rounded-xl border-2 font-bold text-xs transition ${txType==='income'?'border-emerald-500 text-emerald-400 bg-emerald-500/10':'border-slate-700 text-slate-400'}`}>وارد (+)</button><button type="button" onClick={()=>setTxType('expense')} className={`flex-1 py-2.5 rounded-xl border-2 font-bold text-xs transition ${txType==='expense'?'border-red-500 text-red-400 bg-red-500/10':'border-slate-700 text-slate-400'}`}>منصرف (-)</button></div>
                  <div className="flex gap-2"><button type="button" onClick={()=>setWallet('bank')} className={`flex-1 py-2.5 rounded-xl border-2 font-bold text-xs transition ${wallet==='bank'?'bg-blue-500 border-blue-500 text-white shadow-sm':'bg-slate-800 text-slate-400 border-slate-600'}`}>البنك 📱</button><button type="button" onClick={()=>setWallet('cash')} className={`flex-1 py-2.5 rounded-xl border-2 font-bold text-xs transition ${wallet==='cash'?'bg-emerald-500 border-emerald-500 text-white shadow-sm':'bg-slate-800 text-slate-400 border-slate-600'}`}>الكاش 💵</button></div>
                  <input type="number" required placeholder="المبلغ المالي (ج.س)" value={formData.amount||''} onChange={e=>setFormData({...formData, amount: e.target.value})} className="w-full bg-slate-800 text-white p-3 rounded-xl border border-slate-600 text-center font-bold mt-1 text-base focus:outline-none focus:border-emerald-500" />
                  
                  {txType === 'expense' ? (
                    <div className="space-y-1.5"><label className="text-xs text-slate-400 font-medium">تصنيف المنصرف:</label>
                      <select value={formData.category||'مصروف الأسرة'} onChange={e=>setFormData({...formData, category: e.target.value})} className="w-full bg-slate-800 text-white p-3 rounded-xl border border-slate-600 text-sm focus:outline-none">
                        <option value="مصروف الأسرة">مصروف الأسرة</option><option value="مصروف مدرسي">مصروف مدرسي</option><option value="تسوق">تسوق</option><option value="أخرى">أخرى</option>
                      </select>
                    </div>
                  ) : (
                    <div className="space-y-1.5"><label className="text-xs text-slate-400 font-medium">مصدر أو بيان الإيراد (اختياري):</label>
                      <input type="text" placeholder="مثال: أرباح مشروع..." value={formData.category||''} onChange={e=>setFormData({...formData, category: e.target.value})} className="w-full bg-slate-800 text-white p-3 rounded-xl border border-slate-600 text-sm focus:outline-none focus:border-emerald-500" />
                    </div>
                  )}
                 </>
              )}

              {type === 'transfer' && (
                 <>
                  <div className="flex gap-2"><button type="button" onClick={()=>setDirection('bank_to_cash')} className={`flex-1 py-3 rounded-xl border-2 font-bold text-xs transition ${direction==='bank_to_cash'?'bg-blue-500 border-blue-500 text-white shadow-sm':'bg-slate-800 text-slate-400 border-slate-600'}`}>سحب لليد 💵</button><button type="button" onClick={()=>setDirection('cash_to_bank')} className={`flex-1 py-3 rounded-xl border-2 font-bold text-xs transition ${direction==='cash_to_bank'?'bg-emerald-500 border-emerald-500 text-white shadow-sm':'bg-slate-800 text-slate-400 border-slate-600'}`}>إيداع للبنك 📱</button></div>
                  <input type="number" required placeholder="المبلغ المحول" value={formData.amount||''} onChange={e=>setFormData({...formData, amount: e.target.value})} className="w-full bg-slate-800 text-white p-3 rounded-xl border border-slate-600 text-center font-bold mt-2 text-base focus:outline-none" />
                 </>
              )}
              
              {type === 'trust' && (
                 <>
                  <div className="flex gap-2"><button type="button" onClick={()=>setTxType('external')} className={`flex-1 py-2.5 rounded-xl border-2 text-xs font-bold transition ${txType==='external'?'border-blue-500 text-blue-400 bg-blue-500/10':'border-slate-700 text-slate-400'}`}>رصيد بالخارج</button><button type="button" onClick={()=>setTxType('with_me')} className={`flex-1 py-2.5 rounded-xl border-2 text-xs font-bold transition ${txType==='with_me'?'border-orange-500 text-orange-400 bg-orange-500/10':'border-slate-700 text-slate-400'}`}>أمانة بطرفي</button></div>
                  <input type="text" required placeholder="الاسم" value={formData.person||''} onChange={e=>setFormData({...formData, person: e.target.value})} className="w-full bg-slate-800 text-white p-3 rounded-xl border border-slate-600 text-sm focus:outline-none" />
                  <input type="number" required placeholder="المبلغ الكلي للأمانة" value={formData.amount||''} onChange={e=>setFormData({...formData, amount: e.target.value})} className="w-full bg-slate-800 text-white p-3 rounded-xl border border-slate-600 text-sm focus:outline-none" />
                  {isEdit && (
                    <div className="bg-slate-800 p-3 rounded-xl border border-slate-700 space-y-2">
                       <label className="text-xs text-slate-400 font-bold">المبلغ الذي تم سداده/استرداده حتى الآن (لتصحيح الأخطاء):</label>
                       <input type="number" value={formData.paid || ''} onChange={e=>setFormData({...formData, paid: e.target.value})} className="w-full bg-slate-900 text-emerald-400 p-3 rounded-lg border border-slate-600 text-sm focus:outline-none" placeholder="0" />
                    </div>
                  )}
                 </>
              )}

              {type === 'debt' && (
                 <>
                  <div className="flex gap-2"><button type="button" onClick={()=>setTxType('to_me')} className={`flex-1 py-2.5 rounded-xl border-2 text-xs font-bold transition ${txType==='to_me'?'border-emerald-500 text-emerald-400 bg-emerald-500/10':'border-slate-700 text-slate-400'}`}>مستحق لي</button><button type="button" onClick={()=>setTxType('on_me')} className={`flex-1 py-2.5 rounded-xl border-2 text-xs font-bold transition ${txType==='on_me'?'border-red-500 text-red-400 bg-red-500/10':'border-slate-700 text-slate-400'}`}>التزام علي</button></div>
                  <input type="text" required placeholder="اسم الشخص" value={formData.person||''} onChange={e=>setFormData({...formData, person: e.target.value})} className="w-full bg-slate-800 text-white p-3 rounded-xl border border-slate-600 text-sm focus:outline-none" />
                  <input type="number" required placeholder="المبلغ الكلي للدين" value={formData.amount||''} onChange={e=>setFormData({...formData, amount: e.target.value})} className="w-full bg-slate-800 text-white p-3 rounded-xl border border-slate-600 text-sm focus:outline-none" />
                  {isEdit && (
                    <div className="bg-slate-800 p-3 rounded-xl border border-slate-700 space-y-2">
                       <label className="text-xs text-slate-400 font-bold">المبلغ الذي تم سداده/استرداده حتى الآن (لتصحيح الأخطاء):</label>
                       <input type="number" value={formData.paid || ''} onChange={e=>setFormData({...formData, paid: e.target.value})} className="w-full bg-slate-900 text-emerald-400 p-3 rounded-lg border border-slate-600 text-sm focus:outline-none" placeholder="0" />
                    </div>
                  )}
                 </>
              )}

              {type === 'new_project' && (
                 <>
                   <input type="text" required placeholder="اسم المشروع (مثال: التسالي المنزلي)" value={formData.projectName||formData.name||''} onChange={e=>setFormData({...formData, projectName: e.target.value})} className="w-full bg-slate-800 text-white p-3.5 rounded-xl border border-slate-600 text-sm focus:outline-none focus:border-emerald-500" />
                   <input type="number" required placeholder="رأس المال المشغل (ج.س)" value={formData.capital||''} onChange={e=>setFormData({...formData, capital: e.target.value})} className="w-full bg-slate-800 text-white p-3.5 rounded-xl border border-slate-600 text-center font-bold mt-1 focus:outline-none focus:border-emerald-500" />
                 </>
              )}

              {type === 'new_partnership' && (
                <>
                  <input type="text" required placeholder="اسم الشراكة الكبرى" value={formData.projectName||formData.name||''} onChange={e=>setFormData({...formData, projectName: e.target.value})} className="w-full bg-slate-800 text-white p-3 rounded-xl border border-slate-600 text-sm focus:outline-none" />
                  <div className="space-y-2"><label className="text-xs text-slate-400 font-medium">طريقة تقسيم النسب:</label>
                    <div className="flex gap-2 bg-slate-800 p-1.5 rounded-xl border border-slate-700"><button type="button" onClick={()=>setAllocationMode('capital')} className={`flex-1 py-2 rounded-lg text-xs font-bold ${allocationMode==='capital'?'bg-emerald-500 text-white':'text-slate-400'}`}>تلقائي (حسب المال)</button><button type="button" onClick={()=>setAllocationMode('manual')} className={`flex-1 py-2 rounded-lg text-xs font-bold ${allocationMode==='manual'?'bg-emerald-500 text-white':'text-slate-400'}`}>يدوي (حسب المجهود)</button></div>
                  </div>
                  {allocationMode === 'capital' && (
                    <div className="space-y-1.5"><label className="text-xs text-slate-400 font-medium">تمويل حصتك بالمال (أنت):</label>
                      <div className="flex gap-2 bg-slate-800 p-1.5 rounded-xl border border-slate-700"><button type="button" onClick={()=>setWallet('bank')} className={`flex-1 py-2 rounded-lg text-xs font-bold ${wallet==='bank'?'bg-blue-500 text-white':'text-slate-400'}`}>البنك 📱</button><button type="button" onClick={()=>setWallet('cash')} className={`flex-1 py-2 rounded-lg text-xs font-bold ${wallet==='cash'?'bg-emerald-500 text-white':'text-slate-400'}`}>الكاش 💵</button></div>
                    </div>
                  )}
                  {allocationMode === 'manual' && (<input type="number" required placeholder="رأس المال الكلي المتفق عليه" value={formData.capital||''} onChange={e=>setFormData({...formData, capital: e.target.value})} className="w-full bg-slate-800 text-white p-3 rounded-xl border border-slate-600 text-sm focus:outline-none" />)}
                  <div className="pt-4 border-t border-slate-700 mt-2"><p className="text-xs font-bold text-emerald-400 mb-3">الشركاء والأطراف:</p>
                    {partnersList.map((p, i) => (
                      <div key={i} className="flex gap-2 mb-3 items-center">
                        <input type="text" required value={p.name} onChange={e=>{let l=[...partnersList]; l[i].name=e.target.value; setPartnersList(l);}} className="w-2/5 bg-slate-800 text-white p-2.5 rounded-xl border border-slate-600 text-sm focus:outline-none" placeholder="الاسم" />
                        {allocationMode === 'capital' ? (<input type="number" required value={p.amount} onChange={e=>{let l=[...partnersList]; l[i].amount=e.target.value; setPartnersList(l);}} className="w-3/5 bg-slate-800 text-white p-2.5 rounded-xl border border-slate-600 text-center text-sm focus:outline-none" placeholder="كم أودع؟" />) : (<input type="number" required value={p.share} onChange={e=>{let l=[...partnersList]; l[i].share=e.target.value; setPartnersList(l);}} className="w-3/5 bg-slate-800 text-white p-2.5 rounded-xl border border-slate-600 text-center text-sm focus:outline-none" placeholder="نسبته %" />)}
                        {i > 1 && (<button type="button" onClick={()=>setPartnersList(partnersList.filter((_, idx)=>idx!==i))} className="text-red-400 font-bold px-2 text-lg">❌</button>)}
                      </div>
                    ))}
                    <button type="button" onClick={()=>setPartnersList([...partnersList, {name:'', amount:'', share:''} || {}])} className="w-full text-emerald-400 bg-emerald-500/10 py-2.5 rounded-xl text-xs font-bold transition">➕ إضافة شريك</button>
                  </div>
                </>
              )}

              {type === 'evaluation' && (
                <>
                  <div className="flex gap-2 mb-3"><button type="button" onClick={()=>setWallet('bank')} className={`flex-1 py-2.5 rounded-xl border-2 text-xs font-bold transition ${wallet==='bank'?'bg-blue-500 border-blue-500 text-white':'bg-slate-800 text-slate-400 border-slate-600'}`}>أرباح للبنك 📱</button><button type="button" onClick={()=>setWallet('cash')} className={`flex-1 py-2.5 rounded-xl border-2 text-xs font-bold transition ${wallet==='cash'?'bg-emerald-500 border-emerald-500 text-white':'bg-slate-800 text-slate-400 border-slate-600'}`}>أرباح كاش 💵</button></div>
                  <select required value={formData.projectId||''} onChange={e=>setFormData({...formData, projectId: e.target.value})} className="w-full bg-slate-800 text-white p-3 rounded-xl border border-slate-600 mb-3 text-sm focus:outline-none">
                    <option value="">اختر مشروع الشراكة لجرد المال...</option>{ptnrs.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                  </select>
                  <input type="number" required placeholder="إجمالي المال الفعلي بعد الجرد" value={formData.totalCash||''} onChange={e=>setFormData({...formData, totalCash: e.target.value})} className="w-full bg-slate-800 text-white p-3 rounded-xl border border-slate-600 text-sm focus:outline-none" />
                </>
              )}

              <input type="date" required value={formData.date} onChange={e=>setFormData({...formData, date: e.target.value})} className="w-full bg-slate-800 text-white p-3.5 rounded-xl border border-slate-600 text-center text-sm font-bold mt-2 focus:outline-none" />
              <button type="submit" className="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3.5 rounded-xl shadow-lg mt-2 text-sm transition">حفظ السجل</button>
            </form>
          </div>
        </div>
      );
    }

    // --- مودال تخصيص مال التطوير (جديد) ---
    function DevFundModal({ proj, onClose, onSave }) {
       const [amount, setAmount] = useState('');
       const submit = e => { e.preventDefault(); if(amount>0) onSave(proj.id, amount); else alert('الرجاء إدخال مبلغ صحيح'); };
       return (
         <div className="fixed inset-0 bg-slate-950/80 z-50 flex items-end justify-center p-4">
           <div className="bg-slate-900 w-full max-w-sm rounded-3xl p-6 border border-slate-700 mb-10 shadow-2xl animate-pop">
             <h2 className="text-base font-bold text-white mb-2 flex items-center gap-2"><Icons.Settings /> صندوق التطوير للمشروع</h2>
             <p className="text-xs text-slate-400 mb-5 leading-relaxed">اقتطاع وتجميد مبلغ من السيولة المتوفرة بالخزينة لغرض تطوير وإسناد مشروع ({proj.name}). هذا المال لن يمس رصيد الخزينة الفعلي بل سيتم عزله لحمايته.</p>
             <form onSubmit={submit}>
               <input type="number" value={amount} onChange={e=>setAmount(e.target.value)} required className="w-full bg-slate-800 text-white text-center text-2xl font-black p-4 rounded-2xl border border-slate-600 mb-5 focus:outline-none focus:border-yellow-500" placeholder="أدخل القيمة المراد احتجازها" autoFocus />
               <button type="submit" className="w-full bg-yellow-500 hover:bg-yellow-600 text-slate-900 py-3.5 rounded-2xl text-sm font-black shadow-lg transition">تأكيد التخصيص والاحتجاز ⚙️</button>
             </form>
             <button onClick={onClose} className="w-full mt-3 bg-transparent hover:bg-slate-800 text-slate-400 py-3 rounded-2xl text-sm font-bold transition">إلغاء</button>
           </div>
         </div>
       )
    }

    function PaymentModal({ item, onClose, onSave, title, subtitle }) {
      const [amount, setAmount] = useState(''); const [wallet, setWallet] = useState('bank');
      const rem = item.amount - (item.paid || 0);

      const submit = e => { 
        e.preventDefault(); 
        const v = parseFloat(amount); 
        if(v > 0 && v <= rem) onSave(item.id, v, wallet); 
        else alert('المبلغ غير صحيح!');
      };

      return (
        <div className="fixed inset-0 bg-slate-950/80 z-50 flex items-end justify-center p-4">
          <div className="bg-slate-900 w-full max-w-sm rounded-3xl p-5 border border-slate-700 mb-10 animate-pop shadow-2xl">
            <h2 className="text-sm font-bold text-white mb-2">{title}</h2><p className="text-xs text-slate-400 mb-4">{subtitle} {rem.toLocaleString()} ج.س</p>
            <div className="flex gap-2.5 mb-4"><button type="button" onClick={()=>setWallet('bank')} className={`flex-1 py-2.5 rounded-xl text-xs font-bold transition ${wallet==='bank'?'bg-blue-500 text-white shadow-md':'bg-slate-800 text-slate-400 border border-slate-600'}`}>حساب بنكي 📱</button><button type="button" onClick={()=>setWallet('cash')} className={`flex-1 py-2.5 rounded-xl text-xs font-bold transition ${wallet==='cash'?'bg-emerald-500 text-white shadow-md':'bg-slate-800 text-slate-400 border border-slate-600'}`}>كاش نقدي 💵</button></div>
            <form onSubmit={submit}><input type="number" value={amount} onChange={e=>setAmount(e.target.value)} required max={rem} className="w-full bg-slate-800 text-white text-center text-xl font-black p-3.5 rounded-2xl border border-slate-600 mb-4 focus:outline-none focus:border-emerald-500" placeholder="أدخل القيمة" autoFocus /><button type="submit" className="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-3.5 rounded-2xl text-sm font-bold shadow-lg transition">تأكيد ومزامنة</button></form>
            <button onClick={onClose} className="w-full mt-3 bg-transparent text-slate-400 py-3 rounded-2xl text-sm font-bold transition">إلغاء</button>
          </div>
        </div>
      );
    }

    // --- الفواتير ---
    function ReceiptModal({ data, onClose, showToast }) {
      if (!data) return null;

      const safeAmount = data.amount ? parseFloat(data.amount) : 0;
      const safeRef = data.ref || 'غير محدد';
      const safeDate = data.date || new Date().toISOString().split('T')[0];
      const safeTitle = data.title || 'سند مالي';
      const safePerson = data.person || 'عام';

      const receiptText = data.isDetailed 
        ? `🧾 *${safeTitle}*\n-----------------------\n▪️ *الجهة:* ${safePerson}\n▪️ *التاريخ:* ${safeDate}\n-----------------------\n💰 *المبلغ الكلي:* ${safeAmount.toLocaleString()} ج.س\n✅ *المُسدد حتى الآن:* ${(data.paid || 0).toLocaleString()} ج.س\n⚠️ *الرصيد المتبقي:* ${(data.rem || 0).toLocaleString()} ج.س`
        : `🧾 *${safeTitle}*\n-----------------------\n▪️ *رقم السند:* ${safeRef}\n▪️ *التاريخ:* ${safeDate}\n▪️ *الجهة والبيان:* ${safePerson}\n-----------------------\n💰 *المبلغ:* ${safeAmount.toLocaleString()} ج.س`;

      const copyText = () => { triggerHaptic(); navigator.clipboard.writeText(receiptText); showToast('تم نسخ السند بنجاح!'); };

      return (
        <div className="fixed inset-0 bg-slate-950/80 z-[70] flex items-center justify-center p-5 animate-pop">
          <div className="bg-white text-slate-900 w-full max-w-sm rounded-2xl p-5 shadow-2xl" style={{fontFamily: 'monospace'}}>
            <div className="border-b border-dashed border-slate-300 pb-3 mb-4 text-center">
              <h2 className="font-bold text-base">{safeTitle}</h2>
            </div>
            
            {data.isDetailed ? (
               <>
                  <div className="space-y-2.5 text-xs mb-4 font-medium">
                    <div className="flex justify-between"><span>المرجع:</span><span>{safeRef}</span></div>
                    <div className="flex justify-between"><span>التاريخ:</span><span>{safeDate}</span></div>
                    <div className="flex justify-between"><span>الجهة:</span><span className="truncate max-w-[60%]">{safePerson}</span></div>
                  </div>
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2 text-sm font-bold">
                     <div className="flex justify-between text-slate-600"><span>المبلغ الكلي:</span><span>{safeAmount.toLocaleString()}</span></div>
                     <div className="flex justify-between text-emerald-600"><span>المُسدد:</span><span>{(data.paid || 0).toLocaleString()}</span></div>
                     <div className="flex justify-between text-red-600 border-t border-slate-200 pt-2 mt-2"><span>المتبقي:</span><span className="text-lg">{(data.rem || 0).toLocaleString()}</span></div>
                  </div>
               </>
            ) : (
               <>
                  <div className="space-y-2.5 text-xs mb-5 font-medium">
                    <div className="flex justify-between"><span>رقم السند:</span><span>{safeRef}</span></div>
                    <div className="flex justify-between"><span>التاريخ:</span><span>{safeDate}</span></div>
                    <div className="flex justify-between"><span>الجهة/البيان:</span><span className="truncate max-w-[60%]">{safePerson}</span></div>
                  </div>
                  <div className="border-t border-dashed border-slate-300 pt-3 text-center">
                    <h3 className="text-xl font-black text-slate-900">{safeAmount.toLocaleString()} ج.س</h3>
                  </div>
               </>
            )}

            <div className="mt-6 space-y-2.5">
              <button type="button" onClick={()=>{triggerHaptic(); window.location.href=`whatsapp://send?text=${encodeURIComponent(receiptText)}`;}} className="w-full bg-emerald-600 text-white py-2.5 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 shadow-md transition">📱 إرسال للواتساب</button>
              <button type="button" onClick={copyText} className="w-full bg-slate-100 hover:bg-slate-200 text-slate-800 py-2.5 rounded-xl font-bold text-xs transition">📋 نسخ كنص</button>
              <button type="button" onClick={onClose} className="w-full bg-slate-900 text-white py-2.5 rounded-xl font-bold text-xs
