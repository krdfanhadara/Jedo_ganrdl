<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>المحاسب الذكي - الشامل</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, sans-serif; background-color: #0f172a; color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
    input[type=number]::-webkit-inner-spin-button { display: none; }
    .pop { animation: popIn 0.2s ease-out forwards; }
    @keyframes popIn { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { useState, useEffect, useMemo } = React;
  const vib = () => { if (navigator.vibrate) navigator.vibrate(30); };
  
  // دالة مساعدة لحماية التطبيق من الانهيار عند تلف الـ JSON
  const jP = (k) => { try { return JSON.parse(localStorage.getItem(k)) || []; } catch(e) { return []; } };

  const K = { 
    t: 'smart_accountant_tx', d: 'smart_accountant_dbts', 
    p: 'smart_accountant_ptnrs', pj: 'smart_accountant_projects', 
    tr: 'smart_accountant_trusts', a: 'smart_accountant_assets' 
  };
  
  const cx = {
    i: "w-full bg-slate-800 text-white p-3.5 rounded-xl border border-slate-600 text-sm focus:outline-none focus:border-emerald-500",
    b: "w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3.5 rounded-xl shadow-md transition text-sm",
    c: "bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-sm relative",
    m: "fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center p-4",
    mc: "bg-slate-900 w-full max-w-sm rounded-2xl p-5 border border-slate-700 max-h-[85vh] overflow-y-auto pop shadow-2xl",
    ib: "p-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg transition text-lg",
    f: "flex justify-between items-center"
  };

  function Auth({ v, sV, sE, sP, sS, oR, oL, oRp }) {
    const [e, sE_] = useState(''); 
    const [p, sP_] = useState(''); 
    const [s, sS_] = useState('');
    
    useEffect(() => { if (sE) sE_(sE); }, [sE]);
    
    const sub = ev => {
      ev.preventDefault(); vib();
      if (v === 'register') {
        if (!e || p.length < 4 || !s) return alert('بيانات غير مكتملة');
        oR(e.toLowerCase(), p, s.trim());
      } else if (v === 'login') {
        if (e.toLowerCase() === sE.toLowerCase() && p === sP) oL(); else alert('خطأ في البيانات!');
      } else {
        if ((e || '').toLowerCase() === (sE || '').toLowerCase() && (s || '').trim() === (sS || '').trim()) {
          const np = prompt('الرمز الجديد:'); 
          if (np && np.length >= 4) oRp(np); else alert('مرفوض');
        } else alert('خطأ!');
      }
    };

    return (
      <div className={cx.m}>
        <div className={cx.mc}>
          <h1 className="text-xl font-bold text-white text-center mb-6">🔐 المحاسب الذكي</h1>
          <form onSubmit={sub} className="space-y-4">
            <input type="email" required placeholder="البريد الإلكتروني" value={e} onChange={x => sE_(x.target.value)} className={cx.i} />
            {v !== 'forgot' && <input type="password" required placeholder="كلمة المرور" value={p} onChange={x => sP_(x.target.value)} className={cx.i} />}
            {(v === 'register' || v === 'forgot') && <input type="text" required placeholder="سؤال الأمان: مدينتك المفضلة؟" value={s} onChange={x => sS_(x.target.value)} className={cx.i + " text-emerald-400"} />}
            <button type="submit" className={cx.b}>{v === 'login' ? 'دخول' : v === 'register' ? 'إنشاء ملف' : 'استعادة'}</button>
          </form>
          <div className="mt-5 flex flex-col gap-3 text-center text-sm">
            {v === 'login' ? (
              <>
                <button type="button" onClick={() => sV('forgot')} className="text-slate-400">نسيت الرمز؟</button>
                <button type="button" onClick={() => sV('register')} className="text-emerald-400 font-bold">ملف جديد ➕</button>
              </>
            ) : (
              <button type="button" onClick={() => sV('login')} className="text-slate-400">عودة للدخول 🔑</button>
            )}
          </div>
        </div>
      </div>
    );
  }

  function App() {
    const [auth, setAuth] = useState(() => localStorage.getItem('sa_ses') === '1');
    const [vw, setVw] = useState('login');
    const [sE, setSE] = useState(() => localStorage.getItem('sa_em') || '');
    const [sP, setSP] = useState(() => localStorage.getItem('sa_pw') || '1234');
    const [sS, setSS] = useState(() => localStorage.getItem('sa_sec') || '');
    
    const [tab, setTab] = useState('dash');
    const [qA, setQA] = useState(false);
    const [qT, setQT] = useState('transaction');
    const [eD, setED] = useState(null);
    const [pM, setPM] = useState(null);
    const [tM, setTM] = useState(null);
    const [dM, setDM] = useState(null);
    const [spM, setSpM] = useState(null);
    const [plM, setPlM] = useState(null);
    const [rM, setRM] = useState(null);
    const [tst, setTst] = useState(null);
    
    const [txs, setTxs] = useState(() => jP(K.t));
    const [dbs, setDbs] = useState(() => jP(K.d));
    const [pts, setPts] = useState(() => jP(K.p));
    const [pjs, setPjs] = useState(() => jP(K.pj));
    const [trs, setTrs] = useState(() => jP(K.tr));
    const [ast, setAst] = useState(() => jP(K.a));
    const [lBkp, setLBkp] = useState(() => Number(localStorage.getItem('sa_bkp')) || 0);

    useEffect(() => { localStorage.setItem(K.t, JSON.stringify(txs)); }, [txs]);
    useEffect(() => { localStorage.setItem(K.d, JSON.stringify(dbs)); }, [dbs]);
    useEffect(() => { localStorage.setItem(K.p, JSON.stringify(pts)); }, [pts]);
    useEffect(() => { localStorage.setItem(K.pj, JSON.stringify(pjs)); }, [pjs]);
    useEffect(() => { localStorage.setItem(K.tr, JSON.stringify(trs)); }, [trs]);
    
    useEffect(() => {
      const syncD = e => {
        if (e.key === K.a) setAst(jP(K.a));
        if (e.key === K.t) setTxs(jP(K.t));
        if (e.key === K.d) setDbs(jP(K.d));
      };
      window.addEventListener('storage', syncD);
      return () => window.removeEventListener('storage', syncD);
    }, []);

    useEffect(() => { if (!localStorage.getItem('sa_em')) setVw('register'); }, []);

    const shT = m => { setTst(m); setTimeout(() => setTst(null), 3000); };

    const clc = useMemo(() => {
      const sIn = txs.filter(t => t.type === 'income').reduce((a, c) => a + c.amount, 0);
      const sOut = txs.filter(t => t.type === 'expense').reduce((a, c) => a + c.amount, 0);
      const aEx = trs.filter(t => t.type === 'external').reduce((a, t) => a + (t.amount - (t.paid || 0)), 0);
      const aWm = trs.filter(t => t.type === 'with_me').reduce((a, t) => a + (t.amount - (t.paid || 0)), 0);
      const pTm = dbs.filter(d => d.type === 'to_me').reduce((a, d) => a + (d.amount - (d.paid || 0)), 0);
      const pOm = dbs.filter(d => d.type === 'on_me').reduce((a, d) => a + (d.amount - (d.paid || 0)), 0);
      const tA = ast.reduce((s, a) => s + parseFloat(a.currentValue || 0), 0);
      const tDf = pjs.reduce((a, p) => a + (parseFloat(p.devFund) || 0), 0);
      
      const mPc = pts.reduce((t, p) => {
        if (p.allocationMode === 'capital') {
          const m = p.partners?.find(x => x.name === 'أنت');
          return t + (m ? parseFloat(m.amount || 0) : 0);
        }
        return t;
      }, 0);

      let bB = 0; let cB = 0;
      txs.forEach(t => {
        const a = parseFloat(t.amount || 0);
        if (t.wallet === 'bank') {
          if (['income', 'trust_bank_in'].includes(t.type)) bB += a;
          if (['expense', 'trust_bank_out'].includes(t.type)) bB -= a;
        } else if (t.wallet === 'cash') {
          if (t.type === 'income') cB += a;
          if (t.type === 'expense') cB -= a;
        }
        if (t.type === 'transfer') {
          if (t.direction === 'cash_to_bank') { bB += a; cB -= a; }
          if (t.direction === 'bank_to_cash') { bB -= a; cB += a; }
        }
      });

      pts.forEach(p => {
        if (p.allocationMode === 'capital') {
          const m = p.partners?.find(x => x.name === 'أنت');
          if (m) {
            const a = parseFloat(m.amount || 0);
            if (p.wallet === 'bank') bB -= a; else cB -= a;
          }
        }
      });

      cB += aWm; 
      const tAc = bB + cB; 
      const aOc = tAc - aWm; 
      const nW = aOc + aEx + pTm + mPc + tA - pOm;
      
      return { tAc, aOc, aWm, nW, mPc, tA, pTm, pOm, aEx, tDf, bB, cB, tIn: sIn, tOut: sOut };
    }, [txs, dbs, trs, pts, pjs, ast]);

    const delI = (t, id) => {
      vib();
      if (t === 'ptnr') {
        const p = pts.find(x => x.id === id); if (!p) return;
        if (window.confirm('حذف الشراكة مع إبقاء الأرباح؟')) {
          setPts(pts.filter(x => x.id !== id)); shT('حُذف');
        } else if (window.confirm('تطهير الأرباح كاملة من الخزينة؟')) {
          setPts(pts.filter(x => x.id !== id));
          setTxs(txs.filter(x => !(x.category || '').includes(p.name))); shT('طُهّر');
        }
        return;
      }
      if (t === 'project') {
        const p = pjs.find(x => x.id === id); if (!p) return;
        if (window.confirm('حذف المشروع مع إبقاء أرباحه وحركاته السابقة في الخزينة؟ (للاحتفاظ بالسيولة)')) {
          setPjs(pjs.filter(x => x.id !== id)); shT('حُذف المشروع فقط');
        } else if (window.confirm('تأكيد: تطهير الخزينة من كل أرباح ومصروفات هذا المشروع؟ (تصفية تامة)')) {
          setPjs(pjs.filter(x => x.id !== id));
          setTxs(txs.filter(x => !(x.category || '').includes(p.name))); shT('تم الحذف والتطهير الكلي');
        }
        return;
      }
      if (window.confirm('تأكيد الحذف من الخزينة؟')) {
        if (t === 'tx') {
          // --- بداية الإصلاح: إرجاع مال التطوير للمشروع عند حذف الحركة ---
          const txToDel = txs.find(x => x.id === id);
          if (txToDel && (txToDel.category || '').startsWith('مصروف تطوير (')) {
            const pName = txToDel.category.match(/\((.*?)\)/)?.[1];
            if (pName) {
              setPjs(pjs.map(p => p.name === pName ? { ...p, devFund: (p.devFund || 0) + parseFloat(txToDel.amount) } : p));
            }
          }
          // --- نهاية الإصلاح ---
          setTxs(txs.filter(x => x.id !== id));
        }
        if (t === 'debt') setDbs(dbs.filter(x => x.id !== id));
        if (t === 'trust') setTrs(trs.filter(x => x.id !== id));
        shT('تم الحذف');
      }
    };

    const rst = () => {
      vib();
      if (window.confirm('تصفير كلي للحسابات؟')) {
        setTxs([]); setDbs([]); setPts([]); setPjs([]); setTrs([]);
        localStorage.removeItem(K.t); localStorage.removeItem(K.d);
        localStorage.removeItem(K.p); localStorage.removeItem(K.pj);
        localStorage.removeItem(K.tr); shT('تم تصفير النظام');
      }
    };

    const savI = (t, d, id = null) => {
      vib(); const di = id || Date.now();
      if (t === 'transaction') {
        if (id) setTxs(txs.map(x => x.id === id ? { ...x, ...d } : x));
        else setTxs([{ id: di, ...d }, ...txs]); shT('تم الحفظ');
      } else if (t === 'debt') {
        if (id) setDbs(dbs.map(x => x.id === id ? { ...x, ...d } : x));
        else setDbs([{ id: di, paid: 0, ...d }, ...dbs]); shT('حُفظ');
      } else if (t === 'trust') {
        if (id) setTrs(trs.map(x => x.id === id ? { ...x, ...d } : x));
        else setTrs([{ id: di, paid: 0, ...d }, ...trs]); shT('حُفظ');
      } else if (t === 'new_partnership') {
        if (id) setPts(pts.map(x => x.id === id ? { ...x, ...d } : x));
        else setPts([{ id: di, evaluations: [], ...d }, ...pts]); shT('تم الحفظ');
      } else if (t === 'new_project') {
        if (id) setPjs(pjs.map(x => x.id === id ? { ...x, ...d } : x));
        else setPjs([{ id: di, devFund: 0, ...d }, ...pjs]); shT('تم الحفظ');
      } else if (t === 'evaluation') {
        let mp = 0; let pn = '';
        setPts(pts.map(p => {
          if (p.id === Number(d.projectId)) {
            pn = p.name;
            const pr = parseFloat(d.totalCash || 0) - parseFloat(p.capital || 0);
            if (pr > 0) {
              const tcp = p.allocationMode === 'capital' ? p.partners.reduce((s, x) => s + parseFloat(x.amount || 0), 0) || 1 : parseFloat(p.capital || 0);
              let sr = 0; const me = p.partners.find(x => x.name === 'أنت');
              if (me) {
                if (p.allocationMode === 'capital') sr = parseFloat(me.amount || 0) / tcp;
                else sr = parseFloat(me.share || 0) / 100;
              }
              mp = pr * sr;
            }
            return { ...p, evaluations: [...(p.evaluations || []), { id: Date.now(), ...d }] };
          }
          return p;
        }));
        if (mp > 0) {
          setTxs(p => [{ id: Date.now() + 5, type: 'income', amount: parseFloat(mp.toFixed(2)), wallet: d.wallet, category: `أرباح جرد (${pn})`, date: d.date }, ...p]);
          shT(`أرباح الجرد: +${mp.toLocaleString()}`);
        } else shT('تم الجرد');
      }
      setQA(false); setED(null);
    };

    const svDf = (id, a) => {
      vib(); setPjs(pjs.map(p => p.id === id ? { ...p, devFund: (p.devFund || 0) + parseFloat(a) } : p));
      setDM(null); shT('تم احتجاز مال التطوير ⚙️');
    };
    
    const dDf = (id) => {
      vib(); setPjs(pjs.map(p => p.id === id ? { ...p, devFund: 0 } : p));
      shT('تم إلغاء التخصيص 🗑️');
    };
    
    const spDf = (id, a, w) => {
      vib(); let pn = '';
      setPjs(pjs.map(p => {
        if (p.id === id) { pn = p.name; return { ...p, devFund: (p.devFund || 0) - a }; }
        return p;
      }));
      setSpM(null);
      setTxs(x => [{ id: Date.now(), type: 'expense', amount: a, wallet: w, category: `مصروف تطوير (${pn})`, date: new Date().toISOString().split('T')[0] }, ...x]);
      shT('تم صرف التطوير وتقييد المنصرف 💸');
    };

    const pDb = (id, a, w) => {
      vib(); let cd = null;
      setDbs(dbs.map(d => { if (d.id === id) { cd = d; return { ...d, paid: (d.paid || 0) + a }; } return d; }));
      setPM(null);
      if (cd) {
        const tm = cd.type === 'to_me';
        setTxs(p => [{ id: Date.now(), type: tm ? 'income' : 'expense', amount: a, wallet: w, category: tm ? `استرداد من (${cd.person})` : `سداد لـ (${cd.person})`, date: new Date().toISOString().split('T')[0] }, ...p]);
        shT('تم السداد');
      }
    };

    const pTr = (id, a, w) => {
      vib(); let ct = null;
      setTrs(trs.map(t => { if (t.id === id) { ct = t; return { ...t, paid: (t.paid || 0) + a }; } return t; }));
      setTM(null);
      if (ct) {
        if (w === 'bank') {
          const ex = ct.type === 'external';
          setTxs(p => [{ id: Date.now(), type: ex ? 'trust_bank_in' : 'trust_bank_out', amount: a, wallet: 'bank', category: ex ? `استرداد أمانة (${ct.person})` : `تسليم أمانة (${ct.person})`, date: new Date().toISOString().split('T')[0] }, ...p]);
        }
        shT('تم التحديث');
      }
    };

    const bkpD = async () => {
      vib();
      const f = { tx: txs, db: dbs, pt: pts, prj: pjs, tr: trs, ast: ast };
      const b = btoa(unescape(encodeURIComponent(JSON.stringify(f))));
      const t = `[أرشيف]\n${new Date().toLocaleDateString('ar-EG')}\n\n${b}`;
      const n = Date.now(); setLBkp(n); localStorage.setItem('sa_bkp', n);
      try {
        if (navigator.share) await navigator.share({ title: 'أرشيف', text: t });
        else { await navigator.clipboard.writeText(t); shT('نُسخ الكود للمزامنة'); }
      } catch (e) { shT('تم التحديث'); }
    };

    const resD = s => {
      vib();
      try {
        const e = s.match(/[A-Za-z0-9+/=]{50,}/)?.[0] || s.trim();
        const d = JSON.parse(decodeURIComponent(escape(atob(e))));
        if (d.tx && d.db) {
          setTxs(d.tx); setDbs(d.db); setPts(d.pt || []); setPjs(d.prj || []); setTrs(d.tr || []);
          if(d.ast) setAst(d.ast);
          const n = Date.now(); setLBkp(n); localStorage.setItem('sa_bkp', n);
          shT('تمت الاستعادة بنجاح');
        } else alert('تالف');
      } catch (e) { alert('فشل فك التشفير'); }
    };

    const expC = () => {
      vib(); if (txs.length === 0) return alert('لا حركات');
      let c = "data:text/csv;charset=utf-8,\uFEFFالتاريخ,الخزنة,النوع,البيان,المبلغ\r\n";
      txs.forEach(t => {
        const ts = t.type === 'income' ? 'إيداع' : (t.type === 'expense' ? 'منصرف' : 'تحويل');
        const ws = t.wallet === 'bank' ? 'بنك' : 'كاش';
        const cc = (t.category || '').replace(/,/g, '-');
        c += `${t.date},${ws},${ts},${cc},${t.amount}\r\n`;
      });
      const l = document.createElement("a"); l.setAttribute("href", encodeURI(c)); l.setAttribute("download", `حركات.csv`);
      document.body.appendChild(l); l.click(); document.body.removeChild(l); shT('تم التصدير');
    };

    if (!auth) return <Auth v={vw} sV={setVw} sE={sE} sP={sP} sS={sS} oR={(e, p, s) => { localStorage.setItem('sa_em', e); localStorage.setItem('sa_pw', p); localStorage.setItem('sa_sec', s); localStorage.setItem('sa_ses', '1'); setSE(e); setSP(p); setSS(s); setAuth(true); }} oL={() => { localStorage.setItem('sa_ses', '1'); setAuth(true); }} oRp={np => { localStorage.setItem('sa_pw', np); setSP(np); setVw('login'); }} />;

    return (
      <div className="pb-28">
        {tst && <div className="fixed top-6 left-4 right-4 z-[100] bg-emerald-500 text-white px-4 py-3 rounded-xl flex items-center gap-3 shadow-xl border border-emerald-400/20 pop max-w-sm mx-auto">✅ <span className="text-sm font-bold">{tst}</span></div>}
        
        <header className={cx.c + " rounded-none sticky top-0 z-10 " + cx.f}>
          <div className="flex items-center gap-3">
            <div className="bg-emerald-500 p-2.5 rounded-xl text-white text-xl">💼</div>
            <div><h1 className="font-bold text-white text-base">المحاسب الذكي</h1><p className="text-[11px] text-emerald-400">إدارة السيولة والخزن</p></div>
          </div>
          <div className="flex items-center gap-2">
            <a href="assets.html" onClick={vib} className="flex items-center gap-1 bg-yellow-600 text-white text-xs px-3 py-2 rounded-lg font-bold">🏢 الأصول</a>
            <button onClick={() => { vib(); localStorage.removeItem('sa_ses'); setAuth(false); setVw('login'); }} className="text-slate-300 text-xs px-3 py-2 border border-slate-700 rounded-lg">🚪</button>
          </div>
        </header>

        <main className="p-4 max-w-md mx-auto">
          {tab === 'dash' && <Dash c={clc} txs={txs} lb={lBkp} oD={id => delI('tx', id)} oE={t => { setQT('transaction'); setED(t); setQA(true); }} oR={r => setRM(r)} />}
          
          {tab === 'bus' && <Bus pts={pts} pjs={pjs} 
            aPt={() => { setQT('new_partnership'); setED(null); setQA(true); }} 
            ePt={p => { setQT('new_partnership'); setED(p); setQA(true); }} 
            dPt={id => delI('ptnr', id)} 
            aPj={() => { setQT('new_project'); setED(null); setQA(true); }} 
            ePj={p => { setQT('new_project'); setED(p); setQA(true); }} 
            dPj={id => delI('project', id)} 
            oDf={p => { vib(); setDM(p); }} 
            dDf={dDf} 
            oSp={p => { vib(); if ((p.devFund || 0) <= 0) return alert('لا يوجد رصيد للصرف'); setSpM({ id: p.id, amount: p.devFund, name: p.name }); }} 
            cI={p => { setQT('transaction'); setED({ category: `أرباح مشروع (${p.name})`, amount: '', wallet: 'cash', type: 'income', date: new Date().toISOString().split('T')[0] }); setQA(true); }} 
            oR={r => setRM(r)} 
            oPl={p => { vib(); setPlM(p); }} 
          />}

      ? `🧾 *${ti}*\n------------------\n▪️ الجهة: ${pr}\n▪️ التاريخ: ${dt}\n------------------\n💰 الإجمالي: ${a.toLocaleString()} ج\n✅ مُسدد: ${(d.paid || 0).toLocaleString()} ج\n⚠️ متبقي: ${(d.rem || 0).toLocaleString()} ج` 
      : `🧾 *${ti}*\n------------------\n▪️ المرجع: ${rf}\n▪️ التاريخ: ${dt}\n▪️ البيان: ${pr}\n------------------\n💰 المبلغ: ${a.toLocaleString()} ج`;
    
    const cp = () => { vib(); navigator.clipboard.writeText(t); sT('تم النسخ للحافظة'); };
    
    return (
      <div className={cx.m + " z-[70]"}>
        <div className="bg-white text-slate-900 w-full max-w-sm rounded-3xl p-6 shadow-2xl font-mono">
          <h2 className="font-bold text-center border-b border-dashed border-slate-300 pb-3 mb-4 text-base">{ti}</h2>
          {d.isDetailed ? (
            <>
              <div className="space-y-2.5 text-xs mb-5 font-medium">
                <div className={cx.f}><span>المرجع:</span><span>{rf}</span></div>
                <div className={cx.f}><span>التاريخ:</span><span>{dt}</span></div>
                <div className={cx.f}><span>الجهة:</span><span className="truncate max-w-[60%]">{pr}</span></div>
              </div>
              <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2 text-sm font-bold">
                <div className={cx.f + " text-slate-600"}><span>الإجمالي:</span><span>{a.toLocaleString()}</span></div>
                <div className={cx.f + " text-emerald-600"}><span>الحركة:</span><span>{(d.paid || 0).toLocaleString()}</span></div>
                <div className={cx.f + " text-red-600 border-t border-slate-200 pt-2 mt-2"}><span>متبقي:</span><span className="text-lg">{(d.rem || 0).toLocaleString()}</span></div>
              </div>
            </>
          ) : (
            <>
              <div className="space-y-2.5 text-xs mb-6 font-medium">
                <div className={cx.f}><span>المرجع:</span><span>{rf}</span></div>
                <div className={cx.f}><span>التاريخ:</span><span>{dt}</span></div>
                <div className={cx.f}><span>البيان:</span><span className="truncate max-w-[60%]">{pr}</span></div>
              </div>
              <div className="border-t border-dashed border-slate-300 pt-4 text-center">
                <h3 className="text-2xl font-black">{a.toLocaleString()} <span className="text-sm font-normal">ج</span></h3>
              </div>
            </>
          )}
          <div className="mt-6 space-y-3">
            <button type="button" onClick={() => { vib(); window.location.href = `whatsapp://send?text=${encodeURIComponent(t)}`; }} className="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold text-xs shadow-md">📱 إرسال للواتساب</button>
            <button type="button" onClick={cp} className="w-full bg-slate-100 hover:bg-slate-200 text-slate-800 py-3 rounded-xl font-bold text-xs transition">📋 نسخ كنص</button>
            <button type="button" onClick={oC} className="w-full bg-slate-900 text-white py-3 rounded-xl font-bold text-xs">إغلاق النافذة ❌</button>
          </div>
        </div>
      </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('root')); 
  root.render(<App />);
</script>
</body>
