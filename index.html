</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo}=React;
const cx={i:"w-full bg-slate-800 text-white p-3 rounded-xl border border-slate-600 text-sm focus:outline-none focus:border-emerald-500",b:"w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3.5 rounded-xl shadow-md transition text-sm",c:"bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-sm relative",m:"fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center p-4",mc:"bg-slate-900 w-full max-w-sm rounded-2xl p-5 border border-slate-700 max-h-[85vh] overflow-y-auto pop shadow-2xl",ib:"p-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg transition",f:"flex justify-between items-center"};
const Ic={
 W:()=><svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4M3 5v14a2 2 0 0 0 2 2h16v-5M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>,
 H:()=><svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
 B:()=><svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>,
 C:()=><svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>,
 S:()=><svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
 St:()=><svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 5.4 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1-2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
 R:()=><svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/></svg>,
 T:()=><svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/></svg>,
 E:()=><svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>,
 Ck:()=><svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="20 6 9 17 4 12"/></svg>,
 Sh:()=><svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4Z"/></svg>,
 Cl:()=><svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>,
 D:()=><svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>,
 Ex:()=><svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2M8 17h2M14 13h2M14 17h2"/></svg>,
 Ar:()=><svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M8 3 4 7l4 4M4 7h16m-4 14 4-4-4-4M20 17H4"/></svg>,
 Bld:()=><svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><path d="M9 22v-4h6v4M8 6h2M14 6h2M8 10h2M14 10h2M8 14h2M14 14h2"/></svg>
};
const vib=()=>{if(navigator.vibrate)navigator.vibrate(30)};
const gL=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d;}catch(e){return d;}};
const sL=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const K={t:'smart_accountant_tx',d:'smart_accountant_dbts',p:'smart_accountant_ptnrs',pj:'smart_accountant_projects',tr:'smart_accountant_trusts',a:'smart_accountant_assets'};

function Auth({v,sV,sE,sP,sS,oR,oL,oRp}){
 const [e,sE_]=useState('');const [p,sP_]=useState('');const [s,sS_]=useState('');
 useEffect(()=>{if(sE)sE_(sE);},[sE]);
 const sub=ev=>{
  ev.preventDefault();vib();
  if(v==='register'){if(!e||p.length<4||!s)return alert('بيانات غير مكتملة');oR(e.toLowerCase(),p,s.trim());}
  else if(v==='login'){if(e.toLowerCase()===sE.toLowerCase()&&p===sP)oL();else alert('خطأ!');}
  else{if(e.toLowerCase()===sE.toLowerCase()&&s.trim()===sS.trim()){const np=prompt('الرمز الجديد:');if(np&&np.length>=4)oRp(np);else alert('مرفوض');}else alert('خطأ!');}
 };
 return(
  <div className={cx.m}><div className={cx.mc}><h1 className="text-xl font-bold text-white text-center mb-6">🔐 المحاسب الذكي</h1><form onSubmit={sub} className="space-y-4"><input type="email" required placeholder="البريد الإلكتروني" value={e} onChange={x=>sE_(x.target.value)} className={cx.i} />{v!=='forgot'&&<input type="password" required placeholder="كلمة المرور" value={p} onChange={x=>sP_(x.target.value)} className={cx.i} />}{(v==='register'||v==='forgot')&&<input type="text" required placeholder="سؤال الأمان: مدينتك المفضلة؟" value={s} onChange={x=>sS_(x.target.value)} className={cx.i+" text-emerald-400"} />}<button type="submit" className={cx.b}>{v==='login'?'دخول':v==='register'?'إنشاء ملف':'استعادة'}</button></form><div className="mt-5 flex flex-col gap-3 text-center text-sm">{v==='login'?(<><button type="button" onClick={()=>sV('forgot')} className="text-slate-400">نسيت الرمز؟</button><button type="button" onClick={()=>sV('register')} className="text-emerald-400 font-bold">ملف جديد ➕</button></>):(<button type="button" onClick={()=>sV('login')} className="text-slate-400">عودة للدخول 🔑</button>)}</div></div></div>
 );
}

function App(){
 const [auth,setAuth]=useState(()=>localStorage.getItem('sa_ses')==='1');const [vw,setVw]=useState('login');
 const [sE,setSE]=useState(()=>localStorage.getItem('sa_em')||'');const [sP,setSP]=useState(()=>localStorage.getItem('sa_pw')||'1234');const [sS,setSS]=useState(()=>localStorage.getItem('sa_sec')||'');
 const [tab,setTab]=useState('dash');const [qA,setQA]=useState(false);const [qT,setQT]=useState('transaction');
 const [eD,setED]=useState(null);const [pM,setPM]=useState(null);const [tM,setTM]=useState(null);const [dM,setDM]=useState(null);const [rM,setRM]=useState(null);const [tst,setTst]=useState(null);
 const [txs,setTxs]=useState(()=>gL(K.t,[]));const [dbs,setDbs]=useState(()=>gL(K.d,[]));const [pts,setPts]=useState(()=>gL(K.p,[]));const [pjs,setPjs]=useState(()=>gL(K.pj,[]));const [trs,setTrs]=useState(()=>gL(K.tr,[]));const [ast]=useState(()=>gL(K.a,[]));
 const [lBkp,setLBkp]=useState(()=>Number(localStorage.getItem('sa_bkp'))||0);

 useEffect(()=>{sL(K.t,txs);},[txs]);useEffect(()=>{sL(K.d,dbs);},[dbs]);useEffect(()=>{sL(K.p,pts);},[pts]);useEffect(()=>{sL(K.pj,pjs);},[pjs]);useEffect(()=>{sL(K.tr,trs);},[trs]);
 const shT=m=>{setTst(m);setTimeout(()=>setTst(null),3000);};
 useEffect(()=>{if(!localStorage.getItem('sa_em'))setVw('register');},[]);

 const clc=useMemo(()=>{
  const sIn=txs.filter(t=>t.type==='income').reduce((a,c)=>a+c.amount,0);const sOut=txs.filter(t=>t.type==='expense').reduce((a,c)=>a+c.amount,0);
  const aEx=trs.filter(t=>t.type==='external').reduce((a,t)=>a+(t.amount-(t.paid||0)),0);const aWm=trs.filter(t=>t.type==='with_me').reduce((a,t)=>a+(t.amount-(t.paid||0)),0);
  const pTm=dbs.filter(d=>d.type==='to_me').reduce((a,d)=>a+(d.amount-(d.paid||0)),0);const pOm=dbs.filter(d=>d.type==='on_me').reduce((a,d)=>a+(d.amount-(d.paid||0)),0);
  const tA=ast.reduce((s,a)=>s+parseFloat(a.currentValue||0),0);const tDf=pjs.reduce((a,p)=>a+(parseFloat(p.devFund)||0),0);
  const mPc=pts.reduce((t,p)=>{if(p.allocationMode==='capital'){const m=p.partners?.find(x=>x.name==='أنت');return t+(m?parseFloat(m.amount||0):0);}return t;},0);
  let bB=0;let cB=0;
  txs.forEach(t=>{const a=parseFloat(t.amount||0);if(t.wallet==='bank'){if(['income','trust_bank_in'].includes(t.type))bB+=a;if(['expense','trust_bank_out'].includes(t.type))bB-=a;}else if(t.wallet==='cash'){if(t.type==='income')cB+=a;if(t.type==='expense')cB-=a;}if(t.type==='transfer'){if(t.direction==='cash_to_bank'){bB+=a;cB-=a;}if(t.direction==='bank_to_cash'){bB-=a;cB+=a;}}});
  pts.forEach(p=>{if(p.allocationMode==='capital'){const m=p.partners?.find(x=>x.name==='أنت');if(m){const a=parseFloat(m.amount||0);if(p.wallet==='bank')bB-=a;else cB-=a;}}});
  cB+=aWm;const tAc=bB+cB;const aOc=tAc-aWm;const nW=aOc+aEx+pTm+mPc+tA-pOm;
  return{tAc,aOc,aWm,nW,mPc,tA,pTm,pOm,aEx,tDf,bB,cB,tIn:sIn,tOut:sOut};
 },[txs,dbs,trs,pts,pjs,ast]);

 const delI=(t,id)=>{vib();if(t==='ptnr'){const p=pts.find(x=>x.id===id);if(!p)return;if(window.confirm('حذف مع إبقاء الأرباح؟')){setPts(pts.filter(x=>x.id!==id));shT('حُذف');}else if(window.confirm('تطهير الأرباح كاملة؟')){setPts(pts.filter(x=>x.id!==id));setTxs(txs.filter(x=>!(x.category||'').includes(p.name)));shT('طُهّر');}return;}if(t==='project'){if(window.confirm('حذف المشروع التجاري؟')){setPjs(pjs.filter(p=>p.id!==id));shT('حُذف');}return;}if(window.confirm('تأكيد الحذف؟')){if(t==='tx')setTxs(txs.filter(x=>x.id!==id));if(t==='debt')setDbs(dbs.filter(x=>x.id!==id));if(t==='trust')setTrs(trs.filter(x=>x.id!==id));shT('تم الحذف');}};
 const rst=()=>{vib();if(window.confirm('تصفير كلي للحسابات؟')){setTxs([]);setDbs([]);setPts([]);setPjs([]);setTrs([]);localStorage.removeItem(K.t);localStorage.removeItem(K.d);localStorage.removeItem(K.p);localStorage.removeItem(K.pj);localStorage.removeItem(K.tr);shT('صُفّر');}};
 const savI=(t,d,id=null)=>{vib();const di=id||Date.now();if(t==='transaction'){if(id)setTxs(txs.map(x=>x.id===id?{...x,...d}:x));else setTxs([{id:di,...d},...txs]);shT('حُفظ');}else if(t==='debt'){if(id)setDbs(dbs.map(x=>x.id===id?{...x,...d}:x));else setDbs([{id:di,paid:0,...d},...dbs]);shT('حُفظ');}else if(t==='trust'){if(id)setTrs(trs.map(x=>x.id===id?{...x,...d}:x));else setTrs([{id:di,paid:0,...d},...trs]);shT('حُفظ');}else if(t==='new_partnership'){if(id)setPts(pts.map(x=>x.id===id?{...x,...d}:x));else setPts([{id:di,evaluations:[],...d},...pts]);shT('حُفظ');}else if(t==='new_project'){if(id)setPjs(pjs.map(x=>x.id===id?{...x,...d}:x));else setPjs([{id:di,devFund:0,...d},...pjs]);shT('حُفظ');}else if(t==='evaluation'){let mp=0;let pn='';setPts(pts.map(p=>{if(p.id===Number(d.projectId)){pn=p.name;const tc=parseFloat(d.totalCash||0);const fc=parseFloat(p.capital||0);const pr=tc-fc;if(pr>0){const tcp=p.allocationMode==='capital'?p.partners.reduce((s,x)=>s+parseFloat(x.amount||0),0)||1:fc;let sr=0;const me=p.partners.find(x=>x.name==='أنت');if(me){if(p.allocationMode==='capital')sr=parseFloat(me.amount||0)/tcp;else sr=parseFloat(me.share||0)/100;}mp=pr*sr;}return{...p,evaluations:[...(p.evaluations||[]),{id:Date.now(),...d}]};}return p;}));if(mp>0){setTxs(p=>[{id:Date.now()+5,type:'income',amount:parseFloat(mp.toFixed(2)),wallet:d.wallet,category:`أرباح جرد (${pn})`,date:d.date},...p]);shT(`تم הגرد (+${mp.toLocaleString()})`);}else shT('تم الجرد');}setQA(false);setED(null);};
 const svDf=(id,a)=>{vib();setPjs(pjs.map(p=>p.id===id?{...p,devFund:(p.devFund||0)+parseFloat(a)}:p));setDM(null);shT('تم التخصيص ⚙️');};
 const dDf=(id)=>{vib();setPjs(pjs.map(p=>p.id===id?{...p,devFund:0}:p));shT('صُفّر التطوير 🗑️');};
 const pDb=(id,a,w)=>{vib();let cd=null;setDbs(dbs.map(d=>{if(d.id===id){cd=d;return{...d,paid:(d.paid||0)+a};}return d;}));setPM(null);if(cd){const tm=cd.type==='to_me';setTxs(p=>[{id:Date.now(),type:tm?'income':'expense',amount:a,wallet:w,category:tm?`استرداد من (${cd.person})`:`سداد لـ (${cd.person})`,date:new Date().toISOString().split('T')[0]},...p]);shT('تم السداد');}};
 const pTr=(id,a,w)=>{vib();let ct=null;setTrs(trs.map(t=>{if(t.id===id){ct=t;return{...t,paid:(t.paid||0)+a};}return t;}));setTM(null);if(ct){if(w==='bank'){const ex=ct.type==='external';setTxs(p=>[{id:Date.now(),type:ex?'trust_bank_in':'trust_bank_out',amount:a,wallet:'bank',category:ex?`استرداد أمانة (${ct.person})`:`تسليم أمانة (${ct.person})`,date:new Date().toISOString().split('T')[0]},...p]);}shT('تم');}};
 const bkpD=async()=>{vib();const f={tx:txs,db:dbs,pt:pts,prj:pjs,tr:trs};const b=btoa(unescape(encodeURIComponent(JSON.stringify(f))));const t=`[أرشيف]\n${new Date().toLocaleDateString('ar-EG')}\n\n${b}`;const n=Date.now();setLBkp(n);localStorage.setItem('sa_bkp',n);try{if(navigator.share)await navigator.share({title:'أرشيف',text:t});else{await navigator.clipboard.writeText(t);shT('نُسخ الكود');}}catch(e){shT('تحديث النسخة');}};
 const resD=s=>{vib();try{const e=s.match(/[A-Za-z0-9+/=]{50,}/)?.[0]||s.trim();const d=JSON.parse(decodeURIComponent(escape(atob(e))));if(d.tx&&d.db){setTxs(d.tx);setDbs(d.db);setPts(d.pt||[]);setPjs(d.prj||[]);setTrs(d.tr||[]);const n=Date.now();setLBkp(n);localStorage.setItem('sa_bkp',n);shT('تمت الاستعادة');}else alert('تالف');}catch(e){alert('فشل');}};
 const expC=()=>{vib();if(txs.length===0)return alert('لا حركات');let c="data:text/csv;charset=utf-8,\uFEFFالتاريخ,الخزنة,النوع,البيان,المبلغ\r\n";txs.forEach(t=>{const ts=t.type==='income'?'إيداع':(t.type==='expense'?'منصرف':'تحويل');const ws=t.wallet==='bank'?'بنك':'كاش';const cc=(t.category||'').replace(/,/g,'-');c+=`${t.date},${ws},${ts},${cc},${t.amount}\r\n`;});const l=document.createElement("a");l.setAttribute("href",encodeURI(c));l.setAttribute("download",`حركات.csv`);document.body.appendChild(l);l.click();document.body.removeChild(l);shT('حُمّل');};

 if(!auth)return <Auth v={vw} sV={setVw} sE={sE} sP={sP} sS={sS} oR={(e,p,s)=>{localStorage.setItem('sa_em',e);localStorage.setItem('sa_pw',p);localStorage.setItem('sa_sec',s);localStorage.setItem('sa_ses','1');setSE(e);setSP(p);setSS(s);setAuth(true);}} oL={()=>{localStorage.setItem('sa_ses','1');setAuth(true);}} oRp={np=>{localStorage.setItem('sa_pw',np);setSP(np);setVw('login');}} />;

 return (
  <div className="pb-28">
   {tst&&<div className="fixed top-6 left-4 right-4 z-[100] bg-emerald-500 text-white px-4 py-3 rounded-xl flex items-center gap-3 shadow-xl border border-emerald-400/20 pop max-w-sm mx-auto"><Ic.Ck/><span className="text-sm font-bold">{tst}</span></div>}
   <header className={cx.c+" rounded-none sticky top-0 z-10 "+cx.f}><div className="flex items-center gap-3"><div className="bg-emerald-500 p-2.5 rounded-xl text-white"><Ic.W/></div><div><h1 className="font-bold text-white">المحاسب الذكي</h1><p className="text-[11px] text-emerald-400">إدارة الخزن المزدوجة</p></div></div><div className="flex items-center gap-2"><a href="assets.html" onClick={vib} className="flex items-center gap-1 bg-yellow-600 text-white text-xs px-3 py-2 rounded-lg font-bold"><Ic.Bld/> الأصول</a><button onClick={()=>{vib();localStorage.removeItem('sa_ses');setAuth(false);setVw('login');}} className="text-slate-300 text-xs px-3 py-2 border border-slate-700 rounded-lg">🚪</button></div></header>
   <main className="p-4 max-w-md mx-auto">
    {tab==='dash'&&<Dash c={clc} txs={txs} lb={lBkp} oD={id=>delI('tx',id)} oE={t=>{setQT('transaction');setED(t);setQA(true);}} oR={r=>setRM(r)} />}
    {tab==='bus'&&<Bus pts={pts} pjs={pjs} aPt={()=>{setQT('new_partnership');setED(null);setQA(true);}} ePt={p=>{setQT('new_partnership');setED(p);setQA(true);}} dPt={id=>delI('ptnr',id)} aPj={()=>{setQT('new_project');setED(null);setQA(true);}} ePj={p=>{setQT('new_project');setED(p);setQA(true);}} dPj={id=>delI('project',id)} oDf={p=>{vib();setDM(p);}} dDf={dDf} cI={p=>{setQT('transaction');setED({category:`أرباح مشروع (${p.name})`,amount:'',wallet:'cash',type:'income',date:new Date().toISOString().split('T')[0]});setQA(true);}} oR={r=>setRM(r)} />}

 const sub=e=>{e.preventDefault();const dI=iE?fD.id:null;if(t==='transaction'){oS('transaction',{type:txT,amount:parseFloat(fD.amount),wallet:w,category:txT==='income'?(fD.category||'إيداع وارد'):fD.category,date:fD.date},dI);}else if(t==='transfer'){oS('transaction',{type:'transfer',direction:dr,amount:parseFloat(fD.amount),category:dr==='bank_to_cash'?'سحب كاش':'إيداع للبنك',date:fD.date},dI);}else if(t==='debt'){oS('debt',{type:txT,person:fD.person,amount:parseFloat(fD.amount),paid:parseFloat(fD.paid||0),date:fD.date},dI);}else if(t==='trust'){oS('trust',{type:txT,person:fD.person,amount:parseFloat(fD.amount),paid:parseFloat(fD.paid||0),date:fD.date},dI);}else if(t==='new_partnership'){let c=parseFloat(fD.capital||0);if(aM==='manual'){if(pL.reduce((s,p)=>s+parseFloat(p.share||0),0)!==100)return alert('النسب!=100');}else{c=pL.reduce((s,p)=>s+parseFloat(p.amount||0),0);if(c<=0)return alert('مبالغ خاطئة');}oS('new_partnership',{name:(fD.projectName||fD.name),capital:c,allocationMode:aM,wallet:w,partners:pL.map(x=>({name:x.name,amount:parseFloat(x.amount||0),share:parseFloat(x.share||0)}))},dI);}else if(t==='new_project'){oS('new_project',{name:(fD.projectName||fD.name),capital:parseFloat(fD.capital||0),date:fD.date,...(iE&&{devFund:parseFloat(fD.devFund||0)})},dI);}else if(t==='evaluation'){if(!fD.projectId)return alert('اختر مشروع');oS('evaluation',{projectId:Number(fD.projectId),totalCash:parseFloat(fD.totalCash),wallet:w,date:fD.date});}};
 return(
  <div className={cx.m}><div className={cx.mc}><div className={cx.f+" mb-4"}><h2 className="font-bold text-white">{iE?'تعديل':'إدخال جديد'}</h2><button onClick={oC} className="bg-slate-800 p-1.5 rounded-lg">❌</button></div>{!iE&&['transaction','transfer','debt','trust','evaluation'].includes(t)&&<div className="flex flex-wrap gap-1 bg-slate-800 p-1 mb-4"><button onClick={()=>sT('transaction')} className={`${t==='transaction'?'bg-emerald-500 text-white':'text-slate-400'} flex-1 py-1 rounded font-bold text-xs`}>تدفق</button><button onClick={()=>sT('transfer')} className={`${t==='transfer'?'bg-emerald-500 text-white':'text-slate-400'} flex-1 py-1 rounded font-bold text-xs`}>تحويل</button><button onClick={()=>sT('debt')} className={`${t==='debt'?'bg-emerald-500 text-white':'text-slate-400'} flex-1 py-1 rounded font-bold text-xs`}>دين</button><button onClick={()=>{sT('trust');sTxT('external');}} className={`${t==='trust'?'bg-blue-500 text-white':'text-slate-400'} flex-1 py-1 rounded font-bold text-xs`}>أمانة</button><button onClick={()=>sT('evaluation')} className={`${t==='evaluation'?'bg-emerald-500 text-white':'text-slate-400'} flex-1 py-1 rounded font-bold text-xs`}>جرد</button></div>}
   <form onSubmit={sub} className="space-y-4">
    {t==='transaction'&&(<><div className="flex gap-2"><button type="button" onClick={()=>sTxT('income')} className={`flex-1 py-2 rounded-xl border-2 text-xs font-bold ${txT==='income'?'border-emerald-500 text-emerald-400 bg-emerald-500/10':'border-slate-700 text-slate-400'}`}>وارد (+)</button><button type="button" onClick={()=>sTxT('expense')} className={`flex-1 py-2 rounded-xl border-2 text-xs font-bold ${txT==='expense'?'border-red-500 text-red-400 bg-red-500/10':'border-slate-700 text-slate-400'}`}>منصرف (-)</button></div><div className="flex gap-2"><button type="button" onClick={()=>sW('bank')} className={`flex-1 py-2 rounded-xl border-2 text-xs font-bold ${w==='bank'?'bg-blue-500 text-white border-blue-500':'bg-slate-800 text-slate-400 border-slate-600'}`}>البنك 📱</button><button type="button" onClick={()=>sW('cash')} className={`flex-1 py-2 rounded-xl border-2 text-xs font-bold ${w==='cash'?'bg-emerald-500 text-white border-emerald-500':'bg-slate-800 text-slate-400 border-slate-600'}`}>الكاش 💵</button></div><input type="number" required placeholder="المبلغ (ج.س)" value={fD.amount||''} onChange={x=>sFd({...fD,amount:x.target.value})} className={cx.i+" text-center font-bold text-lg"} />{txT==='expense'?<div className="space-y-1"><label className="text-xs text-slate-400">تصنيف:</label><select value={fD.category||'مصروف الأسرة'} onChange={x=>sFd({...fD,category:x.target.value})} className={cx.i}><option>مصروف الأسرة</option><option>مصروف مدرسي</option><option>تسوق</option><option>أخرى</option></select></div>:<div className="space-y-1"><label className="text-xs text-slate-400">البيان (اختياري):</label><input type="text" placeholder="مثال: أرباح مشروع..." value={fD.category||''} onChange={x=>sFd({...fD,category:x.target.value})} className={cx.i} /></div>}</>)}
    {t==='transfer'&&(<><div className="flex gap-2"><button type="button" onClick={()=>sDr('bank_to_cash')} className={`flex-1 py-2 rounded-xl text-xs font-bold ${dr==='bank_to_cash'?'bg-blue-500 text-white':'bg-slate-800 text-slate-400'}`}>سحب لليد 💵</button><button type="button" onClick={()=>sDr('cash_to_bank')} className={`flex-1 py-2 rounded-xl text-xs font-bold ${dr==='cash_to_bank'?'bg-emerald-500 text-white':'bg-slate-800 text-slate-400'}`}>إيداع للبنك 📱</button></div><input type="number" required placeholder="المبلغ" value={fD.amount||''} onChange={x=>sFd({...fD,amount:x.target.value})} className={cx.i+" text-center text-lg font-bold"} /></>)}
    {t==='trust'&&(<><div className="flex gap-2"><button type="button" onClick={()=>sTxT('external')} className={`flex-1 py-2 rounded-xl border-2 text-xs font-bold ${txT==='external'?'border-blue-500 text-blue-400 bg-blue-500/10':'border-slate-700 text-slate-400'}`}>بالخارج</button><button type="button" onClick={()=>sTxT('with_me')} className={`flex-1 py-2 rounded-xl border-2 text-xs font-bold ${txT==='with_me'?'border-orange-500 text-orange-400 bg-orange-500/10':'border-slate-700 text-slate-400'}`}>بطرفي</button></div><input type="text" required placeholder="الاسم" value={fD.person||''} onChange={x=>sFd({...fD,person:x.target.value})} className={cx.i} /><input type="number" required placeholder="المبلغ الكلي" value={fD.amount||''} onChange={x=>sFd({...fD,amount:x.target.value})} className={cx.i} />{iE&&<div className="bg-slate-800 p-2 rounded"><label className="text-xs text-slate-400">مُسدد (لتصحيح):</label><input type="number" value={fD.paid||''} onChange={x=>sFd({...fD,paid:x.target.value})} className={cx.i} /></div>}</>)}
    {t==='debt'&&(<><div className="flex gap-2"><button type="button" onClick={()=>sTxT('to_me')} className={`flex-1 py-2 rounded-xl border-2 text-xs font-bold ${txT==='to_me'?'border-emerald-500 text-emerald-400 bg-emerald-500/10':'border-slate-700 text-slate-400'}`}>مستحق لي</button><button type="button" onClick={()=>sTxT('on_me')} className={`flex-1 py-2 rounded-xl border-2 text-xs font-bold ${txT==='on_me'?'border-red-500 text-red-400 bg-red-500/10':'border-slate-700 text-slate-400'}`}>التزام علي</button></div><input type="text" required placeholder="الاسم" value={fD.person||''} onChange={x=>sFd({...fD,person:x.target.value})} className={cx.i} /><input type="number" required placeholder="المبلغ الكلي" value={fD.amount||''} onChange={x=>sFd({...fD,amount:x.target.value})} className={cx.i} />{iE&&<div className="bg-slate-800 p-2 rounded"><label className="text-xs text-slate-400">مُسدد:</label><input type="number" value={fD.paid||''} onChange={x=>sFd({...fD,paid:x.target.value})} className={cx.i} /></div>}</>)}
    {t==='new_project'&&(<><input type="text" required placeholder="اسم المشروع (التسالي)" value={fD.projectName||fD.name||''} onChange={x=>sFd({...fD,projectName:x.target.value})} className={cx.i} /><input type="number" required placeholder="رأس المال المشغل" value={fD.capital||''} onChange={x=>sFd({...fD,capital:x.target.value})} className={cx.i+" text-center font-bold"} />{iE&&<div className="bg-slate-800 p-2 rounded border border-slate-700"><label className="text-xs text-slate-400">مال التطوير المحتجز (لتصحيح الرقم):</label><input type="number" value={fD.devFund!==undefined?fD.devFund:''} onChange={x=>sFd({...fD,devFund:x.target.value})} className={cx.i+" mt-1 text-yellow-400 font-bold"} /></div>}</>)}
    {t==='new_partnership'&&(<><input type="text" required placeholder="اسم الشراكة" value={fD.projectName||fD.name||''} onChange={x=>sFd({...fD,projectName:x.target.value})} className={cx.i} /><div className="flex gap-2 bg-slate-800 p-1 mb-2 rounded-lg"><button type="button" onClick={()=>sAm('capital')} className={`flex-1 py-1.5 rounded text-xs font-bold ${aM==='capital'?'bg-emerald-500 text-white':'text-slate-400'}`}>تلقائي (حسب المال)</button><button type="button" onClick={()=>sAm('manual')} className={`flex-1 py-1.5 rounded text-xs font-bold ${aM==='manual'?'bg-emerald-500 text-white':'text-slate-400'}`}>يدوي (نسب مئوية)</button></div>{aM==='capital'&&<div className="flex gap-2 bg-slate-800 p-1"><button type="button" onClick={()=>sW('bank')} className={`flex-1 py-1 rounded text-xs ${w==='bank'?'bg-blue-500 text-white':'text-slate-400'}`}>بنك</button><button type="button" onClick={()=>sW('cash')} className={`flex-1 py-1 rounded text-xs ${w==='cash'?'bg-emerald-500 text-white':'text-slate-400'}`}>كاش</button></div>}{aM==='manual'&&<input type="number" required placeholder="المال الكلي" value={fD.capital||''} onChange={x=>sFd({...fD,capital:x.target.value})} className={cx.i} />}<div className="pt-2"><p className="text-xs text-emerald-400 mb-2">الشركاء:</p>{pL.map((p,i)=><div key={i} className="flex gap-1 mb-2"><input type="text" required value={p.name} onChange={x=>{let l=[...pL];l[i].name=x.target.value;sPl(l);}} className={cx.i+" w-2/5"} placeholder="الاسم" />{aM==='capital'?<input type="number" required value={p.amount} onChange={x=>{let l=[...pL];l[i].amount=x.target.value;sPl(l);}} className={cx.i+" w-3/5 text-center"} placeholder="أودع كم؟" />:<input type="number" required value={p.share} onChange={x=>{let l=[...pL];l[i].share=x.target.value;sPl(l);}} className={cx.i+" w-3/5 text-center"} placeholder="النسبة %" />}{i>1&&<button type="button" onClick={()=>sPl(pL.filter((_,id)=>id!==i))} className="text-red-400 px-1">❌</button>}</div>)}<button type="button" onClick={()=>sPl([...pL,{name:'',amount:'',share:''}])} className="w-full text-emerald-400 py-2 text-xs bg-slate-800 rounded">➕ شريك</button></div></>)}
    {t==='evaluation'&&(<><div className="flex gap-2"><button type="button" onClick={()=>sW('bank')} className={`flex-1 py-2 rounded border-2 text-xs ${w==='bank'?'bg-blue-500 text-white border-blue-500':'text-slate-400 border-slate-700'}`}>أرباح للبنك</button><button type="button" onClick={()=>sW('cash')} className={`flex-1 py-2 rounded border-2 text-xs ${w==='cash'?'bg-emerald-500 text-white border-emerald-500':'text-slate-400 border-slate-700'}`}>أرباح كاش</button></div><select required value={fD.projectId||''} onChange={x=>sFd({...fD,projectId:x.target.value})} className={cx.i}><option value="">اختر مشروع...</option>{pts.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select><input type="number" required placeholder="إجمالي المال الفعلي الحالي" value={fD.totalCash||''} onChange={x=>sFd({...fD,totalCash:x.target.value})} className={cx.i} /></>)}
    <input type="date" required value={fD.date} onChange={x=>sFd({...fD,date:x.target.value})} className={cx.i+" text-center"} /><button type="submit" className={cx.b}>حفظ</button>
   </form></div></div>
 );
}

function DMod({p,oC,oS}){
 const [a,sA]=useState('');const sub=e=>{e.preventDefault();if(a>0)oS(p.id,a);};
 return(<div className={cx.m}><div className={cx.mc+" mb-10"}><h2 className="font-bold text-white mb-2">تخصيص مال تطوير</h2><p className="text-xs text-slate-400 mb-4">احتجاز مبلغ لتطوير ({p.name})</p><form onSubmit={sub}><input type="number" value={a} onChange={x=>sA(x.target.value)} required className={cx.i+" text-center text-2xl font-black mb-4 focus:border-yellow-500"} placeholder="أدخل القيمة" autoFocus /><button type="submit" className="w-full bg-yellow-500 text-slate-900 font-bold py-3.5 rounded-xl text-sm">تأكيد الاحتجاز ⚙️</button></form><button onClick={oC} className="w-full mt-3 text-slate-400 text-sm">إلغاء</button></div></div>)
}

function PMod({i,oC,oS,ti,s}){
 const [a,sA]=useState('');const [w,sW]=useState('bank');const r=i.amount-(i.paid||0);
 const sub=e=>{e.preventDefault();const v=parseFloat(a);if(v>0&&v<=r)oS(i.id,v,w);else alert('خطأ');};
 return(<div className={cx.m}><div className={cx.mc+" mb-10"}><h2 className="font-bold text-white mb-2">{ti}</h2><p className="text-xs text-slate-400 mb-4">{s} {r.toLocaleString()}</p><div className="flex gap-2 mb-4"><button type="button" onClick={()=>sW('bank')} className={`flex-1 py-2 rounded-xl text-xs font-bold ${w==='bank'?'bg-blue-500 text-white':'bg-slate-800 text-slate-400'}`}>بنك 📱</button><button type="button" onClick={()=>sW('cash')} className={`flex-1 py-2 rounded-xl text-xs font-bold ${w==='cash'?'bg-emerald-500 text-white':'bg-slate-800 text-slate-400'}`}>كاش 💵</button></div><form onSubmit={sub}><input type="number" value={a} onChange={x=>sA(x.target.value)} required max={r} className={cx.i+" text-center text-xl font-black mb-4"} placeholder="القيمة" autoFocus /><button type="submit" className={cx.b}>تأكيد</button></form><button onClick={oC} className="w-full mt-3 text-slate-400 text-sm">إلغاء</button></div></div>);
}

function RMod({d,oC,sT}){
 if(!d)return null;const a=d.amount?parseFloat(d.amount):0;const rf=d.ref||'-';const dt=d.date||'-';const ti=d.title||'سند';const pr=d.person||'عام';
 const t=d.isDetailed?`🧾 *${ti}*\n▪️ الجهة: ${pr}\n▪️ التاريخ: ${dt}\n💰 الإجمالي: ${a.toLocaleString()} ج\n✅ مُسدد: ${(d.paid||0).toLocaleString()} ج\n⚠️ متبقي: ${(d.rem||0).toLocaleString()} ج`:`🧾 *${ti}*\n▪️ رقم: ${rf}\n▪️ التاريخ: ${dt}\n▪️ البيان: ${pr}\n💰 المبلغ: ${a.toLocaleString()} ج`;
 const cp=()=>{vib();navigator.clipboard.writeText(t);sT('تم النسخ');};
 return(<div className={cx.m+" z-[70]"}><div className="bg-white text-slate-900 w-full max-w-sm rounded-2xl p-5 shadow-2xl font-mono"><h2 className="font-bold text-center border-b border-dashed border-slate-300 pb-3 mb-4">{ti}</h2>{d.isDetailed?(<><div className="space-y-2 text-xs mb-4 font-medium"><div className={cx.f}><span>المرجع:</span><span>{rf}</span></div><div className={cx.f}><span>التاريخ:</span><span>{dt}</span></div><div className={cx.f}><span>الجهة:</span><span className="truncate max-w-[60%]">{pr}</span></div></div><div className="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2 text-sm font-bold"><div className={cx.f+" text-slate-600"}><span>الإجمالي:</span><span>{a.toLocaleString()}</span></div><div className={cx.f+" text-emerald-600"}><span>مُسدد:</span><span>{(d.paid||0).toLocaleString()}</span></div><div className={cx.f+" text-red-600 border-t border-slate-200 pt-2 mt-2"}><span>متبقي:</span><span className="text-lg">{(d.rem||0).toLocaleString()}</span></div></div></>):(<><div className="space-y-2 text-xs mb-5 font-medium"><div className={cx.f}><span>رقم السند:</span><span>{rf}</span></div><div className={cx.f}><span>التاريخ:</span><span>{dt}</span></div><div className={cx.f}><span>الجهة:</span><span className="truncate max-w-[60%]">{pr}</span></div></div><div className="border-t border-dashed border-slate-300 pt-3 text-center"><h3 className="text-xl font-black">{a.toLocaleString()} ج</h3></div></>)}<div className="mt-5 space-y-2"><button type="button" onClick={()=>{vib();window.location.href=`whatsapp://send?text=${encodeURIComponent(t)}`;}} className="w-full bg-emerald-600 text-white py-2.5 rounded-xl font-bold text-xs shadow">📱 إرسال للواتساب</button><button type="button" onClick={cp} className="w-full bg-slate-100 text-slate-800 py-2.5 rounded-xl font-bold text-xs">📋 نسخ كنص</button><button type="button" onClick={oC} className="w-full bg-slate-900 text-white py-2.5 rounded-xl font-bold text-xs">إغلاق ❌</button></div></div></div>);
}
const root=ReactDOM.createRoot(document.getElementById('root'));root.render(<App/>);
</script></body></html>
