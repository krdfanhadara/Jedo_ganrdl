<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>المحاسب الذكي - النسخة الشاملة</title>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    @keyframes slideDown { 0% { transform: translateY(-100%); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
    .animate-slide-down { animation: slideDown 0.3s ease-out forwards; }
    @keyframes popIn { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .animate-pop { animation: popIn 0.2s ease-out forwards; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const INITIAL_STATE = { transactions: [], debts: [], partnerships: [], trusts: [], projects: [] };

    const Icons = {
      Wallet: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>,
      Home: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
      Briefcase: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>,
      CreditCard: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>,
      Shield: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
      Settings: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 5.4 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1-2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
      Receipt: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/></svg>,
      Trash: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/></svg>,
      Edit: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>,
      Check: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="20 6 9 17 4 12"/></svg>,
      Share: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4Z"/></svg>,
      Cloud: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>,
      Download: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>,
      FileExcel: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2M8 17h2M14 13h2M14 17h2"/></svg>,
      ArrowLeftRight: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>,
      Building: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><path d="M9 22v-4h6v4M8 6h2M14 6h2M8 10h2M14 10h2M8 14h2M14 14h2"/></svg>
    };

    const triggerHaptic = () => { if(navigator.vibrate) navigator.vibrate(30); };

    function AuthScreen({ view, setView, savedEmail, savedPwd, savedSecAnswer, onRegister, onLogin, onResetPwd }) {
      const [email, setEmail] = useState(''); const [pwd, setPwd] = useState(''); const [sec, setSec] = useState('');
      useEffect(() => { if(savedEmail) setEmail(savedEmail); }, [savedEmail]);

      const submit = e => {
        e.preventDefault(); triggerHaptic();
        if(view === 'register') { 
          if(!email || pwd.length < 4 || !sec) return alert('الرجاء إكمال البيانات (الرمز 4 أحرف كحد أدنى)'); 
          onRegister(email.toLowerCase(), pwd, sec.trim()); 
        } else if (view === 'login') { 
          if(email.toLowerCase() === savedEmail.toLowerCase() && pwd === savedPwd) onLogin(); 
          else alert('البيانات غير صحيحة!'); 
        } else if (view === 'forgot') {
          if (email.toLowerCase() === savedEmail.toLowerCase() && sec.trim() === savedSecAnswer.trim()) {
            const newPassword = prompt('اكتب الرمز الجديد الآن:');
            if (newPassword && newPassword.length >= 4) onResetPwd(newPassword);
            else alert('مرفوض: أقل من 4 رموز');
          } else { alert('الإجابة غير صحيحة!'); }
        }
      };

      return (
        <div className="min-h-[80vh] flex items-center justify-center p-4">
          <div className="bg-slate-800 p-8 rounded-2xl w-full max-w-sm border border-slate-700 animate-pop shadow-2xl">
            <h1 className="text-xl font-bold text-white mb-6 text-center">🔐 المحاسب الذكي</h1>
            <form onSubmit={submit} className="space-y-4">
              <input type="email" required placeholder="البريد الإلكتروني" value={email} onChange={e=>setEmail(e.target.value)} className="w-full bg-slate-900 border border-slate-600 text-white p-3.5 rounded-xl text-left text-sm focus:outline-none focus:border-emerald-500 transition" />
              {view !== 'forgot' && <input type="password" required placeholder="كلمة المرور" value={pwd} onChange={e=>setPwd(e.target.value)} className="w-full bg-slate-900 border border-slate-600 text-white p-3.5 rounded-xl text-left text-sm focus:outline-none focus:border-emerald-500 transition" />}
              {(view === 'register' || view === 'forgot') && <input type="text" required placeholder="سؤال الأمان: مدينتك المفضلة؟" value={sec} onChange={e=>setSec(e.target.value)} className="w-full bg-slate-900 border border-slate-600 text-emerald-400 p-3.5 rounded-xl text-sm focus:outline-none focus:border-emerald-500 transition" />}
              <button type="submit" className="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3.5 rounded-xl text-sm shadow-md transition">
                {view === 'login' ? 'دخول الحساب' : view === 'register' ? 'إنشاء وتأمين الملف' : 'استعادة الرمز'}
              </button>
            </form>
            <div className="mt-6 flex flex-col gap-3 text-center text-sm">
              {view === 'login' ? (
                <><button type="button" onClick={() => setView('forgot')} className="text-slate-400 hover:text-white transition">نسيت كلمة المرور؟ 🔍</button><button type="button" onClick={() => setView('register')} className="text-emerald-400 font-bold transition">إنشاء ملف مالي جديد ➕</button></>
              ) : (
                <button type="button" onClick={() => setView('login')} className="text-slate-400 hover:text-white transition">العودة لتسجيل الدخول 🔑</button>
              )}
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(() => localStorage.getItem('smart_acc_session') === 'active');
      const [authView, setAuthView] = useState('login'); 
      const [savedEmail, setSavedEmail] = useState(() => localStorage.getItem('smart_acc_email') || '');
      const [savedPwd, setSavedPwd] = useState(() => localStorage.getItem('smart_acc_pwd') || '1234');
      const [savedSecAnswer, setSavedSecAnswer] = useState(() => localStorage.getItem('smart_acc_sec') || '');
      const [toast, setToast] = useState(null);
      const [lastBackup, setLastBackup] = useState(() => Number(localStorage.getItem('smart_acc_last_backup')) || 0);

      const showSuccessToast = (message) => { setToast(message); setTimeout(() => setToast(null), 3000); };
      useEffect(() => { if (!localStorage.getItem('smart_acc_email')) setAuthView('register'); }, []);

      const [activeTab, setActiveTab] = useState('dashboard');
      const [isQuickAddOpen, setIsQuickAddOpen] = useState(false);
      const [quickAddType, setQuickAddType] = useState('transaction');
      const [editData, setEditData] = useState(null);
      const [paymentModal, setPaymentModal] = useState(null);
      const [trustPaymentModal, setTrustPaymentModal] = useState(null);
      const [devFundModal, setDevFundModal] = useState(null);
      const [receiptData, setReceiptData] = useState(null);

      const [transactions, setTransactions] = useState(() => JSON.parse(localStorage.getItem('smart_accountant_tx')) || INITIAL_STATE.transactions);
      const [debts, setDebts] = useState(() => JSON.parse(localStorage.getItem('smart_accountant_dbts')) || INITIAL_STATE.debts);
      const [partnerships, setPartnerships] = useState(() => JSON.parse(localStorage.getItem('smart_accountant_ptnrs')) || INITIAL_STATE.partnerships);
      const [projects, setProjects] = useState(() => JSON.parse(localStorage.getItem('smart_accountant_projects')) || INITIAL_STATE.projects);
      const [trusts, setTrusts] = useState(() => JSON.parse(localStorage.getItem('smart_accountant_trusts')) || INITIAL_STATE.trusts);
      const [assets, setAssets] = useState(() => JSON.parse(localStorage.getItem('smart_accountant_assets')) || []);

      useEffect(() => { localStorage.setItem('smart_accountant_tx', JSON.stringify(transactions)); }, [transactions]);
      useEffect(() => { localStorage.setItem('smart_accountant_dbts', JSON.stringify(debts)); }, [debts]);
      useEffect(() => { localStorage.setItem('smart_accountant_ptnrs', JSON.stringify(partnerships)); }, [partnerships]);
      useEffect(() => { localStorage.setItem('smart_accountant_projects', JSON.stringify(projects)); }, [projects]);
      useEffect(() => { localStorage.setItem('smart_accountant_trusts', JSON.stringify(trusts)); }, [trusts]);

      const calculations = useMemo(() => {
        const sumIncomes = transactions.filter(t => t.type === 'income').reduce((acc, curr) => acc + curr.amount, 0);
        const sumExpenses = transactions.filter(t => t.type === 'expense').reduce((acc, curr) => acc + curr.amount, 0);
        const activeExternal = trusts.filter(t => t.type === 'external').reduce((acc, t) => acc + (t.amount - (t.paid || 0)), 0);
        const activeWithMe = trusts.filter(t => t.type === 'with_me').reduce((acc, t) => acc + (t.amount - (t.paid || 0)), 0);
        const pendingToMe = debts.filter(d => d.type === 'to_me').reduce((acc, d) => acc + (d.amount - (d.paid || 0)), 0);
        const pendingOnMe = debts.filter(d => d.type === 'on_me').reduce((acc, d) => acc + (d.amount - (d.paid || 0)), 0);
        const totalAssetsValue = assets.reduce((sum, asset) => sum + parseFloat(asset.currentValue || 0), 0);
        const totalDevFunds = projects.reduce((acc, proj) => acc + (parseFloat(proj.devFund) || 0), 0);

        const myPartnershipCapital = partnerships.reduce((total, p) => {
          if (p.allocationMode === 'capital') {
            const me = p.partners?.find(pt => pt.name === 'أنت');
            return total + (me ? parseFloat(me.amount || 0) : 0);
          }
          return total;
        }, 0);

        let calcBankBalance = 0; let calcCashBalance = 0;
        transactions.forEach(t => {
          const amt = parseFloat(t.amount || 0);
          if (t.wallet === 'bank') {
            if (t.type === 'income' || t.type === 'trust_bank_in') calcBankBalance += amt;
            if (t.type === 'expense' || t.type === 'trust_bank_out') calcBankBalance -= amt;
          } else if (t.wallet === 'cash') {
            if (t.type === 'income') calcCashBalance += amt;
            if (t.type === 'expense') calcCashBalance -= amt;
          }
          if (t.type === 'transfer') {
            if (t.direction === 'cash_to_bank') { calcBankBalance += amt; calcCashBalance -= amt; }
            if (t.direction === 'bank_to_cash') { calcBankBalance -= amt; calcCashBalance += amt; }
          }
        });

        partnerships.forEach(p => {
          if (p.allocationMode === 'capital') {
            const me = p.partners?.find(pt => pt.name === 'أنت');
            if (me) {
              const amt = parseFloat(me.amount || 0);
              if (p.wallet === 'bank') calcBankBalance -= amt;
              else calcCashBalance -= amt;
            }
          }
        });

        calcCashBalance += activeWithMe; 
        const totalAvailableCash = calcBankBalance + calcCashBalance;
        const actualOwnCash = totalAvailableCash - activeWithMe;
        const netWealth = actualOwnCash + activeExternal + pendingToMe + myPartnershipCapital + totalAssetsValue - pendingOnMe;

        return {
          totalAvailableCash, actualOwnCash, activeWithMe, netWealth, myPartnershipCapital, totalAssetsValue,
          pendingToMe, pendingOnMe, activeExternal, totalDevFunds,
          bankBalance: calcBankBalance, cashBalance: calcCashBalance,
          totalIn: sumIncomes, totalOut: sumExpenses
        };
      }, [transactions, debts, trusts, partnerships, projects, assets]);

      const handleDelete = (type, id) => {
        triggerHaptic();
        if (type === 'ptnr') {
          const proj = partnerships.find(p => p.id === id); if (!proj) return;
          if (window.confirm(`⚠️ الحذف الذكي لشراكة (${proj.name}):\n\nاضغط موافق للحذف والاحتفاظ بالأرباح.`)) {
            setPartnerships(partnerships.filter(p => p.id !== id)); showSuccessToast('تم الحذف والاحتفاظ بالأرباح.');
          } else if (window.confirm(`🔄 التنظيف الكامل:\n\nهل تود مسح الشراكة وتطهير كل أرباحها من السجل؟`)) {
            setPartnerships(partnerships.filter(p => p.id !== id));
            setTransactions(transactions.filter(t => !(t.category || '').includes(`أرباح جرد (${proj.name})`)));
            showSuccessToast('تم التطهير الكامل.');
          }
          return;
        }

        if (type === 'project') {
          if(window.confirm('حذف المشروع التجاري؟ (سيتم الإبقاء على الأرباح المحصلة مسبقاً في الخزينة).')) {
            setProjects(projects.filter(p => p.id !== id)); showSuccessToast('تم حذف المشروع من القائمة.');
          }
          return;
        }

        if(window.confirm('هل تود الحذف بالتأكيد؟')) {
          if(type === 'tx') setTransactions(transactions.filter(t => t.id !== id));
          if(type === 'debt') setDebts(debts.filter(d => d.id !== id));
          if(type === 'trust') setTrusts(trusts.filter(t => t.id !== id));
          showSuccessToast('تم الحذف بنجاح');
        }
      };

      const handleResetData = () => {
        triggerHaptic();
        if(window.confirm('سيتم تصفير كل السجلات المالية تماماً. هل أنت متأكد؟')) {
          setTransactions([]); setDebts([]); setPartnerships([]); setProjects([]); setTrusts([]);
          localStorage.removeItem('smart_accountant_tx'); localStorage.removeItem('smart_accountant_dbts');
          localStorage.removeItem('smart_accountant_ptnrs'); localStorage.removeItem('smart_accountant_projects'); 
          localStorage.removeItem('smart_accountant_trusts');
          showSuccessToast('تم تصفير الحسابات بنجاح.');
        }
      };

      const handleSaveItem = (type, data, id = null) => {
        triggerHaptic(); 
        const docId = id || Date.now();
        
        if (type === 'transaction') {
          if(id) setTransactions(transactions.map(t => t.id === id ? { ...t, ...data } : t));
          else setTransactions([{ id: docId, ...data }, ...transactions]);
          showSuccessToast('تم الحفظ وتحديث السيولة');
        } 
        else if (type === 'debt') {
          if(id) setDebts(debts.map(d => d.id === id ? { ...d, ...data } : d));
          else setDebts([{ id: docId, paid: 0, ...data }, ...debts]);
          showSuccessToast('تم حفظ سجل الدين');
        } 
        else if (type === 'trust') {
          if(id) setTrusts(trusts.map(t => t.id === id ? { ...t, ...data } : t));
          else setTrusts([{ id: docId, paid: 0, ...data }, ...trusts]);
          showSuccessToast('تم حفظ سجل الأمانة');
        }
        else if (type === 'new_partnership') {
          if(id) setPartnerships(partnerships.map(p => p.id === id ? { ...p, ...data } : p));
          else setPartnerships([{ id: docId, evaluations: [], ...data }, ...partnerships]);
          showSuccessToast('تم حفظ الشراكة بنجاح');
        } 
        else if (type === 'new_project') {
          if(id) setProjects(projects.map(p => p.id === id ? { ...p, ...data } : p));
          else setProjects([{ id: docId, devFund: 0, ...data }, ...projects]);
          showSuccessToast('تم حفظ المشروع التشغيلي بنجاح 💼');
        }
        else if (type === 'evaluation') {
          let myProfit = 0; let projName = '';
          setPartnerships(partnerships.map(p => {
            if (p.id === Number(data.projectId)) {
              projName = p.name;
              const currentTotalCash = parseFloat(data.totalCash || 0); const fixedCapital = parseFloat(p.capital || 0);
              const totalProfitFringe = currentTotalCash - fixedCapital;
              if (totalProfitFringe > 0) {
                const totalCapPool = p.allocationMode === 'capital' ? p.partners.reduce((sum, part) => sum + parseFloat(part.amount || 0), 0) || 1 : fixedCapital;
                let computedShareRatio = 0; const meObj = p.partners.find(pt => pt.name === 'أنت');
                if (meObj) {
                  if (p.allocationMode === 'capital') computedShareRatio = parseFloat(meObj.amount || 0) / totalCapPool;
                  else computedShareRatio = parseFloat(meObj.share || 0) / 100;
                }
                myProfit = totalProfitFringe * computedShareRatio;
              }
              return { ...p, evaluations: [...(p.evaluations || []), { id: Date.now(), ...data }] };
            }
            return p;
          }));

          if (myProfit > 0) {
            setTransactions(prev => [{ id: Date.now() + 5, type: 'income', amount: parseFloat(myProfit.toFixed(2)), wallet: data.wallet, category: `أرباح جرد (${projName})`, date: data.date }, ...prev]);
            showSuccessToast(`تم الجرد بنجاح (+${myProfit.toLocaleString()})`);
          } else {
            showSuccessToast('تم تسجيل الجرد بنجاح');
          }
        }
        setIsQuickAddOpen(false); setEditData(null);
      };

      const handleAllocateDevFund = (projectId, amount) => {
        triggerHaptic();
        setProjects(projects.map(p => {
           if(p.id === projectId) return { ...p, devFund: (p.devFund || 0) + parseFloat(amount) };
           return p;
        }));
        setDevFundModal(null);
        showSuccessToast('تم تخصيص واحتجاز مال التطوير بنجاح ⚙️');
      };

      const handlePayDebt = (debtId, amount, wallet) => {
        triggerHaptic(); let currentDebt = null;
        setDebts(debts.map(d => { if (d.id === debtId) { currentDebt = d; return { ...d, paid: (d.paid || 0) + amount }; } return d; }));
        setPaymentModal(null);
        if (currentDebt) {
          const isToMe = currentDebt.type === 'to_me';
          setTransactions(prev => [{ id: Date.now(), type: isToMe ? 'income' : 'expense', amount: amount, wallet: wallet, category: isToMe ? `استرداد دين من (${currentDebt.person})` : `سداد دين إلى (${currentDebt.person})`, date: new Date().toISOString().split('T')[0] }, ...prev]);
          showSuccessToast(`تم السداد وتحديث الرصيد`);
        }
      };

      const handlePayTrust = (trustId, amount, wallet) => {
        triggerHaptic(); let currentTrust = null;
        setTrusts(trusts.map(t => { if (t.id === trustId) { currentTrust = t; return { ...t, paid: (t.paid || 0) + amount }; } return t; }));
        setTrustPaymentModal(null);
        if (currentTrust) {
          if (wallet === 'bank') {
             const isExternal = currentTrust.type === 'external';
             setTransactions(prev => [{ id: Date.now(), type: isExternal ? 'trust_bank_in' : 'trust_bank_out', amount: amount, wallet: 'bank', category: isExternal ? `استرداد أمانة من (${currentTrust.person})` : `تسليم أمانة إلى (${currentTrust.person})`, date: new Date().toISOString().split('T')[0] }, ...prev]);
          }
          showSuccessToast(`تمت حركة الأمانة بنجاح`);
        }
      };

      const handleBackupData = async () => {
        triggerHaptic();
        const fullData = { tx: transactions, db: debts, pt: partnerships, prj: projects, tr: trusts };
        const base64Data = btoa(unescape(encodeURIComponent(JSON.stringify(fullData))));
        const shareText = `[نسخة احتياطية - المحاسب الذكي]\nتاريخ الأرشفة: ${new Date().toLocaleDateString('ar-EG')}\n\n--- انسخ الكود بالأسفل فقط ---\n${base64Data}`;
        const now = Date.now(); setLastBackup(now); localStorage.setItem('smart_acc_last_backup', now);
        try {
          if (navigator.share) await navigator.share({ title: 'أرشيف المحاسب الذكي', text: shareText });
          else { await navigator.clipboard.writeText(shareText); showSuccessToast('تم نسخ الكود! الصقه في Google Keep.'); }
        } catch (e) { showSuccessToast('تمت معالجة أحدث نسخة احتياطية'); }
      };

      const handleRestoreData = (backupStr) => {
        triggerHaptic();
        try {
          const extractBase64 = backupStr.match(/[A-Za-z0-9+/=]{50,}/)?.[0] || backupStr.trim();
          const data = JSON.parse(decodeURIComponent(escape(atob(extractBase64))));
          if(data.tx && data.db) {
            setTransactions(data.tx); setDebts(data.db); setPartnerships(data.pt || []); setProjects(data.prj || []); setTrusts(data.tr || []);
            const now = Date.now(); setLastBackup(now); localStorage.setItem('smart_acc_last_backup', now);
            showSuccessToast('🎉 تمت الاستعادة والحقن بنجاح!');
          } else alert('الكود تالف.');
        } catch (e) { alert('فشل الاستعادة! تأكد من الكود.'); }
      };

      const handleExportCSV = () => {
        triggerHaptic();
        if (transactions.length === 0) return alert('لا توجد حركات!');
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; 
        csvContent += "التاريخ,الخزنة,النوع,البيان والتصنيف,المبلغ\r\n";
        transactions.forEach(t => {
          let typeStr = t.type === 'income' ? 'إيداع وارد' : (t.type === 'expense' ? 'منصرف' : 'حركة داخلية');
          const walletStr = t.wallet === 'bank' ? 'بنكك/حساب' : 'كاش نقدي';
          const cleanCategory = (t.category || '').replace(/,/g, ' - ');
          csvContent += `${t.date},${walletStr},${typeStr},${cleanCategory},${t.amount}\r\n`;
        });
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a"); link.setAttribute("href", encodedUri); link.setAttribute("download", `كشف_حساب_المحاسب_الذكي.csv`);
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
        showSuccessToast('تم تحميل الكشف (Excel) 📄');
      };

      const handleLogout = () => { triggerHaptic(); localStorage.removeItem('smart_acc_session'); setIsAuthenticated(false); setAuthView('login'); };

      if (!isAuthenticated) {
        return <AuthScreen view={authView} setView={setAuthView} savedEmail={savedEmail} savedPwd={savedPwd} savedSecAnswer={savedSecAnswer} onRegister={(e,p,s) => { localStorage.setItem('smart_acc_email', e); localStorage.setItem('smart_acc_pwd', p); localStorage.setItem('smart_acc_sec', s); localStorage.setItem('smart_acc_session', 'active'); setSavedEmail(e); setSavedPwd(p); setSavedSecAnswer(s); setIsAuthenticated(true); }} onLogin={() => { localStorage.setItem('smart_acc_session', 'active'); setIsAuthenticated(true); }} onResetPwd={(np) => { localStorage.setItem('smart_acc_pwd', np); setSavedPwd(np); setAuthView('login'); }} />;
      }

      return (
        <div className="pb-28">
          {toast && <div className="fixed top-6 left-4 right-4 z-[100] bg-emerald-500 text-white px-4 py-3 rounded-xl flex items-center gap-3 shadow-xl border border-emerald-400/20 animate-slide-down max-w-sm mx-auto"><Icons.Check /> <span className="text-sm font-bold">{toast}</span></div>}

          <header className="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-10 flex justify-between items-center shadow-md">
            <div className="flex items-center gap-3">
              <div className="bg-emerald-500 p-2.5 rounded-xl text-white"><Icons.Wallet /></div>
              <div><h1 className="text-base font-bold text-white">المحاسب الذكي</h1><p className="text-[11px] text-emerald-400">إدارة الخزن المزدوجة</p></div>
            </div>
            <div className="flex items-center gap-2">
              <a href="assets.html" onClick={triggerHaptic} className="flex items-center gap-1 bg-yellow-600 hover:bg-yellow-500 text-white text-xs px-3 py-2 rounded-lg font-bold shadow-md transition"><Icons.Building /> الأصول</a>
              <button onClick={handleLogout} className="bg-slate-900/60 text-slate-300 text-xs hover:text-red-400 px-3 py-2 rounded-lg border border-slate-700 font-bold transition">🚪 قفل</button>
            </div>
          </header>

          <main className="p-4 max-w-md mx-auto">
            {activeTab === 'dashboard' && <DashboardView calc={calculations} txs={transactions} lastBackup={lastBackup} onDelete={id => handleDelete('tx', id)} onEdit={t => {setQuickAddType('transaction'); setEditData(t); setIsQuickAddOpen(true);}} onReceipt={r => setReceiptData(r)} />}
            {activeTab === 'business' && <BusinessView ptnrs={partnerships} projects={projects} onAddPtnr={() => {setQuickAddType('new_partnership'); setEditData(null); setIsQuickAddOpen(true);}} onEditPtnr={p => {setQuickAddType('new_partnership'); setEditData(p); setIsQuickAddOpen(true);}} onDeletePtnr={id => handleDelete('ptnr', id)} onAddProj={() => {setQuickAddType('new_project'); setEditData(null); setIsQuickAddOpen(true);}} onEditProj={p => {setQuickAddType('new_project'); setEditData(p); setIsQuickAddOpen(true);}} onDeleteProj={id => handleDelete('project', id)} onAllocateDev={p => {triggerHaptic(); setDevFundModal(p);}} onCollectIncome={(p) => { setQuickAddType('transaction'); setEditData({category: `أرباح مشروع (${p.name})`, amount: '', wallet: 'cash', type: 'income', date: new Date().toISOString().split('T')[0]}); setIsQuickAddOpen(true); }} />}
            {activeTab === 'debts' && <DebtsView debts={debts} onDelete={id => handleDelete('debt', id)} onPay={d => {triggerHaptic(); setPaymentModal(d);}} onEdit={d => {setQuickAddType('debt'); setEditData(d); setIsQuickAddOpen(true);}} onReceipt={r => setReceiptData(r)} />}
            {activeTab === 'trusts' && <TrustsView trusts={trusts} onDelete={id => handleDelete('trust', id)} onPay={t => {triggerHaptic(); setTrustPaymentModal(t);}} onEdit={t => {setQuickAddType('trust'); setEditData(t); setIsQuickAddOpen(true);}} onReceipt={r => setReceiptData(r)} />}
            {activeTab === 'profile' && <ProfileView email={savedEmail} onReset={handleResetData} onChangePwd={pwd => { localStorage.setItem('smart_acc_pwd', pwd); setSavedPwd(pwd); showSuccessToast('تم التحديث بنجاح'); }} currentPwd={savedPwd} onBackup={handleBackupData} onRestore={handleRestoreData} lastBackup={lastBackup} onExportExcel={handleExportCSV} />}
          </main>

          <button onClick={() => {triggerHaptic(); setQuickAddType('transaction'); setEditData(null); setIsQuickAddOpen(true);}} className="fixed bottom-24 left-6 w-14 h-14 bg-emerald-500 text-white rounded-full shadow-lg flex items-center justify-center z-20 text-2xl hover:scale-105 transition-transform">➕</button>

          <nav className="fixed bottom-0 w-full bg-slate-800 border-t border-slate-700 py-3 z-10 px-2">
            <div className="flex justify-between items-center max-w-md mx-auto">
              <NavItem icon={<Icons.Home />} label="الرئيسية" active={activeTab==='dashboard'} onClick={() => setActiveTab('dashboard')} />
              <NavItem icon={<Icons.Briefcase />} label="الأعمال" active={activeTab==='business'} onClick={() => setActiveTab('business')} />
              <NavItem icon={<Icons.CreditCard />} label="الديون" active={activeTab==='debts'} onClick={() => setActiveTab('debts')} />
              <NavItem icon={<Icons.Shield />} label="الأمانات" active={activeTab==='trusts'} onClick={() => setActiveTab('trusts')} />
              <NavItem icon={<Icons.Settings />} label="الضبط" active={activeTab==='profile'} onClick={() => setActiveTab('profile')} />
            </div>
          </nav>

          {isQuickAddOpen && <QuickAddModal type={quickAddType} editData={editData} ptnrs={partnerships} onClose={() => {setIsQuickAddOpen(false); setEditData(null);}} onSave={handleSaveItem} />}
          {paymentModal && <PaymentModal item={paymentModal} onClose={() => setPaymentModal(null)} onSave={handlePayDebt} title="تسجيل حركة (دخول/خروج)" subtitle="المتبقي:" />}
          {trustPaymentModal && <PaymentModal item={trustPaymentModal} onClose={() => setTrustPaymentModal(null)} onSave={handlePayTrust} title="تسجيل استرداد/تسليم أمانة" subtitle="المتبقي من الرصيد / الأمانة:" />}
          {devFundModal && <DevFundModal proj={devFundModal} onClose={() => setDevFundModal(null)} onSave={handleAllocateDevFund} />}
          {receiptData && <ReceiptModal data={receiptData} onClose={() => setReceiptData(null)} showToast={showSuccessToast} />}
        </div>
      );
    }

    // --- واجهة لوحة القيادة مع الصافي الحر ---
    function DashboardView({ calc, txs, lastBackup, onDelete, onEdit, onReceipt }) {
      const [search, setSearch] = useState('');
      const filteredTxs = txs.filter(t => (t.category||'').includes(search) || t.amount.toString().includes(search));
      const needsBackup = (calc.totalIn > 0 || calc.totalOut > 0) && (lastBackup === 0 || (Date.now() - lastBackup > 3 * 24 * 60 * 60 * 1000));

      return (
        <div className="space-y-4 animate-pop">
          {needsBackup && (
            <div className="bg-red-500/10 border border-red-500/50 p-3 rounded-xl flex items-center justify-between animate-pop shadow-md">
               <div className="flex items-center gap-3"><span className="text-2xl">⚠️</span><div><p className="text-red-400 font-bold text-sm">تنبيه أمان!</p><p className="text-slate-300 text-xs mt-0.5">مرت فترة دون أخذ نسخة احتياطية.</p></div></div>
            </div>
          )}
          
          <div className="bg-gradient-to-br from-slate-800 to-slate-900 rounded-xl p-5 border border-slate-700 shadow-sm text-center relative overflow-hidden">
            <p className="text-slate-300 text-sm font-bold mb-2">إجمالي السيولة النقدية 🏦</p>
            <h2 className="text-4xl font-black text-white mb-5">{calc.totalAvailableCash.toLocaleString()} <span className="text-sm text-slate-400 font-normal">ج.س</span></h2>
            <div className="grid grid-cols-2 gap-3 mt-3">
                <div className="bg-blue-900/40 p-3 rounded-lg border border-blue-500/30 text-center"><p className="text-xs text-blue-200 mb-1">رصيد البنك 📱</p><h3 className="text-lg font-black text-blue-400">{calc.bankBalance.toLocaleString()}</h3></div>
                <div className="bg-emerald-900/40 p-3 rounded-lg border border-emerald-500/30 text-center"><p className="text-xs text-emerald-200 mb-1">كاش باليد 💵</p><h3 className="text-lg font-black text-emerald-400">{calc.cashBalance.toLocaleString()}</h3></div>
            </div>
          </div>

          <div className="bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-sm">
             <div className="flex justify-between items-center text-yellow-500 font-bold mb-3 text-sm">
               <span>صناديق تطوير المشاريع المجمعة ⚙️:</span>
               <span>{calc.totalDevFunds.toLocaleString()} ج.س</span>
             </div>
             <div className="flex justify-between items-center text-emerald-400 font-black border-t border-slate-700/60 pt-3 text-base">
               <span>الصافي الحر (متاح للصرف) 💸:</span>
               <span>{(calc.totalAvailableCash - calc.totalDevFunds).toLocaleString()} ج.س</span>
             </div>
          </div>

          <div className="bg-slate-800 p-5 rounded-xl border border-slate-700 text-center shadow-sm relative">
             <p className="text-slate-300 text-sm font-bold">صافي الثروة والأملاك (وزنك المالي) 💎</p>
             <h3 className="text-3xl font-black text-blue-400 mt-2">{calc.netWealth.toLocaleString()} <span className="text-xs text-slate-500 font-normal">ج.س</span></h3>
             <div className="flex flex-col gap-1.5 text-xs bg-slate-900/50 p-3 rounded-xl border border-slate-700/50 text-right mt-4">
                <div className="flex justify-between text-emerald-400"><span>الفعلي الحر (غير الأمانات):</span> <span>{calc.actualOwnCash.toLocaleString()} +</span></div>
                <div className="flex justify-between text-blue-400"><span>أرصدة بالخارج:</span> <span>{calc.activeExternal.toLocaleString()} +</span></div>
                {calc.myPartnershipCapital > 0 && <div className="flex justify-between text-blue-400"><span>رأس مال الشراكات:</span> <span>{calc.myPartnershipCapital.toLocaleString()} +</span></div>}
                {calc.totalAssetsValue > 0 && <div className="flex justify-between text-yellow-400 font-bold border-t border-slate-700/50 pt-1 mt-1"><span>الأصول والمقتنيات 🏢:</span> <span>{calc.totalAssetsValue.toLocaleString()} +</span></div>}
                <div className="flex justify-between text-emerald-400"><span>ديون لك:</span> <span>{calc.pendingToMe.toLocaleString()} +</span></div>
                <div className="flex justify-between text-red-400"><span>ديون عليك:</span> <span>{calc.pendingOnMe.toLocaleString()} -</span></div>
             </div>
          </div>

          <div className="bg-slate-800 rounded-xl p-4 border border-slate-700 mt-5">
            <div className="flex justify-between items-center mb-4">
              <h3 className="font-bold text-sm text-white">سجل الحركات</h3>
              <input type="text" placeholder="بحث..." value={search} onChange={e=>setSearch(e.target.value)} className="w-5/12 bg-slate-900 border border-slate-700 text-white rounded-lg py-1.5 px-3 text-xs focus:border-emerald-500 focus:outline-none" />
            </div>
            
            <div className="divide-y divide-slate-700/60 max-h-72 overflow-y-auto pr-1">
              {filteredTxs.map(t => {
                const isBank = t.wallet === 'bank'; const isIncome = t.type === 'income' || t.type === 'trust_bank_in'; const isTransfer = t.type === 'transfer';
                return (
                  <div key={t.id} className="py-3 flex justify-between items-center text-sm">
                    <div className="min-w-0 flex-1 pl-3">
                      <p className="text-white font-bold truncate flex items-center gap-1.5">{isTransfer ? <Icons.ArrowLeftRight /> : (isBank ? '📱' : '💵')} {t.category}</p>
                      <p className="text-xs text-slate-500 mt-0.5">{t.date}</p>
                    </div>
                    <div className="flex items-center gap-2 shrink-0">
                      <span className={`font-bold text-sm ml-2 ${isTransfer ? 'text-blue-400' : (isIncome ? 'text-emerald-400' : 'text-red-400')}`}>
                        {!isTransfer && (isIncome ? '+' : '-')} {parseFloat(t.amount||0).toLocaleString()}
                      </span>
                      {!isTransfer && (
                        <button onClick={()=>onReceipt({title: isIncome ? 'سند قبض / إيداع' : 'سند صرف', person: t.category, amount: t.amount, date: t.date, ref: `TRX-${t.id.toString().slice(-5)}`})} className="p-1.5 bg-slate-700 hover:bg-slate-600 text-blue-400 rounded-lg transition">
                          <Icons.Receipt/>
                        </button>
                      )}
                      <button onClick={()=>onEdit(t)} className="p-1.5 bg-slate-700 hover:bg-slate-600 text-emerald-400 rounded-lg transition"><Icons.Edit/></button>
                      <button onClick={()=>onDelete(t.id)} className="p-1.5 bg-slate-700 hover:bg-slate-600 text-red-400 rounded-lg transition"><Icons.Trash/></button>
                    </div>
                  </div>
                );
              })}
              {filteredTxs.length === 0 && <p className="text-center py-6 text-xs text-slate-500">لا توجد حركات.</p>}
            </div>
          </div>
        </div>
      );
    }

    // --- واجهة الأعمال (المشاريع والشراكات) المدمجة والمنفصلة ---
    function BusinessView({ ptnrs, projects, onAddPtnr, onEditPtnr, onDeletePtnr, onAddProj, onEditProj, onDeleteProj, onAllocateDev, onCollectIncome }) {
      const [view, setView] = useState('projects');

      const sendPartnerWhatsApp = (pName, pShareAmount, projName, date) => {
        triggerHaptic();
        const text = `📊 *إشعار جرد وتوزيع أرباح*\n-----------------------\n👤 *الشريك:* ${pName}\n💼 *المشروع:* ${projName}\n📅 *التاريخ:* ${date}\n-----------------------\n💰 *صافي الأرباح:* ${pShareAmount.toLocaleString()} ج.س`;
        window.location.href = `whatsapp://send?text=${encodeURIComponent(text)}`;
      };

      return (
        <div className="space-y-4 animate-pop">
          <div className="flex bg-slate-800 p-1.5 rounded-xl border border-slate-700 shadow-sm">
            <button onClick={()=>{triggerHaptic(); setView('projects');}} className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${view==='projects'?'bg-emerald-500 text-white shadow':'text-slate-400 hover:text-white'}`}>المشاريع التشغيلية (الخاصة)</button>
            <button onClick={()=>{triggerHaptic(); setView('ptnrs');}} className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${view==='ptnrs'?'bg-emerald-500 text-white shadow':'text-slate-400 hover:text-white'}`}>الشراكات الكبرى (جرد)</button>
          </div>

          {view === 'projects' ? (
             <div className="space-y-4 animate-pop">
               <div className="flex justify-between items-center px-1">
                 <h2 className="text-sm font-bold text-white">المشاريع التجارية النشطة</h2>
                 <button onClick={onAddProj} className="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-sm">➕ مشروع جديد</button>
               </div>
               {projects.map(proj => (
                 <div key={proj.id} className="bg-slate-800 rounded-2xl p-5 border border-slate-700 shadow-md relative space-y-3">
                    <div className="absolute top-4 left-4 flex gap-1.5">
                      <button onClick={()=>onEditProj(proj)} className="p-1.5 bg-slate-700 hover:bg-slate-600 text-emerald-400 rounded-lg transition"><Icons.Edit/></button>
                      <button onClick={()=>onDeleteProj(proj.id)} className="p-1.5 bg-slate-700 hover:bg-slate-600 text-red-400 rounded-lg transition"><Icons.Trash/></button>
                    </div>
                    <h3 className="font-bold text-white text-base pr-16 truncate">{proj.name}</h3>
                    <p className="text-xs text-slate-400 border-b border-slate-700/60 pb-3">رأس المال المشغل: {parseFloat(proj.capital||0).toLocaleString()} ج.س</p>

                    <div className="bg-slate-900/50 p-3.5 rounded-xl border border-slate-700/50 flex justify-between items-center">
                       <div>
                         <p className="text-[11px] text-slate-400 mb-1">مال التطوير المحتجز للمشروع ⚙️</p>
                         <p className="text-sm font-black text-yellow-500">{(proj.devFund||0).toLocaleString()} ج.س</p>
                       </div>
                       <button onClick={()=>onAllocateDev(proj)} className="bg-yellow-500/10 hover:bg-yellow-500/20 text-yellow-500 border border-yellow-500/30 px-3 py-2 rounded-lg text-xs font-bold transition">تخصيص</button>
                    </div>
                    
                    <button onClick={()=>onCollectIncome(proj)} className="w-full bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 py-3 rounded-xl text-xs font-bold border border-emerald-500/30 transition shadow-sm mt-1">تسجيل وتحصيل أرباح 💸</button>
                 </div>
               ))}
               {projects.length === 0 && <p className="text-center py-6 text-xs text-slate-500 border border-dashed border-slate-700 rounded-2xl mt-4">لا توجد مشاريع تشغيلية مسجلة.</p>}
             </div>
          ) : (
             <div className="space-y-4 animate-pop">
               <div className="flex justify-between items-center px-1">
                 <h2 className="text-sm font-bold text-white">إدارة الشراكات (الأطراف)</h2>
                 <button onClick={onAddPtnr} className="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-sm">➕ شراكة جديدة</button>
               </div>
               {ptnrs.map(proj => {
                 const evals = proj.evaluations || []; const lastEval = evals[evals.length - 1];
                 const totalCash = lastEval ? parseFloat(lastEval.totalCash || 0) : 0; const fixedCapital = parseFloat(proj.capital || 0);
                 const profit = totalCash > fixedCapital ? totalCash - fixedCapital : 0;
                 const totalProjectCapital = proj.allocationMode === 'capital' ? proj.partners.reduce((sum, p) => sum + parseFloat(p.amount || 0), 0) || 1 : fixedCapital;

                 return (
                   <div key={proj.id} className="bg-slate-800 rounded-xl p-4 border border-slate-700 text-sm relative shadow-md">
                     <div className="absolute top-4 left-4 flex gap-1.5">
                       <button onClick={()=>onEditPtnr(proj)} className="p-1.5 bg-slate-700 hover:bg-slate-600 text-emerald-400 rounded-lg transition"><Icons.Edit/></button>
                       <button onClick={()=>onDeletePtnr(proj.id)} className="p-1.5 bg-slate-700 hover:bg-slate-600 text-red-400 rounded-lg transition"><Icons.Trash/></button>
                     </div>
                     <h3 className="font-bold text-white text-base mb-1 truncate max-w-[70%]">{proj.name}</h3>
                     <p className="text-xs text-slate-400 mb-3">إجمالي رأس المال: {fixedCapital.toLocaleString()} ج.س</p>
                     <div className="bg-slate-900/50 p-3 rounded-xl border border-slate-700/50 space-y-2">
                       <p className="text-xs text-slate-400 font-bold border-b border-slate-700 pb-1.5">📋 توزيع الأرباح (آخر جرد):</p>
                       {lastEval && profit > 0 ? proj.partners.map((p, i) => {
                         let computedShare = proj.allocationMode === 'capital' ? (parseFloat(p.amount || 0) / totalProjectCapital) * 100 : parseFloat(p.share || 0);
                         const pShareAmount = profit * (computedShare / 100);
                         return (
                           <div key={i} className="flex justify-between items-center text-xs text-slate-300 py-1 bg-slate-800/60 px-2.5 rounded-lg mb-1">
                             <span className="truncate max-w-[45%] font-medium">{p.name} <span className="text-[11px] text-slate-400">({computedShare.toFixed(1)}%)</span></span>

                               <span className="text-emerald-400 font-bold">+{pShareAmount.toLocaleString()}</span>
                               {p.name !== 'أنت' && (<button onClick={() => sendPartnerWhatsApp(p.name, pShareAmount, proj.name, lastEval.date)} className="p-1 bg-emerald-600/30 text-emerald-400 rounded hover:bg-emerald-600/50 transition"><Icons.Share /></button>)}
                             </div>
                           </div>
                         );
                       }) : <p className="text-center text-xs text-slate-500 py-2">لا يوجد أرباح مجرودة بعد</p>}
                     </div>
                   </div>
                 );
               })}
             </div>
          )}
        </div>
      );
    }

    // --- الديون ---

        const rem = d.amount - (d.paid || 0); const isPaid = rem <= 0; const pct = ((d.paid || 0) / d.amount) * 100;
        let barColor = pct >= 50 ? "bg-emerald-500" : "bg-red-500"; if (mode === 'on_me') barColor = pct >= 50 ? "bg-red-500" : "bg-emerald-500";

          <div key={d.id} className={`bg-slate-800 p-4 rounded-xl border border-slate-700/70 space-y-3 shadow-sm ${isPaid?'opacity-50':''}`}>

                <button onClick={()=>onReceipt({title: mode === 'to_me' ? 'كشف حساب دين (مستحق لي)' : 'كشف حساب دين (التزام علي)', person: d.person, amount: d.amount, paid: d.paid || 0, rem: rem, date: d.date || new Date().toISOString().split('T')[0], ref: `DBT-${d.id.toString().slice(-5)}`, isDetailed: true})} className="text-blue-400 p-1.5 hover:bg-slate-700 rounded-lg transition"><Icons.Receipt/></button>

                <div className="flex justify-between text-[11px] text-slate-400 font-medium"><span>مُسدد: {(d.paid || 0).toLocaleString()}</span><span>متبقي: {rem.toLocaleString()}</span></div>

          <h3 className="text-sm font-bold text-emerald-400 px-1">سجل ديون لك 📈</h3><div className="space-y-3">{renderList('to_me', 'to_me')}</div>
          <h3 className="text-sm font-bold text-red-400 border-t border-slate-700/60 pt-4 px-1 mt-2">سجل ديون عليك 📉</h3><div className="space-y-3">{renderList('on_me', 'on_me')}</div>
        </div>

    // --- الأمانات ---

      const renderList = (type, titleColor) => trusts.filter(t => t.type === type).map(t => {
        const rem = t.amount - (t.paid || 0); const isResolved = rem <= 0; const pct = ((t.paid || 0) / t.amount) * 100;
        const barColor = type === 'external' ? 'bg-blue-500' : 'bg-orange-500';

        return (
          <div key={t.id} className={`bg-slate-800 p-4 rounded-xl border border-slate-700/70 relative shadow-sm ${isResolved ? 'opacity-50' : ''}`}>
             <div className="absolute top-3 left-3 flex gap-1.5">
                <button onClick={()=>onReceipt({title: type === 'external' ? 'كشف حساب أمانة (بالخارج)' : 'كشف حساب أمانة (لغيري)', person: t.person, amount: t.amount, paid: t.paid || 0, rem: rem, date: t.date || new Date().toISOString().split('T')[0], ref: `TRU-${t.id.toString().slice(-5)}`, isDetailed: true})} className="p-1.5 text-blue-400 hover:bg-slate-700 rounded-lg transition"><Icons.Receipt/></button>
                <button onClick={()=>onEdit(t)} className="p-1.5 text-emerald-400 hover:bg-slate-700 rounded-lg transition"><Icons.Edit/></button>
                <button onClick={()=>onDelete(t.id)} className="p-1.5 text-red-400 hover:bg-slate-700 rounded-lg transition"><Icons.Trash/></button>
             </div>
             <h4 className="font-bold text-white text-base truncate max-w-[55%] mb-1">{t.person}</h4>
             <div className="mt-3 space-y-1.5 text-xs"><div className="flex justify-between"><span className="text-slate-400">الأساسي:</span><span className={`font-bold text-${titleColor}-400 text-sm`}>{t.amount.toLocaleString()} ج.س</span></div></div>
             
             {!isResolved ? (
               <div className="mt-4 space-y-3">
                  <div className="space-y-1.5">
                    <div className="h-2 w-full bg-slate-900 rounded-full overflow-hidden"><div style={{width: `${pct}%`}} className={`h-full rounded-full transition-all duration-300 ${barColor}`}></div></div>
                    <div className="flex justify-between text-[11px] text-slate-400 font-medium"><span>حركة: {(t.paid || 0).toLocaleString()}</span><span>المتبقي: {rem.toLocaleString()}</span></div>
                  </div>
                  <button onClick={()=>onPay(t)} className="w-full bg-slate-700 hover:bg-slate-600 text-white py-2 rounded-xl text-xs font-bold transition shadow-sm">تسجيل (استرداد/تسليم) 💸</button>
               </div>
             ) : (<div className="w-full mt-4 bg-emerald-500/10 text-emerald-400 py-2 rounded-xl text-xs font-bold text-center border border-emerald-500/20">✅ الرصيد مصفى</div>)}
          </div>
        );
      });

      return (
        <div className="space-y-5 animate-pop">
          <h3 className="text-sm font-bold text-blue-400 px-1">أرصدة بالخارج 📤</h3><div className="space-y-3">{renderList('external', 'blue')}</div>
          <h3 className="text-sm font-bold text-orange-400 border-t border-slate-700/60 pt-4 mt-2 px-1">أمانات للغير 📥</h3><div className="space-y-3">{renderList('with_me', 'orange')}</div>
        </div>
      );
    }

    // --- الضبط ---
    function ProfileView({ email, onReset, onChangePwd, currentPwd, onBackup, onRestore, lastBackup, onExportExcel }) {
      const [pwd, setPwd] = useState(''); const [restoreCode, setRestoreCode] = useState('');
      const formatLastBackup = () => { if (!lastBackup) return 'لم يتم أخذ نسخة ⚠️'; return new Date(lastBackup).toLocaleString('ar-EG', { dateStyle: 'short', timeStyle: 'short' }); };

      return (
        <div className="space-y-5 animate-pop text-sm pb-6">
          <div className="bg-slate-800 p-4 rounded-xl text-center border border-slate-700 shadow-sm"><p className="text-xs text-slate-400 mb-1">الحساب الفعال</p><p className="text-white font-bold text-base">{email}</p></div>
          <div className="bg-slate-800 p-4 rounded-xl border border-blue-500/30 relative shadow-sm">
             <div className="absolute top-0 right-0 w-1.5 bg-blue-500 h-full"></div>
             <h3 className="font-bold text-blue-400 mb-1.5 flex items-center gap-2 text-base"><Icons.FileExcel /> التقارير</h3><p className="text-xs text-slate-400 mb-4">تحميل السجلات كملف إكسل.</p>
             <button onClick={onExportExcel} className="w-full bg-slate-700 hover:bg-slate-600 text-blue-400 py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition"><Icons.Download /> تصدير (Excel)</button>
          </div>
          <div className="bg-slate-800 p-4 rounded-xl border border-emerald-500/30 relative shadow-sm">
             <div className="absolute top-0 right-0 w-1.5 bg-emerald-500 h-full"></div>
             <h3 className="font-bold text-emerald-400 mb-1.5 flex items-center gap-2 text-base"><Icons.Shield /> السحابة</h3>
             <div className="bg-slate-900/50 p-3 rounded-xl border border-slate-700/50 mb-4 mt-3"><p className="text-xs text-slate-300 flex justify-between items-center"><span>آخر نسخة:</span><span className={!lastBackup || (Date.now() - lastBackup > 259200000) ? 'text-red-400 font-bold bg-red-500/10 px-2 py-1 rounded' : 'text-emerald-400 font-bold bg-emerald-500/10 px-2 py-1 rounded'}>{formatLastBackup()}</span></p></div>
             <button onClick={onBackup} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl font-bold shadow-md mb-5 flex items-center justify-center gap-2 transition"><Icons.Cloud /> أخذ نسخة لجوجل كيب</button>
             <div className="border-t border-slate-700/60 pt-4"><p className="text-xs font-bold text-slate-300 mb-3">استعادة الحسابات:</p><textarea value={restoreCode} onChange={e=>setRestoreCode(e.target.value)} placeholder="ألصق كود النسخة هنا..." className="w-full bg-slate-900 text-emerald-400 p-3 rounded-xl border border-slate-600 text-xs h-20 font-mono mb-3 focus:outline-none focus:border-emerald-500 transition" /><button onClick={()=>{if(restoreCode.trim() && window.confirm('متأكد من الاستعادة؟')) { onRestore(restoreCode); setRestoreCode(''); } }} className="w-full bg-slate-700 hover:bg-slate-600 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition"><Icons.Download /> تأكيد الاستعادة</button></div>
          </div>
          <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3 mt-5 shadow-sm"><p className="text-xs text-slate-400">تعديل الرمز الحالي: <span className="text-white bg-slate-900 px-2.5 py-1 rounded-lg font-bold mx-1">{currentPwd}</span></p><div className="flex gap-2.5"><input type="text" value={pwd} onChange={e=>setPwd(e.target.value)} placeholder="رمز جديد..." className="flex-1 bg-slate-900 p-3 rounded-xl text-white border border-slate-700 text-sm focus:outline-none focus:border-emerald-500" /><button onClick={()=>{if(pwd.trim()){onChangePwd(pwd.trim()); setPwd('');}}} className="bg-emerald-500 hover:bg-emerald-600 text-white px-5 rounded-xl font-bold transition">حفظ</button></div></div>
          <button onClick={onReset} className="w-full bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 py-3 rounded-xl font-bold mt-3 transition">تصفير السجلات المالية بالكامل</button>
        </div>
      );
    }

    function NavItem({ icon, label, active, onClick }) {
      return (
        <button onClick={() => { triggerHaptic(); onClick(); }} className={`flex flex-col items-center p-2 rounded-xl transition-all ${active ? 'text-emerald-400 bg-slate-700/50' : 'text-slate-500 hover:text-slate-300'}`}>
          <div>{icon}</div><span className="text-[10px] sm:text-[11px] font-bold mt-1 whitespace-nowrap">{label}</span>
        </button>
