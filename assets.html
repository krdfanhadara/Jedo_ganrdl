<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:system-ui,sans-serif;background:#020617;color:#f8fafc;-webkit-tap-highlight-color:transparent}input[type=number]::-webkit-inner-spin-button{display:none}.pop{animation:p .2s ease-out forwards}@keyframes p{0%{transform:scale(.95);opacity:0}100%{transform:scale(1);opacity:1}}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo}=React;
const I={
 B:()=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-5 h-5"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-6h6v6M8 6h.01M16 6h.01M8 10h.01M16 10h.01M8 14h.01M16 14h.01"/></svg>,
 G:()=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-5 h-5"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 3"/></svg>,
 C:()=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-5 h-5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>,
 A:()=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-5 h-5"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 6h6M9 10h6M9 14h6M9 18h6"/></svg>,
 W:()=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-5 h-5"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4M4 6v12c0 1.1.9 2 2 2h14v-4M18 12a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h4v-6Z"/></svg>,
 S:()=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-5 h-5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 5.4 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1-2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
 T:()=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-4 h-4"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></svg>,
 E:()=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-4 h-4"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
 R:()=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-4 h-4"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/></svg>
};
const vib=()=>{if(navigator.vibrate)navigator.vibrate(30)};
const jP=(k)=>{try{return JSON.parse(localStorage.getItem(k))||[];}catch(e){return [];}};

function AuthScreen({view,setView,savedEmail,savedPwd,savedSecAnswer,onRegister,onLogin,onResetPwd}){
 const [em,setEm]=useState('');const [pw,setPw]=useState('');const [sec,setSec]=useState('');
 useEffect(()=>{if(savedEmail)setEm(savedEmail);},[savedEmail]);
 const sub=e=>{
  e.preventDefault();vib();
  if(view==='register'){
   if(!em||pw.length<4||!sec)return alert('أكمل الحقول (الرمز 4 أرقام على الأقل)');
   onRegister(em.toLowerCase(),pw,sec.trim());
  }else if(view==='login'){
   if(em.toLowerCase()===savedEmail.toLowerCase()&&pw===savedPwd)onLogin();else alert('البيانات غير صحيحة!');
  }else if(view==='forgot'){
   if((em||'').toLowerCase()===(savedEmail||'').toLowerCase()&&(sec||'').trim()===(savedSecAnswer||'').trim()){
    const np=prompt('الرمز الجديد:');if(np&&np.length>=4)onResetPwd(np);else alert('مرفوض');
   }else alert('إجابة خاطئة!');
  }
 };
 return(
  <div className="min-h-[80vh] flex items-center justify-center p-4">
   <div className="bg-slate-900 p-8 rounded-3xl w-full max-w-sm border border-slate-800 text-center space-y-4 shadow-xl">
    <h1 className="text-xl font-bold text-yellow-500">🔐 منصة الأصول والمقتنيات</h1>
    <form onSubmit={sub} className="space-y-3">
     <input type="email" required placeholder="البريد الإلكتروني" value={em} onChange={e=>setEm(e.target.value)} className="w-full bg-slate-950 border border-slate-800 text-white p-3.5 rounded-xl text-left text-sm outline-none" />
     {view!=='forgot'&&<input type="password" required placeholder="رمز الدخول" value={pw} onChange={e=>setPw(e.target.value)} className="w-full bg-slate-950 border border-slate-800 text-white p-3.5 rounded-xl text-left text-sm outline-none" />}
     {(view==='register'||view==='forgot')&&<input type="text" required placeholder="سؤال الأمان: مدينتك المفضلة؟" value={sec} onChange={e=>setSec(e.target.value)} className="w-full bg-slate-950 border border-slate-800 text-yellow-500 p-3.5 rounded-xl text-sm outline-none" />}
     <button type="submit" className="w-full bg-yellow-500 text-slate-950 font-bold py-3.5 rounded-xl text-sm">{view==='login'?'دخول المنصة':view==='register'?'إنشاء حساب':'استعادة الصلاحية'}</button>
    </form>
    <div className="mt-6 flex flex-col gap-3 text-center text-sm">
     {view==='login'?(<><button onClick={()=>setView('forgot')} className="text-slate-400">نسيت الرمز؟</button><button onClick={()=>setView('register')} className="text-yellow-500 font-bold">ملف جديد ➕</button></>):(<button onClick={()=>setView('login')} className="text-slate-400">تسجيل دخول 🔑</button>)}
    </div>
   </div>
  </div>
 );
}

function Feas() {
 const [n,setN]=useState('');const [d,setD]=useState(()=>new Date().toISOString().split('T')[0]);
 const [c,setC]=useState('');const [rv,setRv]=useState('');const [rf,setRf]=useState('monthly');
 const [ex,setEx]=useState('');const [ef,setEf]=useState('monthly');const [rm,setRm]=useState('15');
 const [cr,setCr]=useState('');const [dm,setDm]=useState('5');const [cm,setCm]=useState('');
 const [res,setRes]=useState(null);

 const calc=()=>{
  vib();const cap=parseFloat(c)||0;const r=parseFloat(rv)||0;const e=parseFloat(ex)||0;
  const rate=((rm==='custom'?parseFloat(cr):parseFloat(rm))||0)/100;
  const yrs=dm==='custom'?(parseFloat(cm||0)/12):parseInt(dm);
  if(cap<=0||r<=0||yrs<=0)return alert('الرجاء إدخال بيانات صحيحة لكافة بنود المشروع والمدة زمانياً.');
  const m={'daily':360,'weekly':52,'monthly':12,'yearly':1};const aF=(r*m[rf])-(e*m[ef]);
  if(aF<=0)return setRes({err:'تنبيه مالي: تكاليف التشغيل تفوق الأرباح المتوقعة! المشروع خاسر.'});
  const tP=aF*yrs;let npv=0;
  if(yrs>=1){for(let t=1;t<=Math.floor(yrs);t++)npv+=aF/Math.pow(1+rate,t);const rem=yrs-Math.floor(yrs);if(rem>0)npv+=(aF*rem)/Math.pow(1+rate,Math.ceil(yrs));}
  else{npv=tP/Math.pow(1+rate,yrs);}
  npv-=cap;const tD=Math.round((cap/aF)*30);
  setRes({id:`FEAS-${Date.now().toString().slice(-5)}`,tP,npv,roi:(tP/cap)*100,mo:Math.floor(tD/30),dy:tD%30,ok:npv>0,yrs});
 };

 const share=()=>{
  const txt=`📊 *تقرير دراسة جدوى موثق*\n🔢 الرقم التسلسلي: ${res.id}\n💼 اسم المشروع: ${n||'عام'}\n📅 تاريخ الدراسة: ${d}\n💰 رأس المال: ${parseFloat(c).toLocaleString()} ج.س\n📈 الأرباح الصافية (${dm==='custom'?cm+' شهر':'سنوية'}): ${Math.round(res.tP).toLocaleString()} ج.س\n⚖️ أرباح (NPV): ${Math.round(res.npv).toLocaleString()} ج.س\n⚡ العائد (ROI): ${res.roi.toFixed(1)}%\n⏱️ الاسترداد: ${res.mo} شهر و ${res.dy} يوم\n-----------------------\n🔮 القرار: ${res.ok?'✅ مشروع ناجح':'❌ التضخم يبتلع الأرباح'}`;
  navigator.clipboard.writeText(txt);alert('تم نسخ التقرير المالي!');
 };

 return (
  <div className="bg-slate-900 p-5 rounded-3xl border border-slate-800 space-y-4 pop">
   <h3 className="text-sm font-black text-white border-b border-slate-800 pb-2 flex gap-2"><I.A/> استوديو تحليل دراسات الجدوى</h3>
   <div className="space-y-3 text-xs">
    <input type="text" placeholder="اسم المشروع التجاري المقترح..." value={n} onChange={e=>setN(e.target.value)} className="w-full bg-slate-950 text-white p-3.5 rounded-xl border border-slate-800 outline-none" />
    <input type="date" value={d} onChange={e=>setD(e.target.value)} className="w-full bg-slate-950 text-white p-3.5 rounded-xl text-center font-bold border border-slate-800 outline-none" />
    <input type="number" placeholder="رأس المال المطلوب للتشغيل (ج.س)" value={c} onChange={e=>setC(e.target.value)} className="w-full bg-slate-950 text-white p-3.5 rounded-xl text-center font-bold border border-slate-800 outline-none" />
    <div className="p-4 bg-slate-950 rounded-2xl border border-slate-800 space-y-3">
     <div className="flex gap-2"><input type="number" placeholder="إيراد ومداخيل المشروع" value={rv} onChange={e=>setRv(e.target.value)} className="flex-1 bg-slate-900 p-3 rounded-xl text-center font-bold text-emerald-400 outline-none" /><select value={rf} onChange={e=>setRf(e.target.value)} className="bg-slate-900 text-white p-2 rounded-xl font-bold outline-none"><option value="daily">يومياً</option><option value="weekly">أسبوعياً</option><option value="monthly">شهرياً</option><option value="yearly">سنوياً</option></select></div>
     <div className="flex gap-2"><input type="number" placeholder="مصروف وتكلفة الدورة" value={ex} onChange={e=>setEx(e.target.value)} className="flex-1 bg-slate-900 p-3 rounded-xl text-center font-bold text-red-400 outline-none" /><select value={ef} onChange={e=>setEf(e.target.value)} className="bg-slate-900 text-white p-2 rounded-xl font-bold outline-none"><option value="daily">يومياً</option><option value="weekly">أسبوعياً</option><option value="monthly">شهرياً</option><option value="yearly">سنوياً</option></select></div>
    </div>
    <select value={rm} onChange={e=>setRm(e.target.value)} className="w-full bg-slate-950 p-3.5 rounded-xl font-bold text-white outline-none"><option value="15">تضخم 15% (معيار محاسبي متزن)</option><option value="20">تضخم 20% (مخاطرة ومرتفع بالسوق)</option><option value="custom">أخرى (أدخل معدل مخصص)...</option></select>
    {rm==='custom'&&<input type="number" placeholder="اكتب نسبة التضخم المخصصة %" value={cr} onChange={e=>setCr(e.target.value)} className="w-full bg-slate-950 p-3 rounded-xl text-center font-bold text-yellow-400 border border-slate-800" />}
    <select value={dm} onChange={e=>setDm(e.target.value)} className="w-full bg-slate-950 p-3.5 rounded-xl text-center font-bold text-white outline-none"><option value="1">سنة واحدة فقط</option><option value="2">سنتان</option><option value="3">3 سنوات</option><option value="5">5 سنوات (معياري)</option><option value="10">10 سنوات</option><option value="custom">أخرى (تحديد مدة بالشهور)...</option></select>
    {dm==='custom'&&<input type="number" placeholder="أدخل عدد الشهور المطلوبة (مثال: 6)" value={cm} onChange={e=>setCm(e.target.value)} className="w-full bg-slate-950 p-3 rounded-xl text-center font-bold text-yellow-400 border border-slate-800" />}
   </div>
   <button type="button" onClick={calc} className="w-full bg-yellow-500 text-slate-950 font-black py-4 rounded-xl text-sm">تطبيق الخوارزمية واستخراج التقرير ⚙️</button>
   {res&&!res.err&&(
    <div className="bg-slate-950 p-5 rounded-2xl border border-slate-800 space-y-3 text-xs pop">
     <div className="flex justify-between text-slate-400"><span>الرقم المرجعي للدراسة:</span><span className="font-bold text-white font-mono">{res.id}</span></div>
     <div className="flex justify-between border-t border-slate-800 pt-2"><span>الربح الصافي ({dm==='custom'?cm+' شهر':'سنوي'}):</span><span className="text-emerald-400 font-bold text-sm">{Math.round(res.tP).toLocaleString()} ج</span></div>
     <div className="flex justify-between"><span>الأرباح الحقيقية الصافية (NPV):</span><span className={res.ok?'text-emerald-400 font-bold':'text-red-400 font-bold'}>{Math.round(res.npv).toLocaleString()} ج</span></div>
     <div className="flex justify-between"><span>نسبة أرباح المشروع الكلية (ROI):</span><span className="text-yellow-500 font-bold">{res.roi.toFixed(1)}%</span></div>
     <div className="flex justify-between border-b border-slate-800 pb-2"><span>زمن استرداد رأس المال:</span><span className="text-white font-bold text-sm">{res.mo} شهراً و {res.dy} يوماً</span></div>
     <p className={`p-2.5 rounded-xl text-center font-bold ${res.ok?'bg-emerald-500/10 text-emerald-400':'bg-red-500/10 text-red-400'}`}>{res.ok?'✅ ينصح ببدء المشروع فوراً، الأرباح ممتازة':'❌ تحذير: غير مجدٍ، التضخم يبتلع الأرباح'}</p>
     <button type="button" onClick={share} className="w-full bg-slate-900 text-blue-400 py-3 rounded-xl font-bold">📋 مشاركة تفاصيل دراسة الجدوى</button>
    </div>
   )}
   {res&&res.err&&<div className="bg-red-500/10 p-3 rounded-xl text-red-400 text-center font-bold text-xs">{res.err}</div>}
  </div>
 );
}

function Mod({g24,ed,cls,sav}) {
 const isE=!!ed;const gt=isE?(ed.type||(ed.grams!==undefined?'gold':'real_estate')):'real_estate';
 const [ty,setTy]=useState(gt);const [pm,setPm]=useState(isE&&ed.purityLabel?'other':(isE&&ed.purity==0.875?'21':(isE&&ed.purity==0.75?'18':'24')));
 const [f,setF]=useState(isE?{...ed}:{name:'',area:'',currentValue:'',isRented:'no',monthlyRent:'',annualGrowth:'',grams:'',habba:'',purity:'1',periodicIncome:'',incomeFreq:'daily',customName:'',customFactor:''});
 const am=(parseFloat(f.area)>0&&parseFloat(f.currentValue)>0)?(parseFloat(f.currentValue)/parseFloat(f.area)):0;
 const snd=()=>{
  const id=isE?ed.id:Date.now();const dt=isE?ed.date:new Date().toISOString().split('T')[0];
  if(ty==='real_estate'){sav({id,type:'real_estate',name:f.name,area:parseFloat(f.area)||0,pricePerMeter:am,currentValue:parseFloat(f.currentValue)||0,isRented:f.isRented==='yes',monthlyRent:parseFloat(f.monthlyRent)||0,annualGrowth:parseFloat(f.annualGrowth)||0,date:dt},isE);}
  else if(ty==='gold'){const tg=(parseFloat(f.grams)||0)+(parseFloat(f.habba)||0)*0.058;const fp=pm==='other'?parseFloat(f.customFactor):(pm==='21'?0.875:(pm==='18'?0.75:1));const fl=pm==='other'?f.customName:`ذهب عيار ${pm}`;sav({id,type:'gold',name:f.name||fl,grams:parseFloat(f.grams)||0,habba:parseFloat(f.habba)||0,totalGrams:tg,purity:fp,purityLabel:fl,currentValue:tg*g24*fp,date:dt},isE);}
  else{sav({id,type:'vehicle_livestock',name:f.name,currentValue:parseFloat(f.currentValue)||0,isRented:f.isRented==='yes',periodicIncome:parseFloat(f.periodicIncome)||0,incomeFreq:f.incomeFreq||'daily',date:dt},isE);}
 };
 return (
  <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
   <div className="bg-slate-900 w-full max-w-sm rounded-3xl p-5 border border-slate-800 space-y-4 max-h-[85vh] overflow-y-auto pop">
    <div className="flex justify-between items-center"><h2 className="font-bold text-white text-base">{isE?'تعديل بيانات الحفظ ✏️':'قيد ملكية أصل جديد 🏢'}</h2><button onClick={cls} className="text-slate-400">❌</button></div>
    {!isE&&<div className="flex bg-slate-950 p-1 rounded-xl text-xs font-bold border border-slate-800"><button onClick={()=>setTy('real_estate')} className={`flex-1 py-2 rounded-lg ${ty==='real_estate'?'bg-yellow-500 text-slate-950':''}`}>عقار</button><button onClick={()=>setTy('gold')} className={`flex-1 py-2 rounded-lg ${ty==='gold'?'bg-yellow-500 text-slate-950':''}`}>ذهب/نفائس</button><button onClick={()=>setTy('vehicle_livestock')} className={`flex-1 py-2 rounded-lg ${ty==='vehicle_livestock'?'bg-yellow-500 text-slate-950':''}`}>مركبات/مواشي</button></div>}
    <div className="space-y-3 text-xs">
     <input type="text" placeholder="اسم أو بيان الأصل العقاري/التجاري" value={f.name||''} onChange={e=>setF({...f,name:e.target.value})} className="w-full bg-slate-950 text-white p-3.5 rounded-xl border border-slate-800 outline-none" />
     {ty==='real_estate'&&(
      <div className="space-y-3">
       <input type="number" placeholder="المساحة الإجمالية (م²)" value={f.area||''} onChange={e=>setF({...f,area:e.target.value})} className="w-full bg-slate-950 p-3.5 rounded-xl text-center font-bold outline-none text-white" />
       <input type="number" placeholder="القيمة المالية التقديرية الحالية" value={f.currentValue||''} onChange={e=>setF({...f,currentValue:e.target.value})} className="w-full bg-slate-950 p-3.5 rounded-xl text-center font-bold outline-none text-white" />
       {am>0&&<div className="bg-slate-950 p-3 rounded-xl border border-slate-800 flex justify-between"><span>سعر المتر المستنتج آليًّا:</span><span className="text-emerald-400 font-bold">{Math.round(am).toLocaleString()} ج.س</span></div>}
       <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 flex justify-between"><span>هل العقار مؤجّر حاليًا؟</span><select value={f.isRented||'no'} onChange={e=>setF({...f,isRented:e.target.value})} className="bg-slate-900 text-white p-1 rounded font-bold outline-none"><option value="no">لا، أصل ثابت</option><option value="yes">نعم، استثماري مدر للربح</option></select></div>
       {f.isRented==='yes'&&(
        <div className="space-y-3 pt-3 border-t border-slate-800 pop"><input type="number" placeholder="قيمة الإيجار الشهري الحالي" value={f.monthlyRent||''} onChange={e=>setF({...f,monthlyRent:e.target.value})} className="w-full bg-slate-950 p-3.5 rounded-xl text-center font-bold outline-none text-white" /><input type="number" placeholder="الزيادة السنوية المقررة للعقد %" value={f.annualGrowth||''} onChange={e=>setF({...f,annualGrowth:e.target.value})} className="w-full bg-slate-950 p-3.5 rounded-xl text-center font-bold outline-none text-white" /></div>
       )}
      </div>
     )}
     {ty==='gold'&&(
      <div className="space-y-3">
       <input type="number" placeholder="الوزن الصافي بالجرامات الصحيحة" value={f.grams||''} onChange={e=>setF({...f,grams:e.target.value})} className="w-full bg-slate-950 p-3.5 rounded-xl text-center font-bold outline-none text-white" />
       <input type="number" placeholder="عدد الحبات والكسور (إن وُجد)" value={f.habba||''} onChange={e=>setF({...f,habba:e.target.value})} className="w-full bg-slate-950 p-3.5 rounded-xl text-center font-bold outline-none text-white" />
       <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2"><label className="font-bold block text-white">العيار الصياغي أو المعدن المخصص:</label><select value={pm} onChange={e=>setPm(e.target.value)} className="w-full bg-slate-900 text-yellow-400 p-2.5 rounded-xl font-bold outline-none"><option value="24">ذهب - عيار 24 ({Math.round(g24).toLocaleString()} ج)</option><option value="21">ذهب - عيار 21 ({Math.round(g24*0.875).toLocaleString()} ج)</option><option value="18">ذهب - عيار 18 ({Math.round(g24*0.75).toLocaleString()} ج)</option><option value="other">نفائس أخرى مخصصة...</option></select>
       {pm==='other'&&(
        <div className="space-y-2 pt-2 border-t border-slate-800 pop"><input type="text" placeholder="اسم النفيس (مثال: فضة عيار 925)..." value={f.customName||''} onChange={e=>setF({...f,customName:e.target.value})} className="w-full bg-slate-950 p-2.5 rounded-lg text-white outline-none" /><input type="number" placeholder="معامل السعر لعيار 24 (الفضة 0.02)..." value={f.customFactor||''} onChange={e=>setF({...f,customFactor:e.target.value})} className="w-full bg-slate-950 p-2.5 rounded-lg text-center font-bold text-yellow-400 outline-none" /></div>
       )}</div>
      </div>
     )}
     {ty==='vehicle_livestock'&&(
      <div className="space-y-3">
       <input type="number" placeholder="القيمة الرأسمالية الحالية (ثمن الشراء)" value={f.currentValue||''} onChange={e=>setF({...f,currentValue:e.target.value})} className="w-full bg-slate-950 p-3.5 rounded-xl text-center font-bold outline-none text-white" />
       <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 flex justify-between items-center"><span>هل للأصل إنتاج وأرباح ملموسة؟</span><select value={f.isRented||'no'} onChange={e=>setF({...f,isRented:e.target.value})} className="bg-slate-900 text-white p-2 rounded-lg font-bold outline-none"><option value="no">لا، أصل ثابت</option><option value="yes">نعم، يورد أرباحاً دورية</option></select></div>
       {f.isRented==='yes'&&(
        <div className="space-y-2 pt-3 border-t border-slate-800 pop"><label className="text-[11px] text-emerald-400">مبلغ الربح الصافي ودورته النقدية:</label><div className="flex gap-2"><input type="number" placeholder="المبلغ" value={f.periodicIncome||''} onChange={e=>setF({...f,periodicIncome:e.target.value})} className="flex-1 bg-slate-950 p-3.5 rounded-xl text-center font-bold outline-none text-white" /><select value={f.incomeFreq||'daily'} onChange={e=>setF({...f,incomeFreq:e.target.value})} className="bg-slate-900 text-white p-2 rounded-xl font-bold text-xs outline-none"><option value="daily">يومياً</option><option value="weekly">أسبوعياً</option><option value="monthly">شهرياً</option></select></div></div>
       )}
      </div>
     )}
    </div>
    <button onClick={snd} className="w-full bg-yellow-500 text-slate-950 font-black py-4 rounded-xl text-sm">تأكيد وحفظ بيانات الأصل</button>
   </div>
  </div>
 );
}

function App() {
 const [auth,setAuth]=useState(()=>localStorage.getItem('s_acc_sess')==='act');const [vw,setVw]=useState('login');
 const [em,setEm]=useState(()=>localStorage.getItem('s_acc_em')||'');const [pw,setPw]=useState(()=>localStorage.getItem('s_acc_pw')||'1234');const [sec,setSec]=useState(()=>localStorage.getItem('s_acc_sec')||'');
 const [tab,setTab]=useState('assets');const [srch,setSrch]=useState('');
 const [ast,setAst]=useState(()=>jP('smart_accountant_assets'));
 const [txs,setTxs]=useState(()=>jP('smart_accountant_tx'));
 const [g24,setG24]=useState(()=>Number(localStorage.getItem('cfg_gold_24'))||75000);
 const [bkp,setBkp]=useState(()=>Number(localStorage.getItem('s_acc_bkp'))||0);
 const [mo,setMo]=useState(false);const [ed,setEd]=useState(null);const [rec,setRec]=useState(null);const [tst,setTst]=useState(null);

 useEffect(()=>{if(!localStorage.getItem('s_acc_em'))setVw('register');},[]);
 useEffect(()=>{localStorage.setItem('smart_accountant_assets',JSON.stringify(ast));},[ast]);
 useEffect(()=>{localStorage.setItem('smart_accountant_tx',JSON.stringify(txs));},[txs]);
 useEffect(()=>{localStorage.setItem('cfg_gold_24',g24);},[g24]);

 // إضافة التزامن اللحظي مع تطبيق المحاسب
 useEffect(()=>{
  const syncD=e=>{
   if(e.key==='smart_accountant_assets')setAst(jP('smart_accountant_assets'));
   if(e.key==='smart_accountant_tx')setTxs(jP('smart_accountant_tx'));
   if(e.key==='cfg_gold_24')setG24(Number(localStorage.getItem('cfg_gold_24'))||75000);
  };
  window.addEventListener('storage',syncD);
  return ()=>window.removeEventListener('storage',syncD);
 },[]);

 const shT=m=>{setTst(m);setTimeout(()=>setTst(null),2500);};
 const wlt=useMemo(()=>ast.reduce((s,a)=>s+parseFloat(a.currentValue||0),0),[ast]);
 const fAst=ast.filter(a=>(a.name||'').includes(srch));

 const doBkp=async()=>{
  vib();const f={tx:JSON.parse(localStorage.getItem('smart_accountant_tx'))||[],db:JSON.parse(localStorage.getItem('smart_accountant_dbts'))||[],pt:JSON.parse(localStorage.getItem('smart_accountant_ptnrs'))||[],tr:JSON.parse(localStorage.getItem('smart_accountant_trusts'))||[],as:ast};
  const b=btoa(unescape(encodeURIComponent(JSON.stringify(f))));const t=`[أرشيف]\n${new Date().toLocaleDateString('ar-EG')}\n\n${b}`;
  const n=Date.now();setBkp(n);localStorage.setItem('s_acc_bkp',n);
  try{if(navigator.share)await navigator.share({title:'أرشيف',text:t});else{await navigator.clipboard.writeText(t);shT('تم النسخ!');}}catch(e){shT('تم الحفظ');}
 };
 const doRes=(s)=>{
  vib();try{const e=s.match(/[A-Za-z0-9+/=]{50,}/)?.[0]||s.trim();const d=JSON.parse(decodeURIComponent(escape(atob(e))));
  if(d.as||d.tx){if(d.as)setAst(d.as);if(d.tx)setTxs(d.tx);if(d.db)localStorage.setItem('smart_accountant_dbts',JSON.stringify(d.db));if(d.pt)localStorage.setItem('smart_accountant_ptnrs',JSON.stringify(d.pt));if(d.tr)localStorage.setItem('smart_accountant_trusts',JSON.stringify(d.tr));const n=Date.now();setBkp(n);localStorage.setItem('s_acc_bkp',n);shT('تمت الاستعادة!');}else alert('كود تالف');
  }catch(e){alert('فشل فك التشفير!');}
 };
 const doExp=()=>{
  vib();if(ast.length===0)return alert('لا توجد أصول!');let c="data:text/csv;charset=utf-8,\uFEFFتاريخ,نوع,اسم,قيمة\r\n";
  ast.forEach(a=>{c+=`${a.date},${a.type==='real_estate'?'عقار':(a.type==='gold'?'ذهب':'مركبات')},${a.name},${a.currentValue}\r\n`;});
  const l=document.createElement("a");l.setAttribute("href",encodeURI(c));l.setAttribute("download",`أصول.csv`);document.body.appendChild(l);l.click();document.body.removeChild(l);shT('تم التحميل');
 };
 const savA=(d,i)=>{vib();if(i)setAst(ast.map(a=>a.id===d.id?d:a));else setAst([{...d,id:Date.now()},...ast]);shT('تم الحفظ');setMo(false);setEd(null);};
 const delA=a=>{
  if(window.confirm(`حذف (${a.name})؟ موافق للإبقاء على الأرباح، إلغاء للتطهير.`)){
   setAst(ast.filter(x=>x.id!==a.id));shT('حُذف');
  }else if(window.confirm('تأكيد التطهير النهائي وحذف الأرباح من المحاسب الذكي؟')){
   setAst(ast.filter(x=>x.id!==a.id));
   // تم التأكد من مسح الحركات المرتبطة بالأصل من المحاسب الذكي
   setTxs(txs.filter(t=>!(t.category||'').includes(a.name)));shT('تم التطهير');
  }
 };
 const genInc=a=>{const am=parseFloat(a.type==='real_estate'?a.monthlyRent:a.periodicIncome)||0;if(am<=0)return alert('حدد الربح أولاً');const w=window.confirm(`تحصيل ${am.toLocaleString()} ج.س؟\nموافق للبنك، إلغاء للكاش`);const nt={id:Date.now(),type:'income',amount:am,wallet:w?'bank':'cash',category:`إيراد ربح (${a.name})`,date:new Date().toISOString().split('T')[0]};setTxs([nt,...txs]);setRec({title:'سند أرباح',person:a.name,amount:am,date:nt.date,ref:`INC-${nt.id.toString().slice(-4)}`});};

 if(!auth)return <AuthScreen view={vw} setView={setVw} savedEmail={em} savedPwd={pw} savedSecAnswer={sec} onRegister={(e,p,s)=>{localStorage.setItem('s_acc_em',e);localStorage.setItem('s_acc_pw',p);localStorage.setItem('s_acc_sec',s);localStorage.setItem('s_acc_sess','act');setEm(e);setPw(p);setSec(s);setAuth(true);}} onLogin={()=>{localStorage.setItem('s_acc_sess','act');setAuth(true);}} onResetPwd={n=>{localStorage.setItem('s_acc_pw',n);setPw(n);setVw('login');}} />;

 return (
  <div className="pb-24">
   {tst&&<div className="fixed top-4 left-4 right-4 z-50 bg-yellow-500 text-slate-950 p-3 rounded-xl text-center font-bold pop">{tst}</div>}
   <header className="bg-slate-900 border-b border-yellow-600/30 p-4 sticky top-0 z-10 flex justify-between items-center shadow-lg">
    <div className="flex items-center gap-2"><div className="text-yellow-400 font-bold"><I.B/></div><div><h1 className="text-sm font-black text-white">إدارة الأملاك والأصول</h1><p className="text-[10px] text-yellow-500">السودان</p></div></div>
    <a href="index.html" className="bg-slate-800 text-white text-xs px-3 py-1.5 rounded-lg font-bold">المحاسب الذكي 💼</a>
   </header>
   <main className="p-4 max-w-md mx-auto space-y-4">
    {tab!=='profile'&&(
     <div className="bg-gradient-to-br from-slate-900 to-slate-950 p-6 rounded-3xl border border-yellow-500/20 text-center pop shadow-xl">
      <p className="text-slate-400 text-xs mb-1">القيمة السوقية الحالية</p>
      <h2 className="text-3xl font-black text-yellow-500">{wlt.toLocaleString()} <span className="text-xs text-slate-400">ج</span></h2>
      <div className="mt-3 pt-3 border-t border-slate-800 space-y-2"><div className="flex justify-between items-center text-xs"><span className="text-slate-400">سعر جرام الذهب (24):</span><input type="number" value={g24||''} onChange={e=>{const p=Number(e.target.value)||0;setG24(p);setAst(ast.map(x=>x.type==='gold'?{...x,currentValue:((x.grams||0)+(x.habba||0)*0.058)*p*(x.purity||1)}:x));}} className="w-24 bg-slate-950 text-center text-xs p-1.5 rounded-lg text-yellow-400 font-bold outline-none border border-slate-800" /></div><div className="flex justify-around bg-slate-950 p-2 rounded-xl text-[10px] text-yellow-500/70 font-bold"><span>عيار 21: {Math.round(g24*0.875).toLocaleString()}</span><span>عيار 18: {Math.round(g24*0.75).toLocaleString()}</span></div><a href="https://www.google.com/search?q=سعر+الذهب+اليوم+السودان" target="_blank" className="text-[10px] text-blue-400 underline block text-center">🔍 الأسعار بالسوق المحلي</a></div>
     </div>
    )}
    {tab==='assets'&&(
     <div className="space-y-4 pop">
      <div className="flex justify-between items-center gap-2"><input type="text" placeholder="بحث بالممتلكات..." value={srch} onChange={e=>setSrch(e.target.value)} className="w-1/2 bg-slate-900 text-white rounded-xl py-2 px-3 text-xs outline-none border border-slate-800" /><button onClick={()=>{setEd(null);setMo(true);}} className="bg-yellow-500 text-slate-950 px-4 py-2 rounded-xl text-xs font-bold shadow-md">➕ إضافة أصل</button></div>
      {fAst.map(a=>(
       <div key={a.id} className="bg-slate-900 p-5 rounded-3xl border border-slate-800 relative space-y-2 shadow-sm">
        <div className="absolute top-3 left-3 flex gap-2"><button onClick={()=>setRec({title:'تقييم أصل',person:a.name,amount:a.currentValue,date:a.date,ref:`A-${a.id.toString().slice(-4)}`})} className="p-2 bg-slate-800 text-blue-400 rounded-xl"><I.R/></button><button onClick={()=>{setEd(a);setMo(true);}} className="p-2 bg-slate-800 text-emerald-400 rounded-xl"><I.E/></button><button onClick={()=>delA(a)} className="p-2 bg-slate-800 text-red-400 rounded-xl"><I.T/></button></div>
        <h4 className="font-bold text-white pr-24 truncate text-sm">{a.name}</h4><p className="text-[10px] text-slate-500">{a.type==='gold'?'معادن ونفائس':a.type==='real_estate'?'أملاك عقارية':'مركبات ومواشي'}</p>
        <div className="bg-slate-950 p-3 rounded-2xl flex justify-between items-center text-xs"><span className="text-slate-400">القيمة السوقية:</span><span className="font-bold text-yellow-500 text-sm">{parseFloat(a.currentValue||0).toLocaleString()} ج</span></div>
        {a.isRented&&<button onClick={()=>genInc(a)} className="w-full mt-2 bg-emerald-600/20 text-emerald-400 py-2.5 rounded-xl text-xs font-bold border border-emerald-500/20">تحصيل وضخ الأرباح الدورية 💸</button>}
       </div>
      ))}
     </div>
    )}
    {tab==='projection'&&(
     <div className="space-y-3 pop">
      <div className="bg-blue-950/20 p-4 rounded-2xl border border-blue-500/10 text-xs text-blue-300">🔮 خوارزمية الاستشراف واسترداد التكلفة للأصول المشغّلة:</div>
      {ast.filter(a=>a.isRented).map(a=>{
       const c=parseFloat(a.currentValue||0);const mu={'daily':360,'weekly':52,'monthly':12,'yearly':1};
       const an=a.type==='real_estate'?(parseFloat(a.monthlyRent||0)*12):((parseFloat(a.periodicIncome||0))*mu[a.incomeFreq||'daily']);
       let pb="لا يمكن الحساب";if(an>0&&c>0){const tm=Math.round((c/an)*12);const y=Math.floor(tm/12);const mo=tm%12;pb=y>0?`يسترجع رأسماله بالكامل بعد: ${y} سنة و ${mo} شهر تقريباً.`:`يسترجع رأسماله بالكامل بعد: ${mo} شهر تقريباً.`;}
       let p3=0,p5=0,p10=0;if(a.type==='real_estate'){const r=(a.annualGrowth||0)/100;const m=a.monthlyRent||0;p3=m*Math.pow(1+r,3)*12;p5=m*Math.pow(1+r,5)*12;p10=m*Math.pow(1+r,10)*12;}else{p3=an*3;p5=an*5;p10=an*10;}
       return(
        <div key={a.id} className="bg-slate-900 p-5 rounded-3xl border border-slate-800 space-y-3 text-xs">
         <h4 className="font-bold text-white border-b border-slate-800 pb-2">{a.name}</h4><p className="text-emerald-400 font-bold bg-emerald-500/5 p-2.5 rounded-xl border border-emerald-500/10 text-center text-[11px]">{pb}</p><p className="text-[10px] text-slate-400 pt-1">تراكم الأرباح الصافية مستقبلاً:</p>
         <div className="grid grid-cols-3 gap-3 text-center text-[10px]"><div className="bg-slate-950 p-2 rounded-xl"><p className="text-slate-500 mb-1">3 سنوات</p><p className="text-yellow-500 font-bold">{Math.round(p3).toLocaleString()}</p></div><div className="bg-slate-950 p-2 rounded-xl"><p className="text-slate-500 mb-1">5 سنوات</p><p className="text-yellow-500 font-bold">{Math.round(p5).toLocaleString()}</p></div><div className="bg-slate-950 p-2 rounded-xl"><p className="text-slate-500 mb-1">10 سنوات</p><p className="text-yellow-500 font-bold">{Math.round(p10).toLocaleString()}</p></div></div>
        </div>
       );
      })}
     </div>
    )}
    {tab==='feasibility'&&<Feas />}
    {tab==='profile'&&(
     <div className="space-y-4 pop text-xs pb-6">
      <div className="bg-slate-900 p-4 rounded-2xl text-center border border-slate-800 shadow-md"><p className="text-slate-400 mb-1">الملف المالي النشط</p><p className="text-white font-bold text-sm">{em}</p></div>
      <button onClick={doExp} className="w-full bg-slate-900 text-blue-400 py-3 rounded-xl font-bold border border-slate-800">📄 تصدير سجل الممتلكات (Excel)</button>
      <div className="bg-slate-900 p-4 rounded-2xl border border-yellow-500/20 space-y-3"><h3 className="font-bold text-yellow-500">☁️ الأرشفة السحابية (جوجل كيب)</h3><p className="text-slate-400">المزامنة: {bkp?new Date(bkp).toLocaleString('ar-EG'):'لا يوجد'}</p><button onClick={doBkp} className="w-full bg-yellow-600 text-slate-950 py-2.5 rounded-xl font-bold shadow">ترحيل ونسخ لكافة الأنظمة</button><textarea id="rc" placeholder="كود الاستعادة..." className="w-full bg-slate-950 text-emerald-400 p-2 rounded-xl h-14 border border-slate-800 mt-2 outline-none" /><button onClick={()=>{const v=document.getElementById('rc').value;if(v.trim()&&window.confirm('تأكيد حقن البيانات؟')){doRes(v);document.getElementById('rc').value='';}}} className="w-full bg-slate-800 text-white py-2 rounded-xl font-bold">تأكيد استعادة وحقن</button></div>
      <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-2"><p className="text-slate-400">رمز المرور الأمني: <span className="text-white font-bold bg-slate-950 px-2 py-1 rounded">{pw}</span></p><div className="flex gap-2"><input id="npw" type="text" placeholder="تحديث الرمز..." className="flex-1 bg-slate-950 p-2 rounded-xl text-white outline-none border border-slate-800" /><button onClick={()=>{const v=document.getElementById('npw').value;if(v.trim()){localStorage.setItem('s_acc_pw',v.trim());setPw(v.trim());shT('تم الحفظ');document.getElementById('npw').value='';}}} className="bg-yellow-500 text-slate-950 px-4 rounded-xl font-bold">حفظ</button></div></div>
      <button onClick={()=>{if(window.confirm('تنبيه: هل أنت متأكد من مسح وتصفير الأصول وتطهير إيراداتها من سجل المحاسب الذكي نهائياً؟')){setAst([]);setTxs([]);shT('تم التصفير والتطهير 🧹');}}} className="w-full bg-red-500/10 text-red-400 py-3 rounded-xl border border-red-500/20 font-bold shadow">تصفير وتطهير الأصول والمحاسب الذكي 🗑️</button>
      <button onClick={()=>{localStorage.removeItem('s_acc_sess');setAuth(false);setVw('login');}} className="w-full bg-slate-800 text-slate-400 py-3 rounded-xl font-bold shadow">تسجيل الخروج 🚪</button>
     </div>
    )}
   </main>
   <nav className="fixed bottom-0 w-full bg-slate-900 border-t border-slate-800 py-2.5 z-20 flex justify-around shadow-2xl">
    <button onClick={()=>setTab('assets')} className={`flex flex-col items-center gap-1 text-[10px] font-bold ${tab==='assets'?'text-yellow-400':'text-slate-500'}`}><I.B/>الأصول</button>
    <button onClick={()=>setTab('projection')} className={`flex flex-col items-center gap-1 text-[10px] font-bold ${tab==='projection'?'text-blue-400':'text-slate-500'}`}><I.C/>الاستشراف</button>
    <button onClick={()=>setTab('feasibility')} className={`flex flex-col items-center gap-1 text-[10px] font-bold ${tab==='feasibility'?'text-emerald-400':'text-slate-500'}`}><I.A/>الجدوى</button>
    <button onClick={()=>setTab('profile')} className={`flex flex-col items-center gap-1 text-[10px] font-bold ${tab==='profile'?'text-yellow-500':'text-slate-500'}`}><I.S/>الضبط</button>
   </nav>
   {mo&&<Mod g24={g24} ed={ed} cls={()=>{setMo(false);setEd(null);}} sav={savA} />}
   {rec&&<ReceiptModal data={rec} onClose={()=>setRec(null)} showToast={shT} />}
  </div>
 );
}

function ReceiptModal({ data, onClose, showToast }) {
 if (!data) return null; const safeAmt = data.amount ? parseFloat(data.amount) : 0;
 const rTxt = `🧾 *${data.title}*\n▪️ المرجع: ${data.ref}\n▪️ التاريخ: ${data.date}\n▪️ البيان: ${data.person}\n💰 الأرباح المسجلة: ${safeAmt.toLocaleString()} ج.س`;
 return (
  <div className="fixed inset-0 bg-black/85 z-50 flex items-center justify-center p-5 pop">
   <div className="bg-white text-slate-950 w-full max-w-sm rounded-3xl p-5 font-mono shadow-2xl space-y-4">
    <h2 className="font-bold text-center text-base border-b border-dashed border-slate-300 pb-2">{data.title}</h2>
    <div className="text-xs space-y-1.5 font-medium"><div className="flex justify-between"><span>المرجع:</span><span>{data.ref}</span></div><div className="flex justify-between"><span>التاريخ:</span><span>{data.date}</span></div><div className="flex justify-between"><span>البيان:</span><span className="truncate max-w-[60%]">{data.person}</span></div></div>
    <div className="border-t border-dashed border-slate-300 pt-3 text-center"><h3 className="text-xl font-black">{safeAmt.toLocaleString()} ج.س</h3></div>
    <div className="space-y-2 pt-2"><button onClick={()=>{vib();window.location.href=`whatsapp://send?text=${encodeURIComponent(rTxt)}`;}} className="w-full bg-emerald-600 text-white py-2.5 rounded-xl font-bold text-xs shadow-md">📱 إرسال للواتساب</button><button onClick={()=>{vib();navigator.clipboard.writeText(rTxt);showToast('تم النسخ!');}} className="w-full bg-slate-100 text-slate-800 py-2.5 rounded-xl font-bold text-xs">📋 نسخ السند نصياً</button><button onClick={onClose} className="w-full bg-slate-950 text-white py-2.5 rounded-xl font-bold text-xs">إغلاق ❌</button></div>
   </div>
  </div>
 );
}
const root=ReactDOM.createRoot(document.getElementById('root'));root.render(<App/>);
</script></body></html>
