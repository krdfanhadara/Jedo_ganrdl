<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>المحاسب الذكي</title>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    @keyframes slideDown { 0% { transform: translateY(-100%); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
    .animate-slide-down { animation: slideDown 0.3s ease-out forwards; }
    @keyframes popIn { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .animate-pop { animation: popIn 0.2s ease-out forwards; }
    @media print {
      body * { visibility: hidden; }
      #printable-receipt, #printable-receipt * { visibility: visible; }
      #printable-receipt { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const INITIAL_STATE = { transactions: [], debts: [], partnerships: [], trusts: [] };

    const Icons = {
      Wallet: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>,
      Home: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
      Chart: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>,
      CreditCard: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>,
      Shield: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
      Settings: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 5.4 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1-2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
      Receipt: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/></svg>,
      Trash: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/></svg>,
      Edit: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>,
      Check: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="20 6 9 17 4 12"/></svg>,
      Share: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4Z"/></svg>,
      Cloud: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>,
      Download: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" x2="3"/></svg>,
      PieChart: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>,
      FileExcel: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></svg>,
      ArrowLeftRight: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>
    };

    const triggerHaptic = () => { if(navigator.vibrate) navigator.vibrate(30); };

    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(() => localStorage.getItem('smart_acc_session') === 'active');
      const [authView, setAuthView] = useState('login'); 
      const [savedEmail, setSavedEmail] = useState(() => localStorage.getItem('smart_acc_email') || '');
      const [savedPwd, setSavedPwd] = useState(() => localStorage.getItem('smart_acc_pwd') || '1234');
      const [savedSecAnswer, setSavedSecAnswer] = useState(() => localStorage.getItem('smart_acc_sec') || '');
      const [toast, setToast] = useState(null);
      const [lastBackup, setLastBackup] = useState(() => Number(localStorage.getItem('smart_acc_last_backup')) || 0);

      const showSuccessToast = (message) => {
        setToast(message);
        setTimeout(() => setToast(null), 3000);
      };

      useEffect(() => { 
        if (!localStorage.getItem('smart_acc_email')) {
          setAuthView('register');
        } 
      }, []);

      const [activeTab, setActiveTab] = useState('dashboard');
      const [isQuickAddOpen, setIsQuickAddOpen] = useState(false);
      const [quickAddType, setQuickAddType] = useState('transaction');
      const [editData, setEditData] = useState(null);
      
      const [paymentModal, setPaymentModal] = useState(null);
      const [trustPaymentModal, setTrustPaymentModal] = useState(null);
      const [receiptData, setReceiptData] = useState(null);

      const [transactions, setTransactions] = useState(() => JSON.parse(localStorage.getItem('smart_accountant_tx')) || INITIAL_STATE.transactions);
      const [debts, setDebts] = useState(() => JSON.parse(localStorage.getItem('smart_accountant_dbts')) || INITIAL_STATE.debts);
      const [partnerships, setPartnerships] = useState(() => JSON.parse(localStorage.getItem('smart_accountant_ptnrs')) || INITIAL_STATE.partnerships);
      const [trusts, setTrusts] = useState(() => JSON.parse(localStorage.getItem('smart_accountant_trusts')) || INITIAL_STATE.trusts);

      useEffect(() => { localStorage.setItem('smart_accountant_tx', JSON.stringify(transactions)); }, [transactions]);
      useEffect(() => { localStorage.setItem('smart_accountant_dbts', JSON.stringify(debts)); }, [debts]);
      useEffect(() => { localStorage.setItem('smart_accountant_ptnrs', JSON.stringify(partnerships)); }, [partnerships]);
      useEffect(() => { localStorage.setItem('smart_accountant_trusts', JSON.stringify(trusts)); }, [trusts]);

      const calculations = useMemo(() => {
        const sumIncomes = transactions.filter(t => t.type === 'income').reduce((acc, curr) => acc + curr.amount, 0);
        const sumExpenses = transactions.filter(t => t.type === 'expense').reduce((acc, curr) => acc + curr.amount, 0);
        
        const activeExternal = trusts.filter(t => t.type === 'external').reduce((acc, t) => acc + (t.amount - (t.paid || 0)), 0);
        const activeWithMe = trusts.filter(t => t.type === 'with_me').reduce((acc, t) => acc + (t.amount - (t.paid || 0)), 0);
        
        const pendingToMe = debts.filter(d => d.type === 'to_me').reduce((acc, d) => acc + (d.amount - (d.paid || 0)), 0);
        const pendingOnMe = debts.filter(d => d.type === 'on_me').reduce((acc, d) => acc + (d.amount - (d.paid || 0)), 0);

        const myPartnershipCapital = partnerships.reduce((total, p) => {
          if (p.allocationMode === 'capital') {
            const me = p.partners.find(pt => pt.name === 'أنت');
            return total + (me ? parseFloat(me.amount || 0) : 0);
          } else {
            return total;
          }
        }, 0);

        let calcBankBalance = 0;
        transactions.forEach(t => {
          if (t.wallet === 'bank') {
            if (t.type === 'income' || t.type === 'trust_bank_in') calcBankBalance += t.amount;
            if (t.type === 'expense' || t.type === 'trust_bank_out') calcBankBalance -= t.amount;
          }
          if (t.type === 'transfer') {
            if (t.direction === 'cash_to_bank') calcBankBalance += t.amount;
            if (t.direction === 'bank_to_cash') calcBankBalance -= t.amount;
          }
        });

        // [تحديث برمجي للأتمتة]: خصم حصة الشراكة تلقائياً من البنك إذا اختار المستخدم البنك كمصدر
        partnerships.forEach(p => {
          if (p.allocationMode === 'capital' && p.wallet === 'bank') {
            const me = p.partners.find(pt => pt.name === 'أنت');
            if (me) calcBankBalance -= parseFloat(me.amount || 0);
          }
        });

        const baseCash = sumIncomes - sumExpenses;
        const actualOwnCash = baseCash - activeExternal - myPartnershipCapital;
        const totalAvailableCash = actualOwnCash + activeWithMe; 
        const calcCashBalance = totalAvailableCash - calcBankBalance;
        const netWealth = actualOwnCash + activeExternal + pendingToMe + myPartnershipCapital - pendingOnMe;

        const expenseCategories = {};
        transactions.filter(t => t.type === 'expense').forEach(t => {
          expenseCategories[t.category] = (expenseCategories[t.category] || 0) + t.amount;
        });
        const expenseChartData = Object.keys(expenseCategories).map(cat => ({
          category: cat, amount: expenseCategories[cat],
          pct: sumExpenses > 0 ? ((expenseCategories[cat] / sumExpenses) * 100).toFixed(1) : 0
        })).sort((a,b) => b.amount - a.amount);

        return {
          totalAvailableCash, actualOwnCash, activeWithMe, netWealth, myPartnershipCapital,
          pendingToMe, pendingOnMe, activeExternal, baseCash,
          bankBalance: calcBankBalance, cashBalance: calcCashBalance,
          totalIn: sumIncomes, totalOut: sumExpenses, expenseChartData
        };
      }, [transactions, debts, trusts, partnerships]);

      const handleDelete = (type, id) => {
        triggerHaptic();
        if(window.confirm('هل تود الحذف بالتأكيد؟')) {
          if(type === 'tx') setTransactions(transactions.filter(t => t.id !== id));
          if(type === 'debt') setDebts(debts.filter(d => d.id !== id));
          if(type === 'ptnr') setPartnerships(partnerships.filter(p => p.id !== id));
          if(type === 'trust') setTrusts(trusts.filter(t => t.id !== id));
          showSuccessToast('تم الحذف بنجاح');
        }
      };

      const handleResetData = () => {
        triggerHaptic();
        if(window.confirm('سيتم تصفير كل السجلات المالية تماماً، مع الاحتفاظ ببيانات تسجيل الدخول الخاصة بك. هل أنت متأكد؟')) {
          setTransactions([]); setDebts([]); setPartnerships([]); setTrusts([]);
          localStorage.removeItem('smart_accountant_tx');
          localStorage.removeItem('smart_accountant_dbts');
          localStorage.removeItem('smart_accountant_ptnrs');
          localStorage.removeItem('smart_accountant_trusts');
          showSuccessToast('تم تصفير الحسابات بنجاح، بيانات دخولك محفوظة.');
        }
      };

      const handleSaveItem = (type, data, id = null) => {
        triggerHaptic();
        const docId = id || Date.now();
        if (type === 'transaction') {
          if(id) setTransactions(transactions.map(t => t.id === id ? { ...t, ...data } : t));
          else setTransactions([{ id: docId, ...data }, ...transactions]);
          showSuccessToast('تم حفظ العملية وتحديث السيولة');
        } 
        else if (type === 'debt') {
          if(id) setDebts(debts.map(d => d.id === id ? { ...d, ...data } : d));
          else setDebts([{ id: docId, paid: 0, ...data }, ...debts]);
          showSuccessToast('تم تقييد الدين في الثروة للمتابعة');
        } 
        else if (type === 'trust') {
          if(id) setTrusts(trusts.map(t => t.id === id ? { ...t, ...data } : t));
          else setTrusts([{ id: docId, paid: 0, ...data }, ...trusts]);
          showSuccessToast('تم تقييد الأمانة بنجاح');
        }
        else if (type === 'new_partnership') {
          if(id) setPartnerships(partnerships.map(p => p.id === id ? { ...p, ...data } : p));
          else setPartnerships([{ id: docId, evaluations: [], ...data }, ...partnerships]);
          showSuccessToast('تم حفظ الشراكة ومزامنة الخزنة تلقائياً');
        } 
        else if (type === 'evaluation') {
          let myProfit = 0; let projName = '';
          setPartnerships(partnerships.map(p => {
            if (p.id === Number(data.projectId)) {
              projName = p.name;
              const currentTotalCash = parseFloat(data.totalCash || 0);
              const fixedCapital = parseFloat(p.capital || 0);
              const totalProfitFringe = currentTotalCash - fixedCapital;
              
              if (totalProfitFringe > 0) {
                const totalCapPool = p.allocationMode === 'capital' ? p.partners.reduce((sum, part) => sum + parseFloat(part.amount || 0), 0) || 1 : fixedCapital;
                let computedShareRatio = 0;
                const meObj = p.partners.find(pt => pt.name === 'أنت');
                if (meObj) {
                  if (p.allocationMode === 'capital') computedShareRatio = parseFloat(meObj.amount || 0) / totalCapPool;
                  else computedShareRatio = parseFloat(meObj.share || 0) / 100;
                }
                myProfit = totalProfitFringe * computedShareRatio;
              }
              return { ...p, evaluations: [...(p.evaluations || []), { id: Date.now(), ...data }] };
            }
            return p;
          }));

          if (myProfit > 0) {
            setTransactions(prev => [{ id: Date.now() + 5, type: 'income', amount: parseFloat(myProfit.toFixed(2)), wallet: data.wallet, category: `أرباح جرد (${projName})`, date: data.date }, ...prev]);
            showSuccessToast(`تم الجرد بنجاح (+${myProfit.toLocaleString()}) في ${data.wallet === 'bank' ? 'البنك' : 'الكاش'}`);
          } else {
            showSuccessToast('تم تسجيل الجرد بنجاح');
          }
        }
        setIsQuickAddOpen(false); setEditData(null);
      };

      const handlePayDebt = (debtId, amount, wallet) => {
        triggerHaptic();
        let currentDebt = null;
        setDebts(debts.map(d => {
          if (d.id === debtId) { currentDebt = d; return { ...d, paid: (d.paid || 0) + amount }; }
          return d;
        }));
        setPaymentModal(null);

        if (currentDebt) {
          const isToMe = currentDebt.type === 'to_me';
          setTransactions(prev => [{
            id: Date.now(),
            type: isToMe ? 'income' : 'expense',
            amount: amount,
            wallet: wallet,
            category: isToMe ? `ديون مستردة من (${currentDebt.person})` : `سداد دين إلى (${currentDebt.person})`,
            date: new Date().toISOString().split('T')[0]
          }, ...prev]);

          showSuccessToast(`تم السداد وتحديث رصيد (${wallet === 'bank' ? 'البنك' : 'الكاش'})`);
          setReceiptData({
            title: isToMe ? 'سند قبض (استرداد دين)' : 'سند صرف (سداد دين)',
            person: currentDebt.person, amount: amount, date: new Date().toISOString().split('T')[0],
            ref: `REF-${Date.now().toString().slice(-5)}`
          });
        }
      };

      const handlePayTrust = (trustId, amount, wallet) => {
        triggerHaptic();
        let currentTrust = null;
        setTrusts(trusts.map(t => {
          if (t.id === trustId) { currentTrust = t; return { ...t, paid: (t.paid || 0) + amount }; }
          return t;
        }));
        setTrustPaymentModal(null);

        if (currentTrust) {
          if (wallet === 'bank') {
             const isExternal = currentTrust.type === 'external';
             setTransactions(prev => [{
                id: Date.now(),
                type: isExternal ? 'trust_bank_in' : 'trust_bank_out',
                amount: amount,
                wallet: 'bank',
                category: isExternal ? `استرداد رصيد من (${currentTrust.person})` : `تسليم أمانة إلى (${currentTrust.person})`,
                date: new Date().toISOString().split('T')[0]
             }, ...prev]);
          }
          showSuccessToast(`تمت حركة الأمانة وتعديل رصيد (${wallet === 'bank' ? 'البنك' : 'الكاش'})`);
          setReceiptData({
            title: currentTrust.type === 'external' ? 'سند استرداد رصيد خارجي' : 'سند تسليم أمانة',
            person: currentTrust.person, amount: amount, date: new Date().toISOString().split('T')[0],
            ref: `TRU-${Date.now().toString().slice(-5)}`
          });
        }
      };

      const handleBackupData = async () => {
        triggerHaptic();
        const fullData = { tx: transactions, db: debts, pt: partnerships, tr: trusts };
        const base64Data = btoa(unescape(encodeURIComponent(JSON.stringify(fullData))));
        const shareText = `[نسخة احتياطية - المحاسب الذكي]\nتاريخ الأرشفة: ${new Date().toLocaleDateString('ar-EG')}\n\n--- انسخ الكود بالأسفل فقط ---\n${base64Data}`;
        
        const now = Date.now();
        setLastBackup(now);
        localStorage.setItem('smart_acc_last_backup', now);

        try {
          if (navigator.share) {
            await navigator.share({ title: 'أرشيف المحاسب الذكي', text: shareText });
          } else {
            await navigator.clipboard.writeText(shareText);
            showSuccessToast('تم نسخ الكود بنجاح! اذهب لـ Google Keep والصقه.');
          }
        } catch (e) {
          console.log('Share prompt focus adjusted', e);
          showSuccessToast('تمت معالجة وحفظ أحدث نسخة احتياطية');
        }
      };

      const handleRestoreData = (backupStr) => {
        triggerHaptic();
        try {
          const extractBase64 = backupStr.match(/[A-Za-z0-9+/=]{50,}/)?.[0] || backupStr.trim();
          const jsonStr = decodeURIComponent(escape(atob(extractBase64)));
          const data = JSON.parse(jsonStr);
          
          if(data.tx && data.db) {
            setTransactions(data.tx); setDebts(data.db);
            setPartnerships(data.pt || []); setTrusts(data.tr || []);
            const now = Date.now();
            setLastBackup(now);
            localStorage.setItem('smart_acc_last_backup', now);
            showSuccessToast('🎉 تمت استعادة ثروتك وسجلاتك بنجاح!');
          } else {
            alert('الكود تالف أو غير مكتمل.');
          }
        } catch (e) {
          alert('تعذرت الاستعادة! تأكد أنك نسخت الكود الصحيح بالكامل.');
        }
      };

      const handleExportCSV = () => {
        triggerHaptic();
        if (transactions.length === 0) return alert('لا توجد حركات لتصديرها!');
        
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; 
        csvContent += "التاريخ,الخزنة,النوع,البيان والتصنيف,المبلغ\r\n";
        
        transactions.forEach(t => {
          let typeStr = t.type === 'income' ? 'إيداع وارد' : (t.type === 'expense' ? 'منصرف' : 'حركة داخلية');
          const walletStr = t.wallet === 'bank' ? 'بنكك/حساب' : 'كاش نقدي';
          const cleanCategory = t.category.replace(/,/g, ' - ');
          csvContent += `${t.date},${walletStr},${typeStr},${cleanCategory},${t.amount}\r\n`;
        });
        
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `كشف_حساب_المحاسب_الذكي_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showSuccessToast('تم تحميل كشف الحساب (Excel) بنجاح 📄');
      };

      const handleLogout = () => {
        triggerHaptic();
        localStorage.removeItem('smart_acc_session');
        setIsAuthenticated(false);
        setAuthView('login');
      };

      if (!isAuthenticated) {
        return <AuthScreen view={authView} setView={setAuthView} savedEmail={savedEmail} savedPwd={savedPwd} savedSecAnswer={savedSecAnswer} onRegister={(e,p,s) => { localStorage.setItem('smart_acc_email', e); localStorage.setItem('smart_acc_pwd', p); localStorage.setItem('smart_acc_sec', s); localStorage.setItem('smart_acc_session', 'active'); setSavedEmail(e); setSavedPwd(p); setSavedSecAnswer(s); setIsAuthenticated(true); }} onLogin={() => { localStorage.setItem('smart_acc_session', 'active'); setIsAuthenticated(true); }} onResetPwd={(np) => { localStorage.setItem('smart_acc_pwd', np); setSavedPwd(np); setAuthView('login'); }} />;
      }

      return (
        <div className="pb-28">
          {toast && (
            <div className="fixed top-6 left-4 right-4 z-[100] bg-emerald-500 text-white px-4 py-3 rounded-xl flex items-center gap-3 shadow-xl border border-emerald-400/20 animate-slide-down max-w-sm mx-auto">
              <Icons.Check /> <span className="text-sm font-bold">{toast}</span>
            </div>
          )}

          <header className="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-10 flex justify-between items-center shadow-md">
            <div className="flex items-center gap-3">
              <div className="bg-emerald-500 p-2.5 rounded-xl text-white"><Icons.Wallet /></div>
              <div><h1 className="text-base font-bold text-white">المحاسب الذكي</h1><p className="text-[11px] text-emerald-400">إدارة الخزن المزدوجة</p></div>
            </div>
            <button onClick={handleLogout} className="bg-slate-900/60 text-slate-300 text-sm hover:text-red-400 px-3 py-2 rounded-lg border border-slate-700 font-bold transition">🚪 قفل</button>
          </header>

          <main className="p-4 max-w-md mx-auto">
            {activeTab === 'dashboard' && <DashboardView calc={calculations} txs={transactions} lastBackup={lastBackup} onDelete={id => handleDelete('tx', id)} onEdit={t => {setQuickAddType('transaction'); setEditData(t); setIsQuickAddOpen(true);}} onReceipt={r => setReceiptData(r)} />}
            {activeTab === 'partnerships' && <PartnershipsView ptnrs={partnerships} onAdd={() => {setQuickAddType('new_partnership'); setEditData(null); setIsQuickAddOpen(true);}} onDelete={id => handleDelete('ptnr', id)} onEdit={p => {setQuickAddType('new_partnership'); setEditData(p); setIsQuickAddOpen(true);}} />}
            {activeTab === 'debts' && <DebtsView debts={debts} onDelete={id => handleDelete('debt', id)} onPay={d => {triggerHaptic(); setPaymentModal(d);}} onEdit={d => {setQuickAddType('debt'); setEditData(d); setIsQuickAddOpen(true);}} />}
            {activeTab === 'trusts' && <TrustsView trusts={trusts} onDelete={id => handleDelete('trust', id)} onPay={t => {triggerHaptic(); setTrustPaymentModal(t);}} onEdit={t => {setQuickAddType('trust'); setEditData(t); setIsQuickAddOpen(true);}} />}
            {activeTab === 'profile' && <ProfileView email={savedEmail} onReset={handleResetData} onChangePwd={pwd => { localStorage.setItem('smart_acc_pwd', pwd); setSavedPwd(pwd); showSuccessToast('تم التحديث بنجاح'); }} currentPwd={savedPwd} onBackup={handleBackupData} onRestore={handleRestoreData} lastBackup={lastBackup} onExportExcel={handleExportCSV} />}
          </main>

          <button onClick={() => {triggerHaptic(); setQuickAddType('transaction'); setEditData(null); setIsQuickAddOpen(true);}} className="fixed bottom-24 left-6 w-14 h-14 bg-emerald-500 text-white rounded-full shadow-lg flex items-center justify-center z-20 text-2xl hover:scale-105 transition-transform">➕</button>

          <nav className="fixed bottom-0 w-full bg-slate-800 border-t border-slate-700 py-3 z-10 px-2">
            <div className="flex justify-between items-center max-w-md mx-auto">
              <NavItem icon={<Icons.Home />} label="الرئيسية" active={activeTab==='dashboard'} onClick={() => setActiveTab('dashboard')} />
              <NavItem icon={<Icons.Chart />} label="الشراكات" active={activeTab==='partnerships'} onClick={() => setActiveTab('partnerships')} />
              <NavItem icon={<Icons.CreditCard />} label="الديون" active={activeTab==='debts'} onClick={() => setActiveTab('debts')} />
              <NavItem icon={<Icons.Shield />} label="الأمانات" active={activeTab==='trusts'} onClick={() => setActiveTab('trusts')} />
              <NavItem icon={<Icons.Settings />} label="الضبط" active={activeTab==='profile'} onClick={() => setActiveTab('profile')} />
            </div>
          </nav>

          {isQuickAddOpen && <QuickAddModal type={quickAddType} editData={editData} ptnrs={partnerships} onClose={() => {setIsQuickAddOpen(false); setEditData(null);}} onSave={handleSaveItem} />}
          {paymentModal && <PaymentModal item={paymentModal} onClose={() => setPaymentModal(null)} onSave={handlePayDebt} title="تسجيل حركة أموال (دخول/خروج)" subtitle="المتبقي في السجل:" />}
          {trustPaymentModal && <PaymentModal item={trustPaymentModal} onClose={() => setTrustPaymentModal(null)} onSave={handlePayTrust} title="تسجيل استرداد/تسليم أمانة" subtitle="المتبقي من الرصيد / الأمانة:" />}
          {receiptData && <ReceiptModal data={receiptData} onClose={() => setReceiptData(null)} showToast={showSuccessToast} />}
        </div>
      );
    }

    // --- شاشة الدخول ---
    function AuthScreen({ view, setView, savedEmail, savedPwd, savedSecAnswer, onRegister, onLogin, onResetPwd }) {
      const [email, setEmail] = useState(''); const [pwd, setPwd] = useState(''); const [sec, setSec] = useState('');
      useEffect(() => { if(savedEmail) setEmail(savedEmail); }, [savedEmail]);

      const submit = e => {
        e.preventDefault(); triggerHaptic();
        if(view === 'register') { 
          if(!email || pwd.length < 4 || !sec) return alert('الرجاء تعبئة كافة الحقول لحماية حسابك'); 
          onRegister(email.toLowerCase(), pwd, sec.trim()); 
        }
        else if (view === 'login') { 
          if(email.toLowerCase() === savedEmail.toLowerCase() && pwd === savedPwd) onLogin(); 
          else alert('خطأ في البريد الإلكتروني أو كلمة المرور!'); 
        }
        else if (view === 'forgot') {
          if (email.toLowerCase() === savedEmail.toLowerCase() && sec.trim() === savedSecAnswer.trim()) {
            const newPassword = prompt('تم التحقق بنجاح! اكتب كلمة المرور الجديدة الآن:');
            if (newPassword && newPassword.length >= 4) onResetPwd(newPassword);
            else alert('كلمة المرور يجب أن لا تقل عن 4 رموز');
          } else {
            alert('الإجابة على سؤال الأمان أو البريد غير متطابقة!');
          }
        }
      };

      return (
        <div className="min-h-[80vh] flex items-center justify-center p-4">
          <div className="bg-slate-800 p-8 rounded-2xl w-full max-w-sm border border-slate-700 animate-pop shadow-2xl">
            <h1 className="text-xl font-bold text-white mb-2 text-center">🔐 نظام المحاسب الذكي</h1>
            <p className="text-sm text-slate-400 text-center mb-6">
              {view === 'login' ? 'سجل الدخول لحماية ملفات العائلة المادية' : view === 'register' ? 'إنشاء ملف مالي محمي للمرة الأولى' : 'استعادة صلاحية الدخول عبر حقل الأمان'}
            </p>
            <form onSubmit={submit} className="space-y-4">
              <input type="email" required placeholder="البريد الإلكتروني" value={email} onChange={e=>setEmail(e.target.value)} className="w-full bg-slate-900 border border-slate-600 text-white p-3 rounded-xl text-left text-sm" />
              {view !== 'forgot' && <input type="password" required placeholder="كلمة المرور" value={pwd} onChange={e=>setPwd(e.target.value)} className="w-full bg-slate-900 border border-slate-600 text-white p-3 rounded-xl text-left text-sm" />}
              {(view === 'register' || view === 'forgot') && <input type="text" required placeholder="سؤال الأمان: ما هي مدينتك المفضلة؟" value={sec} onChange={e=>setSec(e.target.value)} className="w-full bg-slate-900 border border-slate-600 text-emerald-400 p-3 rounded-xl text-sm" />}
              <button type="submit" className="w-full bg-emerald-500 text-white font-bold py-3 rounded-xl text-sm shadow-md hover:bg-emerald-600 transition">
                {view === 'login' ? 'تأكيد ودخول الحساب' : view === 'register' ? 'إنشاء وتأمين الملف' : 'التحقق واستعادة الرمز'}
              </button>
            </form>
            <div className="mt-6 flex flex-col gap-3 text-center text-sm">
              {view === 'login' ? (
                <><button type="button" onClick={() => setView('forgot')} className="text-slate-400 hover:text-white transition">نسيت كلمة المرور؟ 🔍</button><button type="button" onClick={() => setView('register')} className="text-emerald-400 font-bold transition">إنشاء ملف مالي جديد ➕</button></>
              ) : (
                <button type="button" onClick={() => setView('login')} className="text-slate-400 hover:text-white transition">العودة لتسجيل الدخول 🔑</button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- الرئيسية ---
    function DashboardView({ calc, txs, lastBackup, onDelete, onEdit, onReceipt }) {
      const [search, setSearch] = useState('');
      const filteredTxs = txs.filter(t => t.category.includes(search) || t.amount.toString().includes(search));
      
      const needsBackup = (calc.totalIn > 0 || calc.totalOut > 0) && (lastBackup === 0 || (Date.now() - lastBackup > 3 * 24 * 60 * 60 * 1000));

      return (
        <div className="space-y-5 animate-pop">

          {needsBackup && (
            <div className="bg-red-500/10 border border-red-500/50 p-3 rounded-xl flex items-center justify-between animate-pop shadow-md">
               <div className="flex items-center gap-3">
                 <span className="text-2xl">⚠️</span>
                 <div>
                   <p className="text-red-400 font-bold text-sm">خطر فقدان البيانات!</p>
                   <p className="text-slate-300 text-xs mt-0.5">مرت فترة دون أخذ نسخة احتياطية لسجلاتك المالية.</p>
                 </div>
               </div>
               <span className="text-xs bg-red-500 text-white px-3 py-1.5 rounded-lg font-bold">الضبط</span>
            </div>
          )}
          
          <div className="bg-gradient-to-br from-slate-800 to-slate-900 rounded-xl p-5 border border-slate-700 shadow-sm text-center relative overflow-hidden">
            <p className="text-slate-300 text-sm font-bold mb-2">السيولة النقدية الكلية المتوفرة 🏦</p>
            <h2 className="text-4xl font-black text-white mb-5">{calc.totalAvailableCash.toLocaleString()} <span className="text-sm text-slate-400 font-normal">ج.س</span></h2>
            
            <div className="grid grid-cols-2 gap-3 mt-3">
                <div className="bg-blue-900/40 p-3 rounded-lg border border-blue-500/30 text-center">
                  <p className="text-xs text-blue-200 mb-1">رصيد البنك 📱</p>
                  <h3 className="text-lg font-black text-blue-400">{calc.bankBalance.toLocaleString()}</h3>
                </div>
                <div className="bg-emerald-900/40 p-3 rounded-lg border border-emerald-500/30 text-center">
                  <p className="text-xs text-emerald-200 mb-1">كاش باليد 💵</p>
                  <h3 className="text-lg font-black text-emerald-400">{calc.cashBalance.toLocaleString()}</h3>
                </div>
            </div>
          </div>

          <div className="bg-slate-800 p-5 rounded-xl border border-slate-700 text-center shadow-sm relative">
             <p className="text-slate-300 text-sm font-bold">صافي الثروة والأملاك (وزنك المالي) 💎</p>
             <h3 className="text-3xl font-black text-blue-400 mt-2">{calc.netWealth.toLocaleString()} <span className="text-xs text-slate-500 font-normal">ج.س</span></h3>
             
             <p className="text-xs text-slate-400 mt-4 mb-2 text-right px-1">القائمة المالية لصافي الثروة:</p>
             <div className="flex flex-col gap-1.5 text-xs bg-slate-900/50 p-3 rounded-xl border border-slate-700/50 text-right leading-relaxed">
                <div className="flex justify-between text-emerald-400"><span>مالك الفعلي الحر:</span> <span>{calc.actualOwnCash.toLocaleString()} +</span></div>
                <div className="flex justify-between text-blue-400"><span>أرصدتك وأماناتك بالخارج:</span> <span>{calc.activeExternal.toLocaleString()} +</span></div>
                {calc.myPartnershipCapital > 0 && <div className="flex justify-between text-blue-400"><span>رأس مالك في الشراكات:</span> <span>{calc.myPartnershipCapital.toLocaleString()} +</span></div>}
                <div className="flex justify-between text-emerald-400"><span>ديون لك عند الغير:</span> <span>{calc.pendingToMe.toLocaleString()} +</span></div>
                <div className="flex justify-between text-red-400"><span>ديون التزام عليك:</span> <span>{calc.pendingOnMe.toLocaleString()} -</span></div>
             </div>
          </div>

          {calc.totalOut > 0 && (
            <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
               <h3 className="text-sm font-bold text-white mb-4 flex items-center gap-1.5">
                 <Icons.PieChart /> التحليل البصري للمنصرفات
               </h3>
               <div className="space-y-3">
                 {calc.expenseChartData.map((item, idx) => (
                   <div key={idx} className="space-y-1.5">
                     <div className="flex justify-between text-xs">
                       <span className="text-slate-300">{item.category}</span>
                       <span className="text-slate-400 font-bold">{item.amount.toLocaleString()} ج.س ({item.pct}%)</span>
                     </div>
                     <div className="w-full bg-slate-900 rounded-full h-2 overflow-hidden">
                       <div className="bg-emerald-500 h-2 rounded-full" style={{width: `${item.pct}%`}}></div>
                     </div>
                   </div>
                 ))}
               </div>
            </div>
          )}

          <div className="bg-slate-800 rounded-xl p-4 border border-slate-700 mt-5">
            <div className="flex justify-between items-center mb-4">
              <h3 className="font-bold text-sm text-white">سجل حركات الخزن</h3>
              <input type="text" placeholder="بحث سريع..." value={search} onChange={e=>setSearch(e.target.value)} className="w-5/12 bg-slate-900 border border-slate-700 text-white rounded-lg py-1.5 px-3 text-xs focus:border-emerald-500 focus:outline-none" />
            </div>
            
            <div className="divide-y divide-slate-700/60 max-h-72 overflow-y-auto pr-1">
              {filteredTxs.map(t => {
                const isBank = t.wallet === 'bank';
                const isIncome = t.type === 'income' || t.type === 'trust_bank_in';
                const isTransfer = t.type === 'transfer';
                return (
                  <div key={t.id} className="py-3 flex justify-between items-center text-sm">
                    <div className="min-w-0 flex-1 pl-3">
                      <p className="text-white font-bold truncate flex items-center gap-1.5">
                        {isTransfer ? <Icons.ArrowLeftRight /> : (isBank ? '📱' : '💵')} {t.category}
                      </p>
                      <p className="text-xs text-slate-500 mt-0.5">{t.date}</p>
                    </div>
                    <div className="flex items-center gap-3 shrink-0">
                      <span className={`font-bold text-sm ${isTransfer ? 'text-blue-400' : (isIncome ? 'text-emerald-400' : 'text-red-400')}`}>
                        {!isTransfer && (isIncome ? '+' : '-')} {t.amount.toLocaleString()}

                      <button onClick={()=>onDelete(t.id)} className="p-1.5 bg-slate-700 hover:bg-slate-600 text-red-400 rounded-lg transition"><Icons.Trash/></button>
                    </div>
                  </div>
                );
              })}
              {filteredTxs.length === 0 && <p className="text-center py-6 text-xs text-slate-500">لا توجد حركات مطابقة.</p>}

    // --- الشراكات ---
    function PartnershipsView({ ptnrs, onAdd, onDelete, onEdit }) {
      const sendPartnerWhatsApp = (pName, pShareAmount, projName, date) => {
        triggerHaptic();
        const text = `📊 *إشعار جرد وتوزيع أرباح*\n` +
                     `-----------------------\n` +
                     `👤 *الشريك المحترم:* ${pName}\n` +
                     `💼 *المشروع:* ${projName}\n` +
                     `📅 *تاريخ الجرد:* ${date}\n` +
                     `-----------------------\n` +
                     `💰 *صافي مستحقاتك من الأرباح:* ${pShareAmount.toLocaleString()} ج.س`;
        window.location.href = `whatsapp://send?text=${encodeURIComponent(text)}`;
      };

      return (
        <div className="space-y-5 animate-pop">
          <div className="flex justify-between items-center px-1">
            <h2 className="text-sm font-bold text-white">إدارة جرد الشراكات الكبرى</h2>
            <button onClick={onAdd} className="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">➕ مشروع جديد</button>
          </div>
          {ptnrs.map(proj => {
            const evals = proj.evaluations || []; const lastEval = evals[evals.length - 1];
            const totalCash = lastEval ? parseFloat(lastEval.totalCash || 0) : 0;
            const fixedCapital = parseFloat(proj.capital || 0);
            const profit = totalCash > fixedCapital ? totalCash - fixedCapital : 0;
            const totalProjectCapital = proj.allocationMode === 'capital' ? proj.partners.reduce((sum, p) => sum + parseFloat(p.amount || 0), 0) || 1 : fixedCapital;

            return (
              <div key={proj.id} className="bg-slate-800 rounded-xl p-4 border border-slate-700 text-sm relative shadow-sm">
                <div className="absolute top-4 left-4 flex gap-1.5">
                  <button onClick={()=>onEdit(proj)} className="p-1.5 bg-slate-700 hover:bg-slate-600 text-emerald-400 rounded-lg transition"><Icons.Edit/></button>
                  <button onClick={()=>onDelete(proj.id)} className="p-1.5 bg-slate-700 hover:bg-slate-600 text-red-400 rounded-lg transition"><Icons.Trash/></button>
                </div>
                <h3 className="font-bold text-white text-base mb-1 truncate max-w-[70%]">{proj.name}</h3>
                {/* تم تعديل العرض البرمجي ليوضح مصدر تمويل الحصة الفردية الذكي */}
                <p className="text-xs text-slate-400 mb-3">رأس المال: {fixedCapital.toLocaleString()} ج.س {proj.allocationMode === 'capital' && `(تمويل حصتك: ${proj.wallet === 'bank' ? '📱 البنك' : '💵 الكاش'})`}</p>
                <div className="bg-slate-900/50 p-3 rounded-xl border border-slate-700/50 space-y-2">
                  <p className="text-xs text-slate-400 font-bold border-b border-slate-700 pb-1.5">📋 بيان توزيع أرباح الشركاء:</p>
                  {lastEval && profit > 0 ? proj.partners.map((p, i) => {
                    let computedShare = proj.allocationMode === 'capital' ? (parseFloat(p.amount || 0) / totalProjectCapital) * 100 : parseFloat(p.share || 0);
                    const pShareAmount = profit * (computedShare / 100);
                    return (
                      <div key={i} className="flex justify-between items-center text-xs text-slate-300 py-1 bg-slate-800/60 px-2.5 rounded-lg">
                        <span className="truncate max-w-[45%] font-medium">{p.name} <span className="text-[11px] text-slate-400">({computedShare.toFixed(1)}%)</span></span>
                        <div className="flex items-center gap-2">
                          <span className="text-emerald-400 font-bold">+{pShareAmount.toLocaleString()} ج.س</span>
                          {p.name !== 'أنت' && (
                            <button onClick={() => sendPartnerWhatsApp(p.name, pShareAmount, proj.name, lastEval.date)} className="p-1.5 bg-emerald-600/30 text-emerald-400 rounded-lg hover:bg-emerald-600/50 flex items-center gap-1 text-[10px] transition"><Icons.Share /> إشعار</button>
                          )}
                        </div>
                      </div>
                    );
                  }) : <p className="text-center text-xs text-slate-500 py-2">الرجاء ضغط ➕ لجرد الشراكة.</p>}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    // --- الديون ---
    function DebtsView({ debts, onDelete, onPay, onEdit }) {
      const renderList = (type, mode) => debts.filter(d => d.type === type).map(d => {
        const rem = d.amount - (d.paid || 0); const isPaid = rem <= 0;
        const pct = ((d.paid || 0) / d.amount) * 100;
        let barColor = pct >= 50 ? "bg-emerald-500" : "bg-red-500";
        if (mode === 'on_me') barColor = pct >= 50 ? "bg-red-500" : "bg-emerald-500";

        return (
          <div key={d.id} className={`bg-slate-800 p-4 rounded-xl border border-slate-700/70 space-y-3 shadow-sm ${isPaid?'opacity-50':''}`}>
            <div className="flex justify-between items-center text-sm">
              <div className="min-w-0 flex-1">
                <h4 className="font-bold text-white text-base truncate">{d.person}</h4>
                <p className="text-xs text-slate-400 mt-1">المبلغ الكلي: {d.amount.toLocaleString()}</p>
              </div>
              <div className="flex gap-2 items-center shrink-0">
                {!isPaid ? <button onClick={()=>onPay(d)} className="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-lg font-bold text-xs transition">سداد 💸</button> : <span className="text-emerald-400 text-xs font-bold bg-emerald-500/10 px-2 py-1 rounded-lg">✓ مصفى</span>}
                <button onClick={()=>onDelete(d.id)} className="text-red-400 p-1.5 hover:bg-slate-700 rounded-lg transition"><Icons.Trash/></button>
              </div>
            </div>
            {!isPaid && (
              <div className="space-y-1.5">
                <div className="h-2 w-full bg-slate-900 rounded-full overflow-hidden"><div style={{width: `${pct}%`}} className={`h-full rounded-full transition-all duration-300 ${barColor}`}></div></div>
                <div className="flex justify-between text-[11px] text-slate-400 font-medium"><span>مُسدد: {(d.paid || 0).toLocaleString()}</span><span>متبقي: {rem.toLocaleString()}</span></div>
              </div>
            )}
          </div>
        );
      });

      return (
        <div className="space-y-5 animate-pop">
          <div className="bg-slate-800/80 p-3 rounded-xl border border-slate-700 mb-4 flex gap-3 items-center shadow-sm">
             <span className="text-2xl">📌</span>
             <p className="text-xs text-slate-400 leading-relaxed">الديون مسجلة هنا للمتابعة فقط ولن تؤثر على (السيولة البنكية/الكاش) إلا عند الضغط على زر سداد.</p>
          </div>
          <h3 className="text-sm font-bold text-emerald-400 px-1">سجل ديون لك 📈</h3>
          <div className="space-y-3">{renderList('to_me', 'to_me')}</div>
          <h3 className="text-sm font-bold text-red-400 border-t border-slate-700/60 pt-4 px-1 mt-2">سجل ديون عليك 📉</h3>
          <div className="space-y-3">{renderList('on_me', 'on_me')}</div>
        </div>
      );
    }

    // --- الأمانات ---
    function TrustsView({ trusts, onDelete, onPay, onEdit }) {
      const renderList = (type, titleColor) => trusts.filter(t => t.type === type).map(t => {
        const rem = t.amount - (t.paid || 0);
        const isResolved = rem <= 0;
        const pct = ((t.paid || 0) / t.amount) * 100;
        const barColor = type === 'external' ? 'bg-blue-500' : 'bg-orange-500';

        return (
          <div key={t.id} className={`bg-slate-800 p-4 rounded-xl border border-slate-700/70 relative shadow-sm ${isResolved ? 'opacity-50' : ''}`}>
             <div className="absolute top-3 left-3 flex gap-1.5">
                <button onClick={()=>onEdit(t)} className="p-1.5 text-emerald-400 hover:bg-slate-700 rounded-lg transition"><Icons.Edit/></button>
                <button onClick={()=>onDelete(t.id)} className="p-1.5 text-red-400 hover:bg-slate-700 rounded-lg transition"><Icons.Trash/></button>
             </div>
             <h4 className="font-bold text-white text-base truncate max-w-[70%] mb-1">{t.person}</h4>
             <div className="mt-3 space-y-1.5 text-xs">
               <div className="flex justify-between"><span className="text-slate-400">المبلغ الأساسي:</span><span className={`font-bold text-${titleColor}-400 text-sm`}>{t.amount.toLocaleString()} ج.س</span></div>
               <div className="flex justify-between"><span className="text-slate-400">رقم الإشعار البنكي:</span><span className="text-slate-300 font-mono bg-slate-900 px-1.5 rounded">{t.bankRef || 'بدون إشعار'}</span></div>
             </div>
             
             {!isResolved ? (
               <div className="mt-4 space-y-3">
                  <div className="space-y-1.5">
                    <div className="h-2 w-full bg-slate-900 rounded-full overflow-hidden">
                      <div style={{width: `${pct}%`}} className={`h-full rounded-full transition-all duration-300 ${barColor}`}></div>
                    </div>
                    <div className="flex justify-between text-[11px] text-slate-400 font-medium">
                      <span>حركة مُسجلة: {(t.paid || 0).toLocaleString()}</span>
                      <span>الرصيد المتبقي: {rem.toLocaleString()}</span>
                    </div>
                  </div>
                  <button onClick={()=>onPay(t)} className="w-full bg-slate-700 hover:bg-slate-600 text-white py-2 rounded-xl text-xs font-bold transition shadow-sm">تسجيل حركة (استرداد/تسليم) 💸</button>
               </div>
             ) : (
               <div className="w-full mt-4 bg-emerald-500/10 text-emerald-400 py-2 rounded-xl text-xs font-bold text-center border border-emerald-500/20">✅ تم تصفية الرصيد بالكامل</div>
             )}
          </div>
        );
      });

      return (
        <div className="space-y-5 animate-pop">
          <div className="bg-blue-900/20 p-4 rounded-xl border border-blue-500/20 mb-5 shadow-sm">
             <p className="text-xs text-blue-300 text-center leading-relaxed">
               تسجيل أي حركة استرداد أو تسليم هنا سيقوم بتعديل <b>السيولة النقدية المتوفرة</b> بالبنك أو الكاش تلقائياً دون التأثير على إجمالي ثروتك!
             </p>
          </div>
          <h3 className="text-sm font-bold text-blue-400 px-1">أرصدة لي بطرف الغير (محولة للخارج) 📤</h3>
          <div className="space-y-3">{renderList('external', 'blue')}</div>
          
          <h3 className="text-sm font-bold text-orange-400 border-t border-slate-700/60 pt-4 mt-2 px-1">أمانات للغير بطرفي (ودائع دخلت لي) 📥</h3>
          <div className="space-y-3">{renderList('with_me', 'orange')}</div>
        </div>
      );
    }

    // --- الضبط وإدارة السحابة والتصدير ---

      const [pwd, setPwd] = useState('');
      const [restoreCode, setRestoreCode] = useState('');

      const formatLastBackup = () => {
        if (!lastBackup) return 'لم يتم أخذ نسخة قط ⚠️';
        return new Date(lastBackup).toLocaleString('ar-EG', { dateStyle: 'short', timeStyle: 'short' });
      };

      return (
        <div className="space-y-5 animate-pop text-sm pb-6">
          <div className="bg-slate-800 p-4 rounded-xl text-center border border-slate-700 shadow-sm">
            <p className="text-xs text-slate-400 mb-1">الملف الشخصي الفعال</p>
            <p className="text-white font-bold text-base">{email}</p>
          </div>

          <div className="bg-slate-800 p-4 rounded-xl border border-blue-500/30 relative overflow-hidden shadow-sm">
             <div className="absolute top-0 right-0 w-1.5 bg-blue-500 h-full"></div>
             <h3 className="font-bold text-blue-400 mb-1.5 flex items-center gap-2 text-base"><Icons.FileExcel /> التقارير وكشوفات الحساب</h3>
             <p className="text-xs text-slate-400 mb-4 leading-relaxed">تحميل جميع سجلاتك وحركاتك كملف إكسل رسمي.</p>
             
             <button onClick={onExportExcel} className="w-full bg-slate-700 hover:bg-slate-600 text-blue-400 py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition border border-blue-500/20 shadow-sm">
                <Icons.Download /> تصدير كشف حساب (Excel / CSV)
             </button>
          </div>

          <div className="bg-slate-800 p-4 rounded-xl border border-emerald-500/30 relative overflow-hidden shadow-sm">
             <div className="absolute top-0 right-0 w-1.5 bg-emerald-500 h-full"></div>
             <h3 className="font-bold text-emerald-400 mb-1.5 flex items-center gap-2 text-base"><Icons.Shield /> الأمان والسحابة</h3>
             <p className="text-xs text-slate-400 mb-4 leading-relaxed">حماية بياناتك وأموالك من ضياع أو تعطل الهاتف.</p>
             
             <div className="bg-slate-900/50 p-3 rounded-xl border border-slate-700/50 mb-4">
               <p className="text-xs text-slate-300 flex justify-between items-center">
                 <span>آخر نسخة محفوظة:</span>
                 <span className={!lastBackup || (Date.now() - lastBackup > 259200000) ? 'text-red-400 font-bold bg-red-500/10 px-2 py-1 rounded' : 'text-emerald-400 font-bold bg-emerald-500/10 px-2 py-1 rounded'}>{formatLastBackup()}</span>
               </p>
             </div>

             <button onClick={onBackup} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl font-bold shadow-md mb-5 flex items-center justify-center gap-2 transition">
                <Icons.Cloud /> أخذ نسخة للسحابة (Google Keep)
             </button>

             <div className="border-t border-slate-700/60 pt-4">
               <p className="text-xs font-bold text-slate-300 mb-3">استعادة حساباتك (من هاتف آخر):</p>
               <textarea value={restoreCode} onChange={e=>setRestoreCode(e.target.value)} placeholder="ألصق كود النسخة الاحتياطية هنا..." className="w-full bg-slate-900 text-emerald-400 p-3 rounded-xl border border-slate-600 text-xs h-20 font-mono mb-3 focus:outline-none focus:border-emerald-500 transition" />
               <button onClick={()=>{if(restoreCode.trim() && window.confirm('هل أنت متأكد من استبدال حساباتك الحالية بالنسخة المرفوعة؟')) { onRestore(restoreCode); setRestoreCode(''); } }} className="w-full bg-slate-700 hover:bg-slate-600 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition shadow-sm">
                 <Icons.Download /> تأكيد الاستعادة
               </button>
             </div>
          </div>

          <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3 mt-5 shadow-sm">
            <p className="text-xs text-slate-400">تعديل رمز الأمان الحالي: <span className="text-white bg-slate-900 px-2.5 py-1 rounded-lg font-bold mx-1">{currentPwd}</span></p>
            <div className="flex gap-2.5">
              <input type="text" value={pwd} onChange={e=>setPwd(e.target.value)} placeholder="رمز جديد..." className="flex-1 bg-slate-900 p-3 rounded-xl text-white border border-slate-700 text-sm focus:outline-none focus:border-emerald-500" />
              <button onClick={()=>{if(pwd.trim()){onChangePwd(pwd.trim()); setPwd('');}}} className="bg-emerald-500 hover:bg-emerald-600 text-white px-5 rounded-xl font-bold transition shadow-sm">حفظ</button>
            </div>
          </div>
          <button onClick={onReset} className="w-full bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 py-3 rounded-xl font-bold mt-3 transition">تصفير السجلات المالية بالكامل</button>
        </div>
      );
    }

    // --- مودال الإيصال ---
    function ReceiptModal({ data, onClose, showToast }) {
      const receiptText = `🧾 *سند محاسبي معتمد*\n` +
                          `-----------------------\n` +
                          `▪️ *رقم السند:* ${data.ref}\n` +
                          `▪️ *التاريخ:* ${data.date}\n` +
                          `▪️ *النوع:* ${data.title}\n` +
                          `▪️ *الجهة والبيان:* ${data.person}\n` +
                          `-----------------------\n` +
                          `💰 *المبلغ الإجمالي:* ${data.amount.toLocaleString()} ج.س`;

      const copyText = () => {
        triggerHaptic();
        navigator.clipboard.writeText(receiptText);
        showToast('تم نسخ السند! يمكنك لصقه in واتساب الآن.');
      };

      return (
        <div className="fixed inset-0 bg-slate-950/80 z-[70] flex items-center justify-center p-5 animate-pop">
          <div id="printable-receipt" className="bg-white text-slate-900 w-full max-w-sm rounded-2xl p-5 shadow-2xl" style={{fontFamily: 'monospace'}}>
            <div className="border-b border-dashed border-slate-300 pb-3 mb-3 text-center">
              <h2 className="font-bold text-base">سند مالي معتمد</h2>
            </div>
            <div className="space-y-2.5 text-xs mb-5 font-medium">
              <div className="flex justify-between"><span>رقم السند:</span><span>{data.ref}</span></div>
              <div className="flex justify-between"><span>التاريخ:</span><span>{data.date}</span></div>
              <div className="flex justify-between"><span>النوع:</span><span>{data.title}</span></div>
              <div className="flex justify-between"><span>الجهة/البيان:</span><span className="truncate max-w-[60%]">{data.person}</span></div>
            </div>
            <div className="border-t border-dashed border-slate-300 pt-3 text-center">
              <h3 className="text-xl font-black">{data.amount.toLocaleString()} ج.س</h3>
            </div>
            <div className="mt-6 space-y-2.5">
              <a href={`whatsapp://send?text=${encodeURIComponent(receiptText)}`} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 shadow-md transition">📱 إرسال سريع لواتساب</a>
              <button onClick={copyText} className="w-full bg-slate-100 hover:bg-slate-200 text-slate-800 py-2.5 rounded-xl font-bold text-xs transition">📋 نسخ الفاتورة كنص</button>
              <button onClick={onClose} className="w-full bg-slate-900 hover:bg-slate-800 text-white py-2.5 rounded-xl font-bold text-xs transition">إغلاق ❌</button>
            </div>
          </div>
        </div>
      );
    }

    // --- مودال الدفع الموحد ---
    function PaymentModal({ item, onClose, onSave, title, subtitle }) {
      const [amount, setAmount] = useState(''); 
      const [wallet, setWallet] = useState('bank');
      const rem = item.amount - (item.paid || 0);
      return (
        <div className="fixed inset-0 bg-slate-950/80 z-50 flex items-end justify-center p-4">
          <div className="bg-slate-900 w-full max-w-sm rounded-3xl p-5 border border-slate-700 mb-10 animate-pop shadow-2xl">
            <h2 className="text-sm font-bold text-white mb-2">{title}</h2>
            <p className="text-xs text-slate-400 mb-4">{subtitle} {rem.toLocaleString()} ج.س</p>
            
            <div className="flex gap-2.5 mb-4">
              <button type="button" onClick={()=>setWallet('bank')} className={`flex-1 py-2.5 rounded-xl text-xs font-bold transition ${wallet==='bank'?'bg-blue-500 text-white shadow-md':'bg-slate-800 text-slate-400 border border-slate-600'}`}>حساب بنكي 📱</button>
              <button type="button" onClick={()=>setWallet('cash')} className={`flex-1 py-2.5 rounded-xl text-xs font-bold transition ${wallet==='cash'?'bg-emerald-500 text-white shadow-md':'bg-slate-800 text-slate-400 border border-slate-600'}`}>كاش نقدي 💵</button>
            </div>

            <form onSubmit={e => { e.preventDefault(); const v=parseFloat(amount); if(v>0 && v<=rem) onSave(item.id, v, wallet); }}>
              <input type="number" value={amount} onChange={e=>setAmount(e.target.value)} required max={rem} className="w-full bg-slate-800 text-white text-center text-xl font-black p-3.5 rounded-2xl border border-slate-600 mb-4 focus:outline-none focus:border-emerald-500 transition" placeholder="أدخل القيمة" autoFocus />
              <button type="submit" className="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-3.5 rounded-2xl text-sm font-bold shadow-lg transition">تأكيد ومزامنة الحسابات</button>
            </form>
            <button onClick={onClose} className="w-full mt-3 bg-transparent hover:bg-slate-800 text-slate-400 py-3 rounded-2xl text-sm font-bold transition">إلغاء</button>
          </div>
        </div>
      );
    }

    // --- مودال الإضافة السريع (محدث ليدعم أتمتة خزن الشراكات) ---
    function QuickAddModal({ type: initialType, editData, onClose, onSave, ptnrs }) {
      const isEdit = !!editData; const [type, setType] = useState(initialType);
      const [txType, setTxType] = useState(isEdit && editData.type ? editData.type : (type === 'trust' ? 'external' : 'income'));
      const [wallet, setWallet] = useState(isEdit && editData.wallet ? editData.wallet : 'bank');
      const [direction, setDirection] = useState('bank_to_cash'); 
      const [allocationMode, setAllocationMode] = useState(isEdit && editData.allocationMode ? editData.allocationMode : 'capital');
      const [partnersList, setPartnersList] = useState(isEdit && editData.partners ? editData.partners : [{name: 'أنت', amount: '', share: ''}, {name: 'شريك', amount: '', share: ''}]);
      const [formData, setFormData] = useState(isEdit ? {...editData} : { date: new Date().toISOString().split('T')[0], category: 'مصروف الأسرة' });

      const handleSubmit = e => {
        e.preventDefault(); const dId = isEdit ? formData.id : null;
        if(type === 'transaction') {
          const finalCategory = txType === 'income' ? 'إيداع وارد' : formData.category;
          onSave('transaction', { type: txType, amount: parseFloat(formData.amount), wallet, category: finalCategory, date: formData.date }, dId);
        }
        else if(type === 'transfer') {
          const catName = direction === 'bank_to_cash' ? 'سحب كاش من البنك' : 'إيداع كاش للبنك';
          onSave('transaction', { type: 'transfer', direction, amount: parseFloat(formData.amount), category: catName, date: formData.date }, dId);
        }
        else if(type === 'debt') onSave('debt', { type: txType, person: formData.person, amount: parseFloat(formData.amount), date: formData.date }, dId);
        else if(type === 'trust') onSave('trust', { type: txType, person: formData.person, amount: parseFloat(formData.amount), bankRef: formData.bankRef, date: formData.date }, dId);
        else if(type === 'new_partnership') {
          let calculatedTotalCapital = parseFloat(formData.capital || 0);
          if (allocationMode === 'manual') {
            const sum = partnersList.reduce((s, p) => s + parseFloat(p.share || 0), 0);
            if(sum !== 100) return alert('إجمالي نسب الشركاء اليدوية يجب أن تساوى 100%');
          } else {
            calculatedTotalCapital = partnersList.reduce((s, p) => s + parseFloat(p.amount || 0), 0);
            if(calculatedTotalCapital <= 0) return alert('الرجاء إدخال مبالغ إيداع الشركاء بشكل صحيح');
          }
          // حفظ محدد الخزنة (wallet) برمجياً مع تفاصيل المشروع لخصمه أوتوماتيكياً
          onSave('new_partnership', { name: (formData.projectName || formData.name), capital: calculatedTotalCapital, allocationMode, wallet, partners: partnersList.map(pt=>({name: pt.name, amount: parseFloat(pt.amount || 0), share: parseFloat(pt.share || 0)})) }, dId);
        }
        else if(type === 'evaluation') {
          if(!formData.projectId) return alert('الرجاء اختيار المشروع');
          onSave('evaluation', { projectId: Number(formData.projectId), totalCash: parseFloat(formData.totalCash), wallet, date: formData.date });
        }
      };

      return (
        <div className="fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center p-4">
          <div className="bg-slate-900 w-full max-w-sm rounded-2xl p-5 border border-slate-700 max-h-[85vh] overflow-y-auto animate-pop shadow-2xl">
            <div className="flex justify-between items-center mb-4">
              <h2 className="font-bold text-base text-white">{isEdit?'تعديل سجل':'إدخال مالي جديد'}</h2>
              <button onClick={onClose} className="bg-slate-800 hover:bg-slate-700 p-1.5 rounded-lg text-lg transition">❌</button>
            </div>
            
            {!isEdit && ['transaction', 'transfer', 'debt', 'trust', 'evaluation'].includes(type) && (
              <div className="flex flex-wrap gap-1.5 bg-slate-800 p-1.5 rounded-xl mb-4">
                <button onClick={()=>setType('transaction')} className={`flex-1 py-1.5 rounded-lg text-[11px] font-bold transition ${type==='transaction'?'bg-emerald-500 text-white shadow-sm':'text-slate-400 hover:text-white'}`}>تدفق</button>
                <button onClick={()=>setType('transfer')} className={`flex-1 py-1.5 rounded-lg text-[11px] font-bold transition ${type==='transfer'?'bg-emerald-500 text-white shadow-sm':'text-slate-400 hover:text-white'}`}>تحويل 🔄</button>
                <button onClick={()=>setType('debt')} className={`flex-1 py-1.5 rounded-lg text-[11px] font-bold transition ${type==='debt'?'bg-emerald-500 text-white shadow-sm':'text-slate-400 hover:text-white'}`}>دين</button>
                <button onClick={()=>{setType('trust'); setTxType('external');}} className={`flex-1 py-1.5 rounded-lg text-[11px] font-bold transition ${type==='trust'?'bg-blue-500 text-white shadow-sm':'text-slate-400 hover:text-white'}`}>أمانة</button>
                <button onClick={()=>setType('evaluation')} className={`flex-1 py-1.5 rounded-lg text-[11px] font-bold transition ${type==='evaluation'?'bg-emerald-500 text-white shadow-sm':'text-slate-400 hover:text-white'}`}>جرد</button>
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4">
              {type === 'transaction' && (
                 <>
                  <div className="flex gap-2">
                    <button type="button" onClick={()=>setTxType('income')} className={`flex-1 py-2.5 rounded-xl border-2 font-bold text-xs transition ${txType==='income'?'border-emerald-500 text-emerald-400 bg-emerald-500/10':'border-slate-700 text-slate-400'}`}>وارد (+)</button>
                    <button type="button" onClick={()=>setTxType('expense')} className={`flex-1 py-2.5 rounded-xl border-2 font-bold text-xs transition ${txType==='expense'?'border-red-500 text-red-400 bg-red-500/10':'border-slate-700 text-slate-400'}`}>منصرف (-)</button>
                  </div>
                  <div className="flex gap-2">
                    <button type="button" onClick={()=>setWallet('bank')} className={`flex-1 py-2.5 rounded-xl border-2 font-bold text-xs transition ${wallet==='bank'?'bg-blue-500 border-blue-500 text-white shadow-sm':'bg-slate-800 text-slate-400 border-slate-600'}`}>البنك 📱</button>
                    <button type="button" onClick={()=>setWallet('cash')} className={`flex-1 py-2.5 rounded-xl border-2 font-bold text-xs transition ${wallet==='cash'?'bg-emerald-500 border-emerald-500 text-white shadow-sm':'bg-slate-800 text-slate-400 border-slate-600'}`}>الكاش 💵</button>
                  </div>

                  <input type="number" required placeholder="المبلغ المالي (ج.س)" value={formData.amount||''} onChange={e=>setFormData({...formData, amount: e.target.value})} className="w-full bg-slate-800 text-white p-3 rounded-xl border border-slate-600 text-center font-bold mt-1 text-base focus:outline-none focus:border-emerald-500 transition" />
                  {txType === 'expense' && (
                    <div className="space-y-1.5">
                      <label className="text-xs text-slate-400 font-medium">تصنيف المنصرف:</label>
                      <select value={formData.category||'مصروف الأسرة'} onChange={e=>setFormData({...formData, category: e.target.value})} className="w-full bg-slate-800 text-white p-3 rounded-xl border border-slate-600 text-sm focus:outline-none focus:border-emerald-500 transition">
                        <option value="مصروف الأسرة">مصروف الأسرة</option>
                        <option value="مصروف مدرسي">مصروف مدرسي</option>
                        <option value="تسوق">تسوق</option>
                        <option value="أخرى">أخرى</option>
                      </select>
                    </div>
                  )}
                 </>
              )}

              {type === 'transfer' && (
                 <>
                  <div className="bg-slate-800/80 p-3 rounded-xl border border-slate-700 text-xs text-slate-400 mb-2 leading-relaxed text-center">
                    هذا التحويل لن يؤثر على ثروتك، هو فقط لنقل السيولة بين البنك وجيبك.
                  </div>
                  <div className="flex gap-2">
                    <button type="button" onClick={()=>setDirection('bank_to_cash')} className={`flex-1 py-3 rounded-xl border-2 font-bold text-xs transition ${direction==='bank_to_cash'?'bg-blue-500 border-blue-500 text-white shadow-sm':'bg-slate-800 text-slate-400 border-slate-600'}`}>سحب لليد 💵</button>
                    <button type="button" onClick={()=>setDirection('cash_to_bank')} className={`flex-1 py-3 rounded-xl border-2 font-bold text-xs transition ${direction==='cash_to_bank'?'bg-emerald-500 border-emerald-500 text-white shadow-sm':'bg-slate-800 text-slate-400 border-slate-600'}`}>إيداع للبنك 📱</button>
                  </div>
                  <input type="number" required placeholder="المبلغ المحول (ج.س)" value={formData.amount||''} onChange={e=>setFormData({...formData, amount: e.target.value})} className="w-full bg-slate-800 text-white p-3 rounded-xl border border-slate-600 text-center font-bold mt-2 text-base focus:outline-none focus:border-emerald-500 transition" />
                 </>
              )}
              
              {type === 'trust' && (
                 <>
                  <div className="flex gap-2">
                    <button type="button" onClick={()=>setTxType('external')} className={`flex-1 py-2.5 rounded-xl border-2 text-xs font-bold transition ${txType==='external'?'border-blue-500 text-blue-400 bg-blue-500/10':'border-slate-700 text-slate-400'}`}>رصيد لي بالخارج</button>
                    <button type="button" onClick={()=>setTxType('with_me')} className={`flex-1 py-2.5 rounded-xl border-2 text-xs font-bold transition ${txType==='with_me'?'border-orange-500 text-orange-400 bg-orange-500/10':'border-slate-700 text-slate-400'}`}>أمانة بطرفي</button>
                  </div>
                  <input type="text" required placeholder="اسم الشخص أو الحساب" value={formData.person||''} onChange={e=>setFormData({...formData, person: e.target.value})} className="w-full bg-slate-800 text-white p-3 rounded-xl border border-slate-600 text-sm focus:outline-none focus:border-blue-500 transition" />
                  <input type="number" required placeholder="المبلغ" value={formData.amount||''} onChange={e=>setFormData({...formData, amount: e.target.value})} className="w-full bg-slate-800 text-white p-3 rounded-xl border border-slate-600 text-sm focus:outline-none focus:border-blue-500 transition" />
                  <input type="text" placeholder="رقم الإشعار البنكي (اختياري)" value={formData.bankRef||''} onChange={e=>setFormData({...formData, bankRef: e.target.value})} className="w-full bg-slate-800 text-white p-3 rounded-xl border border-slate-600 text-sm font-mono focus:outline-none focus:border-blue-500 transition" />
                 </>
              )}

              {type === 'debt' && (
                 <>
                  <div className="flex gap-2">
                    <button type="button" onClick={()=>setTxType('to_me')} className={`flex-1 py-2.5 rounded-xl border-2 text-xs font-bold transition ${txType==='to_me'?'border-emerald-500 text-emerald-400 bg-emerald-500/10':'border-slate-700 text-slate-400'}`}>مستحق لي</button>
                    <button type="button" onClick={()=>setTxType('on_me')} className={`flex-1 py-2.5 rounded-xl border-2 text-xs font-bold transition ${txType==='on_me'?'border-red-500 text-red-400 bg-red-500/10':'border-slate-700 text-slate-400'}`}>التزام علي</button>
                  </div>
                  <input type="text" required placeholder="اسم الشخص" value={formData.person||''} onChange={e=>setFormData({...formData, person: e.target.value})} className="w-full bg-slate-800 text-white p-3 rounded-xl border border-slate-600 text-sm focus:outline-none focus:border-emerald-500 transition" />
                  <input type="number" required placeholder="المبلغ الكلي للدين" value={formData.amount||''} onChange={e=>setFormData({...formData, amount: e.target.value})} className="w-full bg-slate-800 text-white p-3 rounded-xl border border-slate-600 text-sm focus:outline-none focus:border-emerald-500 transition" />
                 </>
              )}

              {type === 'new_partnership' && (
                <>
                  <input type="text" required placeholder="اسم مشروع الشراكة" value={formData.projectName||formData.name||''} onChange={e=>setFormData({...formData, projectName: e.target.value})} className="w-full bg-slate-800 text-white p-3 rounded-xl border border-slate-600 text-sm focus:outline-none focus:border-emerald-500 transition" />
                  <div className="space-y-2">
                    <label className="text-xs text-slate-400 font-medium">آلية تحديد النسب وحصص الأرباح:</label>
                    <div className="flex gap-2 bg-slate-800 p-1.5 rounded-xl border border-slate-700">
                      <button type="button" onClick={()=>setAllocationMode('capital')} className={`flex-1 py-2 rounded-lg text-xs font-bold transition ${allocationMode==='capital'?'bg-emerald-500 text-white shadow-sm':'text-slate-400 hover:text-white'}`}>تلقائي (حسب كم أودع)</button>
                      <button type="button" onClick={()=>setAllocationMode('manual')} className={`flex-1 py-2 rounded-lg text-xs font-bold transition ${allocationMode==='manual'?'bg-emerald-500 text-white shadow-sm':'text-slate-400 hover:text-white'}`}>يدوي (أنا أُعيِّن النسب)</button>
                    </div>
                  </div>

                  {/* [تحديث واجهة الأتمتة]: سحب مصدر التمويل الفردي برمجياً لمنع السهو البشري */}
                  {allocationMode === 'capital' && (
                    <div className="space-y-1.5">
                      <label className="text-xs text-slate-400 font-medium">مصدر تمويل حصتك الفردية (أنت):</label>
                      <div className="flex gap-2 bg-slate-800 p-1.5 rounded-xl border border-slate-700">
                        <button type="button" onClick={()=>setWallet('bank')} className={`flex-1 py-2 rounded-lg text-xs font-bold transition ${wallet==='bank'?'bg-blue-500 text-white shadow-sm':'text-slate-400 hover:text-white'}`}>البنك 📱</button>
                        <button type="button" onClick={()=>setWallet('cash')} className={`flex-1 py-2 rounded-lg text-xs font-bold transition ${wallet==='cash'?'bg-emerald-500 text-white shadow-sm':'text-slate-400 hover:text-white'}`}>الكاش 💵</button>
                      </div>
                    </div>
                  )}

                  {allocationMode === 'manual' && (
                    <input type="number" required placeholder="رأس المال الكلي للمشروع" value={formData.capital||''} onChange={e=>setFormData({...formData, capital: e.target.value})} className="w-full bg-slate-800 text-white p-3 rounded-xl border border-slate-600 text-sm focus:outline-none focus:border-emerald-500 transition" />
                  )}
                  <div className="pt-4 border-t border-slate-700 mt-2">
                    <p className="text-xs font-bold text-emerald-400 mb-3">قائمة الشركاء والمساهمات:</p>
                    {partnersList.map((p, i) => (
                      <div key={i} className="flex gap-2 mb-3 items-center">
                        <input type="text" required value={p.name} onChange={e=>{let l=[...partnersList]; l[i].name=e.target.value; setPartnersList(l);}} className="w-2/5 bg-slate-800 text-white p-2.5 rounded-xl border border-slate-600 text-sm focus:outline-none focus:border-emerald-500 transition" placeholder="الاسم" />
                        {allocationMode === 'capital' ? (
                          <input type="number" required value={p.amount} onChange={e=>{let l=[...partnersList]; l[i].amount=e.target.value; setPartnersList(l);}} className="w-3/5 bg-slate-800 text-white p-2.5 rounded-xl border border-slate-600 text-center text-sm focus:outline-none focus:border-emerald-500 transition" placeholder="كم أودع؟ (ج.س)" />
                        ) : (
                          <input type="number" required value={p.share} onChange={e=>{let l=[...partnersList]; l[i].share=e.target.value; setPartnersList(l);}} className="w-3/5 bg-slate-800 text-white p-2.5 rounded-xl border border-slate-600 text-center text-sm focus:outline-none focus:border-emerald-500 transition" placeholder="نسبته المئوية %" />
                        )}
                        {i > 1 && <button type="button" onClick={()=>setPartnersList(partnersList.filter((_, idx)=>idx!==i))} className="text-red-400 font-bold px-2 text-lg hover:bg-slate-700 rounded-lg transition">❌</button>}
                      </div>
                    ))}
                    <button type="button" onClick={()=>setPartnersList([...partnersList, {name:'', amount:'', share:''} || {}])} className="w-full text-emerald-400 bg-emerald-500/10 hover:bg-emerald-500/20 py-2.5 rounded-xl text-xs font-bold transition">➕ إضافة شريك جديد</button>
                  </div>
                </>
              )}

              {type === 'evaluation' && (
                <>
                  <div className="flex gap-2 mb-3">
                    <button type="button" onClick={()=>setWallet('bank')} className={`flex-1 py-2.5 rounded-xl border-2 text-xs font-bold transition ${wallet==='bank'?'bg-blue-500 border-blue-500 text-white shadow-sm':'bg-slate-800 text-slate-400 border-slate-600'}`}>أرباح للبنك 📱</button>
                    <button type="button" onClick={()=>setWallet('cash')} className={`flex-1 py-2.5 rounded-xl border-2 text-xs font-bold transition ${wallet==='cash'?'bg-emerald-500 border-emerald-500 text-white shadow-sm':'bg-slate-800 text-slate-400 border-slate-600'}`}>أرباح كاش 💵</button>
                  </div>
                  <select required value={formData.projectId||''} onChange={e=>setFormData({...formData, projectId: e.target.value})} className="w-full bg-slate-800 text-white p-3 rounded-xl border border-slate-600 mb-3 text-sm focus:outline-none focus:border-emerald-500 transition">
                    <option value="">اختر مشروع الشراكة لجرد المال...</option>
                    {ptnrs.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                  </select>
                  <input type="number" required placeholder="إجمالي المال الفعلي للمشروع بالكامل" value={formData.totalCash||''} onChange={e=>setFormData({...formData, totalCash: e.target.value})} className="w-full bg-slate-800 text-white p-3 rounded-xl border border-slate-600 text-sm focus:outline-none focus:border-emerald-500 transition" />
                </>
              )}

              <input type="date" required value={formData.date} onChange={e=>setFormData({...formData, date: e.target.value})} className="w-full bg-slate-800 text-white p-3 rounded-xl border border-slate-600 text-center text-sm focus:outline-none focus:border-emerald-500 transition" />
              <button type="submit" className="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3.5 rounded-xl shadow-lg transition mt-2 text-sm">حفظ وتأكيد التغيير</button>
            </form>
          </div>
        </div>
      );
    }

    function NavItem({ icon, label, active, onClick }) {
      return (
        <button onClick={() => { triggerHaptic(); onClick(); }} className={`flex flex-col items-center p-2 rounded-xl transition-all ${active ? 'text-emerald-400 bg-slate-700/50' : 'text-slate-500 hover:text-slate-300'}`}>
          <div>{icon}</div><span className="text-[10px] sm:text-[11px] font-bold mt-1 whitespace-nowrap">{label}</span>
        </button>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
