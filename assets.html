<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>منصة الأصول - المحفظة الذكية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Cairo', system-ui, sans-serif; background: #020617; color: #f8fafc; -webkit-tap-highlight-color: transparent; }
    input[type=number]::-webkit-inner-spin-button { display: none; }
    .pop { animation: p .2s ease-out forwards; }
    @keyframes p { 0% { transform: scale(.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const I = {
  B: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-5 h-5"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-6h6v6M8 6h.01M16 6h.01M8 10h.01M16 10h.01M8 14h.01M16 14h.01"/></svg>,
  G: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-5 h-5"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 3"/></svg>,
  C: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-5 h-5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>,
  A: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-5 h-5"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 6h6M9 10h6M9 14h6M9 18h6"/></svg>,
  W: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-5 h-5"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4M4 6v12c0 1.1.9 2 2 2h14v-4M18 12a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h4v-6Z"/></svg>,
  S: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-5 h-5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 5.4 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1-2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
  T: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-4 h-4"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></svg>,
  E: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-4 h-4"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
  R: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-4 h-4"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/></svg>,
  M: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-5 h-5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
};

const vib = () => { if (navigator.vibrate) navigator.vibrate(30); };
const jP = (k) => { try { return JSON.parse(localStorage.getItem(k)) || []; } catch (e) { return []; } };

function AuthScreen({ view, setView, savedEmail, savedPwd, savedSecAnswer, onRegister, onLogin, onResetPwd }) {
  const [em, setEm] = useState('');
  const [pw, setPw] = useState('');
  const [sec, setSec] = useState('');
  
  useEffect(() => { if (savedEmail) setEm(savedEmail); }, [savedEmail]);
  
  const sub = e => {
    e.preventDefault(); vib();
    if (view === 'register') {
      if (!em || pw.length < 4 || !sec) return alert('أكمل الحقول (الرمز 4 أرقام على الأقل)');
      onRegister(em.toLowerCase(), pw, sec.trim());
    } else if (view === 'login') {
      if (em.toLowerCase() === savedEmail.toLowerCase() && pw === savedPwd) onLogin(); else alert('البيانات غير صحيحة!');
    } else if (view === 'forgot') {
      if ((em || '').toLowerCase() === (savedEmail || '').toLowerCase() && (sec || '').trim() === (savedSecAnswer || '').trim()) {
        const np = prompt('الرمز الجديد:'); if (np && np.length >= 4) onResetPwd(np); else alert('مرفوض');
      } else alert('إجابة خاطئة!');
    }
  };

  return (
    <div className="min-h-[80vh] flex items-center justify-center p-4">
      <div className="bg-slate-900 p-8 rounded-3xl w-full max-w-sm border border-slate-800 text-center space-y-5 shadow-xl">
        <h1 className="text-2xl font-black text-yellow-500 tracking-tight">🔐 منصة الأصول</h1>
        <form onSubmit={sub} className="space-y-4">
          <input type="email" required placeholder="البريد الإلكتروني" value={em} onChange={e => setEm(e.target.value)} className="w-full bg-slate-950 border border-slate-800 text-white p-3.5 rounded-xl text-left text-sm outline-none font-sans" />
          {view !== 'forgot' && <input type="password" required placeholder="رمز الدخول" value={pw} onChange={e => setPw(e.target.value)} className="w-full bg-slate-950 border border-slate-800 text-white p-3.5 rounded-xl text-left text-sm outline-none font-sans" />}
          {(view === 'register' || view === 'forgot') && <input type="text" required placeholder="سؤال الأمان: مدينتك المفضلة؟" value={sec} onChange={e => setSec(e.target.value)} className="w-full bg-slate-950 border border-slate-800 text-yellow-500 p-3.5 rounded-xl text-sm outline-none" />}
          <button type="submit" className="w-full bg-yellow-500 text-slate-950 font-bold py-3.5 rounded-xl text-sm">
            {view === 'login' ? 'دخول المنصة' : view === 'register' ? 'إنشاء حساب' : 'استعادة الصلاحية'}
          </button>
        </form>
        <div className="mt-6 flex flex-col gap-3 text-center text-sm font-semibold">
          {view === 'login' ? (
            <>
              <button onClick={() => setView('forgot')} className="text-slate-400">نسيت الرمز؟</button>
              <button onClick={() => setView('register')} className="text-yellow-500">ملف جديد ➕</button>
            </>
          ) : (
            <button onClick={() => setView('login')} className="text-slate-400">تسجيل دخول 🔑</button>
          )}
        </div>
      </div>
    </div>
  );
}

function CurrencyConverter({ rates }) {
  const [amt, setAmt] = useState('');
  const [cur, setCur] = useState('USD');

  const calc = (rate) => {
    const value = parseFloat(amt) || 0;
    return Math.round(value * rate).toLocaleString();
  };

  return (
    <div className="bg-gradient-to-br from-slate-800 to-slate-900 p-5 rounded-3xl border border-indigo-500/30 space-y-5 pop shadow-xl">
      <h3 className="text-sm font-black text-indigo-400 border-b border-slate-700/50 pb-3 flex gap-2 items-center">
        <I.M/> محول العملات المباشر
      </h3>
      <div className="flex gap-2">
        <input type="number" placeholder="أدخل المبلغ هنا..." value={amt} onChange={e => setAmt(e.target.value)} className="flex-1 min-w-0 bg-slate-950 p-3.5 rounded-xl text-center font-bold outline-none text-white border border-slate-700 focus:border-indigo-500 transition font-sans" />
        <select value={cur} onChange={e => setCur(e.target.value)} className="bg-slate-900 text-white p-3 rounded-xl font-bold outline-none border border-slate-700 shrink-0">
          <option value="USD">دولار ($)</option>
          <option value="SAR">ريال (ر.س)</option>
        </select>
      </div>
      {amt > 0 && (
        <div className="space-y-3 pt-2">
          <div className="bg-slate-950/80 p-4 rounded-2xl border border-slate-700 flex flex-col items-center justify-center relative overflow-hidden">
            <span className="text-[11px] font-semibold text-slate-400 absolute top-2 right-3">السعر الرسمي</span>
            <span className="text-xl font-black text-emerald-400 mt-4 tracking-tighter truncate w-full text-center" dir="ltr">
              {calc(cur === 'USD' ? rates.usdOfficial : rates.sarOfficial)} ج.س
            </span>
          </div>
          <div className="bg-slate-950 p-4 rounded-2xl border border-indigo-500/50 flex flex-col items-center justify-center relative overflow-hidden shadow-[0_0_15px_rgba(99,102,241,0.15)]">
            <span className="text-[11px] font-semibold text-slate-400 absolute top-2 right-3">السوق الموازي</span>
            <span className="text-2xl font-black text-indigo-400 mt-4 tracking-tighter truncate w-full text-center" dir="ltr">
              {calc(cur === 'USD' ? rates.usdParallel : rates.sarParallel)} ج.س
            </span>
            <span className="text-[10px] text-indigo-500/80 mt-1 font-semibold flex items-center gap-1">تحديث تلقائي</span>
          </div>
        </div>
      )}
    </div>
  );
}

function Feas() {
  const [n, setN] = useState(''); const [d, setD] = useState(() => new Date().toISOString().split('T')[0]);
  const [c, setC] = useState(''); const [rv, setRv] = useState(''); const [rf, setRf] = useState('monthly');
  const [ex, setEx] = useState(''); const [ef, setEf] = useState('monthly'); const [rm, setRm] = useState('15');
  const [cr, setCr] = useState(''); const [dm, setDm] = useState('5'); const [cm, setCm] = useState('');
  const [res, setRes] = useState(null);

  const calc = () => {
    vib(); const cap = parseFloat(c) || 0; const r = parseFloat(rv) || 0; const e = parseFloat(ex) || 0;
    const rate = ((rm === 'custom' ? parseFloat(cr) : parseFloat(rm)) || 0) / 100;
    const yrs = dm === 'custom' ? (parseFloat(cm || 0) / 12) : parseInt(dm);
    if (cap <= 0 || r <= 0 || yrs <= 0) return alert('الرجاء إدخال بيانات صحيحة.');
    const m = { 'daily': 360, 'weekly': 52, 'monthly': 12, 'yearly': 1 }; 
    const aF = (r * m[rf]) - (e * m[ef]);
    if (aF <= 0) return setRes({ err: 'تكاليف التشغيل تفوق الأرباح! المشروع خاسر.' });
    
    const tP = aF * yrs; let npv = 0;
    if (yrs >= 1) { 
      for (let t = 1; t <= Math.floor(yrs); t++) npv += aF / Math.pow(1 + rate, t); 
      const rem = yrs - Math.floor(yrs); 
      if (rem > 0) npv += (aF * rem) / Math.pow(1 + rate, Math.ceil(yrs)); 
    } else { 
      npv = tP / Math.pow(1 + rate, yrs); 
    }
    npv -= cap; const tD = Math.round((cap / aF) * 30);
    setRes({ id: `FEAS-${Date.now().toString().slice(-5)}`, tP, npv, roi: (tP / cap) * 100, mo: Math.floor(tD / 30), dy: tD % 30, ok: npv > 0, yrs });
  };

  const share = () => {
    const txt = `📊 تقرير جدوى\nالرقم: ${res.id}\nالاسم: ${n || 'عام'}\nرأس المال: ${parseFloat(c).toLocaleString()}\nالقرار: ${res.ok ? '✅ ناجح' : '❌ خاسر'}`;
    navigator.clipboard.writeText(txt); alert('تم النسخ!');
  };

  return (
    <div className="bg-gradient-to-br from-slate-800/60 to-slate-900 p-5 rounded-3xl border border-emerald-500/20 space-y-4 pop shadow-xl">
      <h3 className="text-sm font-black text-emerald-400 border-b border-slate-700/50 pb-3 flex gap-2 items-center"><I.A/> تحليل دراسات الجدوى</h3>
      <div className="space-y-3 text-sm font-semibold">
        <input type="text" placeholder="اسم المشروع..." value={n} onChange={e => setN(e.target.value)} className="w-full bg-slate-900/80 text-white p-3.5 rounded-xl border border-slate-700/50 outline-none focus:border-emerald-500" />
        <input type="date" value={d} onChange={e => setD(e.target.value)} className="w-full bg-slate-900/80 text-white p-3.5 rounded-xl text-center font-bold border border-slate-700/50 outline-none focus:border-emerald-500 font-sans" />
        <input type="number" placeholder="رأس المال (ج.س)" value={c} onChange={e => setC(e.target.value)} className="w-full bg-slate-900/80 text-white p-3.5 rounded-xl text-center font-bold border border-slate-700/50 outline-none focus:border-emerald-500 font-sans" />
        
        <div className="p-4 bg-slate-900/80 rounded-2xl border border-slate-700/50 space-y-3 shadow-inner">
          <div className="flex gap-2">
            <input type="number" placeholder="إيراد" value={rv} onChange={e => setRv(e.target.value)} className="flex-1 bg-slate-950 p-3 rounded-xl text-center font-bold text-emerald-400 outline-none border border-slate-800" />
            <select value={rf} onChange={e => setRf(e.target.value)} className="bg-slate-950 text-white p-2 rounded-xl font-bold outline-none border border-slate-800"><option value="daily">يومي</option><option value="monthly">شهري</option><option value="yearly">سنوي</option></select>
          </div>
          <div className="flex gap-2">
            <input type="number" placeholder="مصروف" value={ex} onChange={e => setEx(e.target.value)} className="flex-1 bg-slate-950 p-3 rounded-xl text-center font-bold text-red-400 outline-none border border-slate-800" />
            <select value={ef} onChange={e => setEf(e.target.value)} className="bg-slate-950 text-white p-2 rounded-xl font-bold outline-none border border-slate-800"><option value="daily">يومي</option><option value="monthly">شهري</option><option value="yearly">سنوي</option></select>
          </div>
        </div>
        
        <select value={rm} onChange={e => setRm(e.target.value)} className="w-full bg-slate-900/80 p-3.5 rounded-xl font-bold text-white outline-none border border-slate-700/50 focus:border-emerald-500"><option value="15">تضخم 15%</option><option value="20">تضخم 20%</option><option value="custom">مخصص...</option></select>
        {rm === 'custom' && <input type="number" placeholder="نسبة %" value={cr} onChange={e => setCr(e.target.value)} className="w-full bg-slate-900/80 p-3 rounded-xl text-center font-bold text-amber-400 border border-amber-500/30 outline-none" />}
        
        <select value={dm} onChange={e => setDm(e.target.value)} className="w-full bg-slate-900/80 p-3.5 rounded-xl text-center font-bold text-white outline-none border border-slate-700/50 focus:border-emerald-500"><option value="1">1 سنة</option><option value="3">3 سنوات</option><option value="5">5 سنوات</option><option value="custom">مخصص...</option></select>
        {dm === 'custom' && <input type="number" placeholder="شهور" value={cm} onChange={e => setCm(e.target.value)} className="w-full bg-slate-900/80 p-3 rounded-xl text-center font-bold text-amber-400 border border-amber-500/30 outline-none" />}
      </div>
      
      <button type="button" onClick={calc} className="w-full bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 font-black py-4 rounded-xl text-sm transition shadow-lg">تطبيق واستخراج التقرير ⚙️</button>
      
      {res && !res.err && (
        <div className="bg-slate-900 p-5 rounded-3xl border border-cyan-500/30 space-y-4 text-xs font-semibold pop shadow-2xl mt-4">
          <div className="flex justify-between items-center text-slate-300"><span>الرقم:</span><span className="font-bold text-cyan-400">{res.id}</span></div>
          <div className="flex justify-between items-center gap-2 border-t border-slate-700/50 pt-3"><span className="text-slate-300">الربح الصافي:</span><span className="text-emerald-400 font-black text-sm" dir="ltr">{Math.round(res.tP).toLocaleString()} ج</span></div>
          <div className="flex justify-between items-center gap-2"><span className="text-slate-300">أرباح (NPV):</span><span className={`text-sm ${res.ok ? 'text-emerald-400' : 'text-red-400'}`} dir="ltr">{Math.round(res.npv).toLocaleString()} ج</span></div>
          <div className="flex justify-between items-center text-slate-300"><span>العائد (ROI):</span><span className="text-amber-400 font-black text-sm bg-amber-500/10 px-2 py-1 rounded-lg">{res.roi.toFixed(1)}%</span></div>
          <div className="flex justify-between items-center border-b border-slate-700/50 pb-3 text-slate-300"><span>الاسترداد:</span><span className="text-white font-bold">{res.mo} شهراً و {res.dy} يوماً</span></div>
          <p className={`p-3 rounded-xl text-center font-bold text-sm shadow-inner ${res.ok ? 'bg-emerald-500/20 text-emerald-300' : 'bg-red-500/20 text-red-300'}`}>{res.ok ? '✅ ينصح بالبدء' : '❌ التضخم يبتلع الأرباح'}</p>
          <button type="button" onClick={share} className="w-full bg-slate-800 text-cyan-400 py-3 rounded-xl font-bold">مشاركة</button>
        </div>
      )}
      {res && res.err && <div className="bg-red-500/20 p-4 rounded-2xl text-red-300 text-center font-bold">{res.err}</div>}
    </div>
  );
}

function Mod({ g24, ed, cls, sav }) {
  const isE = !!ed; 
  const gt = isE ? (ed.type || (ed.grams !== undefined ? 'gold' : 'real_estate')) : 'real_estate';
  const [ty, setTy] = useState(gt); 
  const [pm, setPm] = useState(isE && ed.purityLabel ? 'other' : (isE && ed.purity == 0.875 ? '21' : (isE && ed.purity == 0.75 ? '18' : '24')));
  const [f, setF] = useState(isE ? { ...ed } : { name: '', area: '', currentValue: '', isRented: 'no', monthlyRent: '', annualGrowth: '', grams: '', habba: '', purity: '1', periodicIncome: '', incomeFreq: 'daily', customName: '', customFactor: '' });
  
  const am = (parseFloat(f.area) > 0 && parseFloat(f.currentValue) > 0) ? (parseFloat(f.currentValue) / parseFloat(f.area)) : 0;
  
  const snd = () => {
    const id = isE ? ed.id : Date.now(); 
    const dt = isE ? ed.date : new Date().toISOString().split('T')[0];
    
    if (ty === 'real_estate') { 
      sav({ id, type: 'real_estate', name: f.name, area: parseFloat(f.area) || 0, pricePerMeter: am, currentValue: parseFloat(f.currentValue) || 0, isRented: f.isRented === 'yes', monthlyRent: parseFloat(f.monthlyRent) || 0, annualGrowth: parseFloat(f.annualGrowth) || 0, date: dt }, isE); 
    } else if (ty === 'gold') { 
      const tg = (parseFloat(f.grams) || 0) + (parseFloat(f.habba) || 0) * 0.058; 
      const fp = pm === 'other' ? parseFloat(f.customFactor) : (pm === '21' ? 0.875 : (pm === '18' ? 0.75 : 1)); 
      const fl = pm === 'other' ? f.customName : `عيار ${pm}`; 
      sav({ id, type: 'gold', name: f.name || fl, grams: parseFloat(f.grams) || 0, habba: parseFloat(f.habba) || 0, totalGrams: tg, purity: fp, purityLabel: fl, currentValue: tg * g24 * fp, date: dt }, isE); 
    } else { 
      sav({ id, type: 'vehicle_livestock', name: f.name, currentValue: parseFloat(f.currentValue) || 0, isRented: f.isRented === 'yes', periodicIncome: parseFloat(f.periodicIncome) || 0, incomeFreq: f.incomeFreq || 'daily', date: dt }, isE); 
    }
  };

  return (
    <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
      <div className="bg-slate-900 w-full max-w-sm rounded-3xl p-5 border border-slate-800 space-y-4 max-h-[85vh] overflow-y-auto pop">
        <div className="flex justify-between items-center">
          <h2 className="font-bold text-white text-base">{isE ? 'تعديل البيانات' : 'أصل جديد'}</h2>
          <button onClick={cls} className="text-slate-400 text-xl">×</button>
        </div>
        
        {!isE && (
          <div className="flex bg-slate-950 p-1 rounded-xl text-xs font-bold border border-slate-800">
            <button onClick={() => setTy('real_estate')} className={`flex-1 py-2 rounded-lg ${ty === 'real_estate' ? 'bg-yellow-500 text-slate-950' : ''}`}>عقار</button>
            <button onClick={() => setTy('gold')} className={`flex-1 py-2 rounded-lg ${ty === 'gold' ? 'bg-yellow-500 text-slate-950' : ''}`}>نفائس</button>
            <button onClick={() => setTy('vehicle_livestock')} className={`flex-1 py-2 rounded-lg ${ty === 'vehicle_livestock' ? 'bg-yellow-500 text-slate-950' : ''}`}>مركبات</button>
          </div>
        )}
        
        <div className="space-y-3 text-sm font-semibold">
          <input type="text" placeholder="الاسم أو البيان..." value={f.name || ''} onChange={e => setF({ ...f, name: e.target.value })} className="w-full bg-slate-950 text-white p-3.5 rounded-xl border border-slate-800 outline-none" />
          
          {ty === 'real_estate' && (
            <div className="space-y-3">
              <input type="number" placeholder="المساحة (م²)" value={f.area || ''} onChange={e => setF({ ...f, area: e.target.value })} className="w-full bg-slate-950 p-3.5 rounded-xl text-center text-white" />
              <input type="number" placeholder="القيمة الحالية" value={f.currentValue || ''} onChange={e => setF({ ...f, currentValue: e.target.value })} className="w-full bg-slate-950 p-3.5 rounded-xl text-center text-white" />
              <select value={f.isRented || 'no'} onChange={e => setF({ ...f, isRented: e.target.value })} className="w-full bg-slate-900 text-white p-3 rounded font-bold outline-none"><option value="no">أصل ثابت</option><option value="yes">مدر للربح</option></select>
              {f.isRented === 'yes' && (
                <div className="flex gap-2"><input type="number" placeholder="الإيجار" value={f.monthlyRent || ''} onChange={e => setF({ ...f, monthlyRent: e.target.value })} className="flex-1 bg-slate-950 p-3 rounded-xl text-center text-white" /></div>
              )}
            </div>
          )}
          
          {ty === 'gold' && (
            <div className="space-y-3">
              <div className="flex gap-2">
                <input type="number" placeholder="الجرامات" value={f.grams || ''} onChange={e => setF({ ...f, grams: e.target.value })} className="flex-1 bg-slate-950 p-3.5 rounded-xl text-center text-white" />
                <input type="number" placeholder="الحبات" value={f.habba || ''} onChange={e => setF({ ...f, habba: e.target.value })} className="flex-1 bg-slate-950 p-3.5 rounded-xl text-center text-white" />
              </div>
              <select value={pm} onChange={e => setPm(e.target.value)} className="w-full bg-slate-900 text-yellow-400 p-3 rounded-xl font-bold outline-none"><option value="24">عيار 24</option><option value="21">عيار 21</option><option value="18">عيار 18</option></select>
            </div>
          )}
          
          {ty === 'vehicle_livestock' && (
            <div className="space-y-3">
              <input type="number" placeholder="القيمة" value={f.currentValue || ''} onChange={e => setF({ ...f, currentValue: e.target.value })} className="w-full bg-slate-950 p-3.5 rounded-xl text-center text-white" />
              <select value={f.isRented || 'no'} onChange={e => setF({ ...f, isRented: e.target.value })} className="w-full bg-slate-900 text-white p-3 rounded-xl font-bold outline-none"><option value="no">لا</option><option value="yes">نعم يورد أرباح</option></select>
              {f.isRented === 'yes' && (
                <div className="flex gap-2">
                  <input type="number" placeholder="الربح" value={f.periodicIncome || ''} onChange={e => setF({ ...f, periodicIncome: e.target.value })} className="flex-1 bg-slate-950 p-3 rounded-xl text-center text-white" />
                </div>
              )}
            </div>
          )}
        </div>
        <button onClick={snd} className="w-full bg-yellow-500 text-slate-950 font-black py-4 rounded-xl text-sm">حفظ</button>
      </div>
    </div>
  );
}

function PlMod({ p, txs, oC, oD }) {
  const pt = txs.filter(t => (t.category || '').includes(`(${p.name})`) && t.type === 'income');
  const tot = pt.reduce((s, t) => s + parseFloat(t.amount || 0), 0);
  
  return (
    <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
      <div className="bg-slate-900 w-full max-w-sm rounded-3xl p-5 border border-slate-800 space-y-4 max-h-[85vh] overflow-y-auto pop shadow-2xl">
        <div className="flex justify-between items-center mb-4">
          <h2 className="font-bold text-white text-base truncate pr-2">أرباح ({p.name})</h2>
          <button onClick={oC} className="bg-slate-800 p-1.5 rounded-lg text-slate-400">❌</button>
        </div>
        <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 mb-4 flex justify-between items-center gap-2">
          <span className="text-xs text-slate-400 font-bold">المحصل:</span>
          <span className="text-emerald-400 font-black text-sm" dir="ltr">{tot.toLocaleString()} ج</span>
        </div>
        <div className="space-y-2 max-h-60 overflow-y-auto pr-1">
          {pt.map(t => (
            <div key={t.id} className="bg-slate-950 p-2.5 rounded-xl flex justify-between items-center border border-slate-800 gap-2">
              <div className="min-w-0 flex-1">
                <p className="text-emerald-400 font-bold text-sm" dir="ltr">+{parseFloat(t.amount || 0).toLocaleString()}</p>
                <p className="text-[10px] text-slate-500 mt-0.5">{t.date}</p>
              </div>
              <button onClick={() => oD(t.id)} className="bg-red-500/10 text-red-400 p-2 rounded-lg text-[10px] font-bold">حذف 🗑️</button>
            </div>
          ))}
          {pt.length === 0 && <p className="text-center text-xs text-slate-500 py-4">لا أرباح</p>}
        </div>
      </div>
    </div>
  );
}

function ReceiptModal({ data, onClose, showToast }) {
  if (!data) return null;
  const safeAmt = data.amount ? parseFloat(data.amount) : 0;
  const rTxt = `🧾 *${data.title}*\n▪️ المرجع: ${data.ref}\n▪️ التاريخ: ${data.date}\n▪️ البيان: ${data.person}\n💰 المبلغ: ${safeAmt.toLocaleString()} ج.س`;

  return (
    <div className="fixed inset-0 bg-black/85 z-50 flex items-center justify-center p-5 pop">
      <div className="bg-white text-slate-950 w-full max-w-sm rounded-3xl p-6 font-sans shadow-2xl space-y-5">
        <h2 className="font-black text-center text-lg border-b border-dashed border-slate-300 pb-3">
          {data.title}
        </h2>
        <div className="text-sm space-y-2 font-bold text-slate-700">
          <div className="flex justify-between">
            <span>المرجع:</span>
            <span className="font-mono bg-slate-100 px-2 rounded">{data.ref}</span>
          </div>
          <div className="flex justify-between">
            <span>التاريخ:</span>
            <span className="font-mono">{data.date}</span>
          </div>
          <div className="flex justify-between">
            <span>البيان:</span>
            <span className="truncate max-w-[60%] text-left">{data.person}</span>
          </div>
        </div>
        <div className="border-t border-dashed border-slate-300 pt-4 text-center">
          <h3 className="text-2xl font-black text-emerald-600" dir="ltr">
            {safeAmt.toLocaleString()} <span className="text-sm text-slate-500">ج.س</span>
          </h3>
        </div>
        <div className="space-y-2.5 pt-3">
          <button 
            onClick={()=>{
              vib(); window.location.href=`whatsapp://send?text=${encodeURIComponent(rTxt)}`;
            }} 
            className="w-full bg-emerald-500 text-white py-3 rounded-xl font-black text-sm shadow-md"
          >
            إرسال واتساب
          </button>
          <button 
            onClick={()=>{
              vib(); navigator.clipboard.writeText(rTxt); showToast('تم النسخ!');
            }} 
            className="w-full bg-slate-100 text-slate-800 py-3 rounded-xl font-bold text-sm"
          >
            نسخ السند
          </button>
          <button 
            onClick={onClose} 
            className="w-full bg-slate-900 text-white py-3 rounded-xl font-bold text-sm"
          >
            إغلاق ❌
          </button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [auth, setAuth] = useState(() => localStorage.getItem('s_acc_sess') === 'act');
  const [vw, setVw] = useState('login');
  const [em, setEm] = useState(() => localStorage.getItem('s_acc_em') || '');
  const [pw, setPw] = useState(() => localStorage.getItem('s_acc_pw') || '1234');
  const [sec, setSec] = useState(() => localStorage.getItem('s_acc_sec') || '');
  
  const [tab, setTab] = useState('assets');
  const [srch, setSrch] = useState('');
  const [ast, setAst] = useState(() => jP('smart_accountant_assets'));
  const [txs, setTxs] = useState(() => jP('smart_accountant_tx'));
  const [g24, setG24] = useState(() => Number(localStorage.getItem('cfg_gold_24')) || 76500);
  const [bkp, setBkp] = useState(() => Number(localStorage.getItem('s_acc_bkp')) || 0);
  
  const [mo, setMo] = useState(false);
  const [ed, setEd] = useState(null);
  const [rec, setRec] = useState(null);
  const [tst, setTst] = useState(null);
  const [plM, setPlM] = useState(null);

  const [liveRates, setLiveRates] = useState({
    usdOfficial: 1300, usdParallel: 1950, sarOfficial: 346, sarParallel: 520, lastUpdate: 'تحديث...'
  });

  useEffect(() => { if (!localStorage.getItem('s_acc_em')) setVw('register'); }, []);
  useEffect(() => { localStorage.setItem('smart_accountant_assets', JSON.stringify(ast)); }, [ast]);
  useEffect(() => { localStorage.setItem('smart_accountant_tx', JSON.stringify(txs)); }, [txs]);
  useEffect(() => { localStorage.setItem('cfg_gold_24', g24); }, [g24]);

  useEffect(() => {
    if (!auth) return;
    const fetchMarketData = () => {
      setTimeout(() => {
        setLiveRates({
          usdOfficial: 1300, usdParallel: 1980, sarOfficial: 346, sarParallel: 525,
          lastUpdate: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })
        });
      }, 1500);
    };
    fetchMarketData();
  }, [auth]);

  useEffect(() => {
    const syncD = e => {
      if (e.key === 'smart_accountant_assets') setAst(jP('smart_accountant_assets'));
      if (e.key === 'smart_accountant_tx') setTxs(jP('smart_accountant_tx'));
      if (e.key === 'cfg_gold_24') setG24(Number(localStorage.getItem('cfg_gold_24')) || 76500);
    };
    window.addEventListener('storage', syncD);
    return () => window.removeEventListener('storage', syncD);
  }, []);

  const shT = m => { setTst(m); setTimeout(() => setTst(null), 2500); };
  const wlt = useMemo(() => ast.reduce((s, a) => s + parseFloat(a.currentValue || 0), 0), [ast]);
  const fAst = ast.filter(a => (a.name || '').includes(srch));

  const doBkp = async () => {
    vib(); 
    const f = { tx: jP('smart_accountant_tx'), as: ast };
    const b = btoa(unescape(encodeURIComponent(JSON.stringify(f)))); 
    const t = `[أرشيف]\n${new Date().toLocaleDateString('ar-EG')}\n\n${b}`;
    const n = Date.now(); setBkp(n); localStorage.setItem('s_acc_bkp', n);
    try { if (navigator.share) await navigator.share({ title: 'أرشيف', text: t }); else { await navigator.clipboard.writeText(t); shT('تم النسخ!'); } } catch (e) { shT('تم الحفظ'); }
  };
  
  const doRes = (s) => {
    vib(); 
    try { 
      const e = s.match(/[A-Za-z0-9+/=]{50,}/)?.[0] || s.trim(); 
      const d = JSON.parse(decodeURIComponent(escape(atob(e))));
      if (d.as) setAst(d.as); 
      if (d.tx) setTxs(d.tx); 
      setBkp(Date.now()); shT('تمت الاستعادة!'); 
    } catch (e) { alert('كود تالف'); }
  };

  const doExp = () => {
    vib(); if (ast.length === 0) return alert('لا أصول!'); 
    let c = "data:text/csv;charset=utf-8,\uFEFFتاريخ,اسم,قيمة\r\n";
    ast.forEach(a => { c += `${a.date},${a.name},${a.currentValue}\r\n`; });
    const l = document.createElement("a"); l.setAttribute("href", encodeURI(c)); l.setAttribute("download", `أصول.csv`); document.body.appendChild(l); l.click();
  };

  const savA = (d, i) => { vib(); if (i) setAst(ast.map(a => a.id === d.id ? d : a)); else setAst([{ ...d, id: Date.now() }, ...ast]); shT('تم الحفظ'); setMo(false); setEd(null); };
  
  const delA = a => {
    if (window.confirm(`حذف (${a.name})؟`)) {
      setAst(ast.filter(x => x.id !== a.id)); shT('حُذف');
    }
  };

  const genInc = a => {
    const am = parseFloat(a.type === 'real_estate' ? a.monthlyRent : a.periodicIncome) || 0; 
    if (am <= 0) return alert('حدد الربح'); 
    const w = window.confirm(`تحصيل ${am} ج.س؟`); 
    const nt = { id: Date.now(), type: 'income', amount: am, wallet: w ? 'bank' : 'cash', category: `إيراد ربح (${a.name})`, date: new Date().toISOString().split('T')[0] }; 
    setTxs([nt, ...txs]); 
    setRec({ title: 'سند أرباح', person: a.name, amount: am, date: nt.date, ref: `INC-${nt.id.toString().slice(-4)}` });
  };

  if (!auth) return <AuthScreen view={vw} setView={setVw} savedEmail={em} savedPwd={pw} savedSecAnswer={sec} onRegister={(e, p, s) => { localStorage.setItem('s_acc_em', e); localStorage.setItem('s_acc_pw', p); localStorage.setItem('s_acc_sec', s); localStorage.setItem('s_acc_sess', 'act'); setEm(e); setPw(p); setSec(s); setAuth(true); }} onLogin={() => { localStorage.setItem('s_acc_sess', 'act'); setAuth(true); }} onResetPwd={n => { localStorage.setItem('s_acc_pw', n); setPw(n); setVw('login'); }} />;

  return (
    <div className="pb-24">
      {tst && <div className="fixed top-4 left-4 right-4 z-50 bg-yellow-500 text-slate-950 p-3 rounded-xl text-center font-bold pop">{tst}</div>}
      
      <header className="bg-slate-900 border-b border-yellow-600/30 p-4 sticky top-0 z-10 flex justify-between items-center shadow-lg">
        <div className="flex items-center gap-2">
          <div className="text-yellow-400 font-bold"><I.B/></div>
          <div><h1 className="text-sm font-black text-white">إدارة الأملاك</h1><p className="text-[10px] text-yellow-500 font-semibold">المحفظة الذكية</p></div>
        </div>
        <a href="index.html" className="bg-slate-800 text-white text-xs px-4 py-2 rounded-xl font-bold flex items-center gap-1.5">المحاسب 💼</a>
      </header>
      
      <main className="p-4 max-w-md mx-auto space-y-4">
        {tab !== 'profile' && (
          <div className="bg-gradient-to-br from-slate-900 to-slate-950 p-5 rounded-3xl border border-yellow-500/20 text-center pop shadow-xl relative overflow-hidden">
            <p className="text-slate-400 text-xs font-semibold mb-1">القيمة السوقية</p>
            <h2 className="text-3xl font-black text-yellow-500" dir="ltr">{wlt.toLocaleString()} <span className="text-sm text-slate-400">ج.س</span></h2>
            
            <div className="mt-5 pt-4 border-t border-slate-800/80 space-y-3">
              <div className="flex justify-between items-center text-xs bg-slate-950 p-3 rounded-xl border border-slate-800">
                <span className="text-slate-400 font-bold">ذهب عيار 24</span>
                <input type="number" value={g24 || ''} onChange={e => { const p = Number(e.target.value) || 0; setG24(p); }} className="w-24 bg-slate-900 text-center text-sm p-1.5 rounded-lg text-yellow-400 font-bold outline-none border border-slate-700" />
              </div>
              <div className="grid grid-cols-2 gap-3 text-xs font-semibold">
                <div className="bg-slate-950/70 p-3 rounded-xl border border-slate-800/50 flex flex-col items-center">
                  <span className="text-slate-500 mb-1">دولار (موازي)</span>
                  <span className="text-indigo-400 font-black">{liveRates.usdParallel.toLocaleString()}</span>
                </div>
                <div className="bg-slate-950/70 p-3 rounded-xl border border-slate-800/50 flex flex-col items-center">
                  <span className="text-slate-500 mb-1">ريال (موازي)</span>
                  <span className="text-indigo-400 font-black">{liveRates.sarParallel.toLocaleString()}</span>
                </div>
              </div>
            </div>
          </div>
        )}

        {tab === 'converter' && <CurrencyConverter rates={liveRates} />}
        
        {tab === 'assets' && (
          <div className="space-y-4 pop">
            <div className="flex gap-2">
              <input type="text" placeholder="بحث..." value={srch} onChange={e => setSrch(e.target.value)} className="flex-1 bg-slate-900 text-white rounded-xl py-2.5 px-3 text-sm font-semibold outline-none border border-slate-800" />
              <button onClick={() => { setEd(null); setMo(true); }} className="bg-yellow-500 text-slate-950 px-4 py-2.5 rounded-xl text-sm font-black">➕ إضافة</button>
            </div>
            
            {fAst.map(a => (
              <div key={a.id} className="bg-slate-900 p-5 rounded-3xl border border-slate-800 relative space-y-3 shadow-sm">
                <div className="absolute top-4 left-4 flex gap-1.5">
                  <button onClick={() => { setEd(a); setMo(true); }} className="p-1.5 bg-slate-800 text-emerald-400 rounded-lg"><I.E/></button>
                  <button onClick={() => delA(a)} className="p-1.5 bg-slate-800 text-red-400 rounded-lg"><I.T/></button>
                </div>
                <h4 className="font-bold text-white max-w-[65%] truncate text-sm">{a.name}</h4>
                <div className="bg-slate-950 p-3 rounded-2xl flex justify-between items-center text-xs border border-slate-800/50">
                  <span className="text-slate-400 font-semibold">التقييم:</span>
                  <span className="font-black text-yellow-500 text-[15px]" dir="ltr">{parseFloat(a.currentValue || 0).toLocaleString()} ج</span>
                </div>
                {a.isRented && (
                  <div className="flex gap-2 mt-2">
                    <button onClick={() => genInc(a)} className="flex-1 bg-emerald-600/10 text-emerald-400 py-2.5 rounded-xl text-xs font-bold">تحصيل 💸</button>
                    <button onClick={() => setPlM(a)} className="flex-1 bg-blue-600/10 text-blue-400 py-2.5 rounded-xl text-xs font-bold">الأرباح 📋</button>
                  </div>
                )}
              </div>
            ))}
          </div>
        )}
        
        {tab === 'projection' && (
          <div className="space-y-4 pop">
            <div className="bg-emerald-900/40 p-4 rounded-2xl border border-emerald-500/30 text-sm text-emerald-300 font-bold shadow-lg">🔮 خوارزمية الاستشراف واسترداد التكلفة</div>
            {ast.filter(a => a.isRented).map(a => {
              const c = parseFloat(a.currentValue || 0);
              const an = a.type === 'real_estate' ? (parseFloat(a.monthlyRent || 0) * 12) : ((parseFloat(a.periodicIncome || 0)) * 12);
              return (
                <div key={a.id} className="bg-slate-800 p-5 rounded-3xl border border-cyan-500/20 space-y-4 shadow-xl">
                  <h4 className="font-black text-cyan-400 border-b border-slate-700/50 pb-2 text-base truncate">{a.name}</h4>
                  <div className="grid grid-cols-3 gap-2 text-center">
                    <div className="bg-slate-950 p-3 rounded-xl border border-slate-800"><p className="text-slate-500 mb-1 text-[10px]">3 سنوات</p><p className="text-amber-400 font-black text-sm">{Math.round(an * 3).toLocaleString()}</p></div>
                    <div className="bg-slate-950 p-3 rounded-xl border border-slate-800"><p className="text-slate-500 mb-1 text-[10px]">5 سنوات</p><p className="text-amber-400 font-black text-sm">{Math.round(an * 5).toLocaleString()}</p></div>
                    <div className="bg-slate-950 p-3 rounded-xl border border-slate-800"><p className="text-slate-500 mb-1 text-[10px]">10 سنوات</p><p className="text-amber-400 font-black text-sm">{Math.round(an * 10).toLocaleString()}</p></div>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {tab === 'feasibility' && <Feas />}
        
        {tab === 'profile' && (
          <div className="space-y-4 pop text-sm font-semibold pb-6">
            <button onClick={doExp} className="w-full bg-slate-900 text-blue-400 py-3.5 rounded-xl font-bold border border-slate-800">📄 تصدير سجل الممتلكات</button>
            <div className="bg-slate-900 p-4 rounded-2xl border border-yellow-500/20 space-y-3">
              <h3 className="font-black text-yellow-500">☁️ الأرشفة السحابية</h3>
              <button onClick={doBkp} className="w-full bg-yellow-500 text-slate-950 py-3 rounded-xl font-black shadow">ترحيل ونسخ</button>
              <textarea id="rc" placeholder="كود الاستعادة هنا..." className="w-full bg-slate-950 text-emerald-400 p-3 rounded-xl h-16 border border-slate-800 mt-2 outline-none" />
              <button onClick={() => { const v = document.getElementById('rc').value; if (v.trim()) doRes(v); }} className="w-full bg-slate-800 text-white py-3 rounded-xl font-bold">حقن البيانات</button>
            </div>
            <button onClick={() => { localStorage.removeItem('s_acc_sess'); setAuth(false); setVw('login'); }} className="w-full bg-slate-800 text-slate-400 py-3.5 rounded-xl font-bold shadow">تسجيل الخروج 🚪</button>
          </div>
        )}
      </main>
      
      <nav className="fixed bottom-0 w-full bg-slate-950 border-t border-slate-800/80 pb-safe pt-2 px-2 z-20 flex justify-between shadow-2xl">
        <button onClick={() => setTab('assets')} className={`flex-1 flex flex-col items-center gap-1.5 pb-2 pt-1 text-[11px] font-bold ${tab === 'assets' ? 'text-yellow-400' : 'text-slate-500'}`}><I.B/>الأصول</button>
        <button onClick={() => setTab('converter')} className={`flex-1 flex flex-col items-center gap-1.5 pb-2 pt-1 text-[11px] font-bold ${tab === 'converter' ? 'text-indigo-400' : 'text-slate-500'}`}><I.M/>صرف</button>
        <button onClick={() => setTab('projection')} className={`flex-1 flex flex-col items-center gap-1.5 pb-2 pt-1 text-[11px] font-bold ${tab === 'projection' ? 'text-cyan-400' : 'text-slate-500'}`}><I.C/>استشراف</button>
        <button onClick={() => setTab('feasibility')} className={`flex-1 flex flex-col items-center gap-1.5 pb-2 pt-1 text-[11px] font-bold ${tab === 'feasibility' ? 'text-emerald-400' : 'text-slate-500'}`}><I.A/>الجدوى</button>
        <button onClick={() => setTab('profile')} className={`flex-1 flex flex-col items-center gap-1.5 pb-2 pt-1 text-[11px] font-bold ${tab === 'profile' ? 'text-yellow-500' : 'text-slate-500'}`}><I.S/>الضبط</button>
      </nav>
      
      {mo && <Mod g24={g24} ed={ed} cls={() => { setMo(false); setEd(null); }} sav={savA} />}
      {rec && <ReceiptModal data={rec} onClose={() => setRec(null)} showToast={shT} />}
      {plM && <PlMod p={plM} txs={txs} oC={() => setPlM(null)} oD={id => { setTxs(txs.filter(t => t.id !== id)); shT('تم الحذف ✅'); }} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
