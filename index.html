<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>المحاسب الذكي - الشامل</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { 
      font-family: 'Cairo', system-ui, sans-serif; 
      background-color: #020617; 
      color: #f8fafc; 
      -webkit-tap-highlight-color: transparent; 
    }
    input[type=number]::-webkit-inner-spin-button { display: none; }
    .pop { animation: popIn 0.2s ease-out forwards; }
    @keyframes popIn { 
      0% { transform: scale(0.95); opacity: 0; } 
      100% { transform: scale(1); opacity: 1; } 
    }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 1rem); }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { useState, useEffect, useMemo } = React;
  
  const vib = () => { if (navigator.vibrate) navigator.vibrate(30); };
  const jP = (k) => { try { return JSON.parse(localStorage.getItem(k)) || []; } catch(e) { return []; } };

  const K = { t: 'smart_accountant_tx', d: 'smart_accountant_dbts', p: 'smart_accountant_ptnrs', pj: 'smart_accountant_projects', tr: 'smart_accountant_trusts', a: 'smart_accountant_assets' };
  
  const cx = {
    i: "w-full bg-slate-900/80 text-white p-3.5 rounded-xl border border-slate-700/50 text-sm font-semibold focus:outline-none focus:border-emerald-500 transition",
    b: "w-full bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 font-black py-4 rounded-xl shadow-lg transition text-sm",
    c: "bg-slate-900/80 p-5 rounded-3xl border border-slate-800 shadow-xl relative pop",
    m: "fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4",
    mc: "bg-slate-900 w-full max-w-sm rounded-3xl p-6 border border-slate-800 max-h-[85vh] overflow-y-auto pop shadow-2xl",
    ib: "p-2.5 bg-slate-800 hover:bg-slate-700 rounded-xl transition text-base border border-slate-700/80 shadow-sm flex items-center justify-center",
    f: "flex justify-between items-center"
  };

  function Auth({ v, sV, sE, sP, sS, oR, oL, oRp }) {
    const [e, sE_] = useState(''); const [p, sP_] = useState(''); const [s, sS_] = useState('');
    useEffect(() => { if (sE) sE_(sE); }, [sE]);
    
    const sub = ev => {
      ev.preventDefault(); vib();
      if (v === 'register') {
        if (!e || p.length < 4 || !s) return alert('بيانات غير مكتملة (الرمز 4 أرقام على الأقل)');
        oR(e.toLowerCase(), p, s.trim());
      } else if (v === 'login') {
        if (e.toLowerCase() === sE.toLowerCase() && p === sP) { oL(); } else { alert('خطأ في البيانات!'); }
      } else {
        if ((e || '').toLowerCase() === (sE || '').toLowerCase() && (s || '').trim() === (sS || '').trim()) {
          const np = prompt('الرمز الجديد:'); if (np && np.length >= 4) { oRp(np); } else { alert('مرفوض'); }
        } else { alert('خطأ في الإجابة!'); }
      }
    };

    return (
      <div className={cx.m}>
        <div className="bg-slate-900 p-8 rounded-3xl w-full max-w-sm border border-slate-800 text-center space-y-5 shadow-xl">
          <h1 className="text-2xl font-black text-emerald-400 tracking-tight">🔐 المحاسب الذكي</h1>
          <form onSubmit={sub} className="space-y-4">
            <input type="email" required placeholder="البريد الإلكتروني" value={e} onChange={x => sE_(x.target.value)} className={cx.i + " font-sans"} />
            {v !== 'forgot' && <input type="password" required placeholder="كلمة المرور" value={p} onChange={x => sP_(x.target.value)} className={cx.i + " font-sans"} />}
            {(v === 'register' || v === 'forgot') && <input type="text" required placeholder="سؤال الأمان: مدينتك المفضلة؟" value={s} onChange={x => sS_(x.target.value)} className={cx.i + " text-emerald-400"} />}
            <button type="submit" className={cx.b}>{v === 'login' ? 'دخول الخزينة' : v === 'register' ? 'إنشاء ملف' : 'استعادة الصلاحية'}</button>
          </form>
          <div className="mt-6 flex flex-col gap-3 text-center text-sm font-semibold">
            {v === 'login' ? (
              <><button type="button" onClick={() => sV('forgot')} className="text-slate-400">نسيت الرمز؟</button><button type="button" onClick={() => sV('register')} className="text-emerald-400">ملف جديد ➕</button></>
            ) : <button type="button" onClick={() => sV('login')} className="text-slate-400">تسجيل دخول 🔑</button>}
          </div>
        </div>
      </div>
    );
  }

  function NavI({ i, l, a, oC, c }) { 
    return (
      <button onClick={() => { vib(); oC(); }} className={`flex flex-col items-center gap-1.5 transition-transform ${a ? `text-${c}-400 scale-110` : 'text-slate-500 hover:text-slate-300'}`}>
        <div className="text-xl">{i}</div><span className="text-[10px] font-bold">{l}</span>
      </button>
    ); 
  }

  function App() {
    const [auth, setAuth] = useState(() => localStorage.getItem('sa_ses') === '1');
    const [vw, setVw] = useState('login');
    const [sE, setSE] = useState(() => localStorage.getItem('sa_em') || '');
    const [sP, setSP] = useState(() => localStorage.getItem('sa_pw') || '1234');
    const [sS, setSS] = useState(() => localStorage.getItem('sa_sec') || '');
    
    const [tab, setTab] = useState('dash'); const [qA, setQA] = useState(false); const [qT, setQT] = useState('transaction');
    const [eD, setED] = useState(null); const [pM, setPM] = useState(null); const [tM, setTM] = useState(null);
    const [dM, setDM] = useState(null); const [spM, setSpM] = useState(null); const [plM, setPlM] = useState(null);
    const [rM, setRM] = useState(null); const [tst, setTst] = useState(null);
    
    const [txs, setTxs] = useState(() => jP(K.t)); const [dbs, setDbs] = useState(() => jP(K.d));
    const [pts, setPts] = useState(() => jP(K.p)); const [pjs, setPjs] = useState(() => jP(K.pj));
    const [trs, setTrs] = useState(() => jP(K.tr)); const [ast, setAst] = useState(() => jP(K.a));
    const [lBkp, setLBkp] = useState(() => Number(localStorage.getItem('sa_bkp')) || 0);

    useEffect(() => { localStorage.setItem(K.t, JSON.stringify(txs)); }, [txs]);
    useEffect(() => { localStorage.setItem(K.d, JSON.stringify(dbs)); }, [dbs]);
    useEffect(() => { localStorage.setItem(K.p, JSON.stringify(pts)); }, [pts]);
    useEffect(() => { localStorage.setItem(K.pj, JSON.stringify(pjs)); }, [pjs]);
    useEffect(() => { localStorage.setItem(K.tr, JSON.stringify(trs)); }, [trs]);
    
    useEffect(() => {
      const syncD = e => { if (e.key === K.a) setAst(jP(K.a)); if (e.key === K.t) setTxs(jP(K.t)); if (e.key === K.d) setDbs(jP(K.d)); };
      window.addEventListener('storage', syncD); return () => window.removeEventListener('storage', syncD);
    }, []);

    useEffect(() => { if (!localStorage.getItem('sa_em')) setVw('register'); }, []);

    const shT = m => { setTst(m); setTimeout(() => setTst(null), 3000); };

    const clc = useMemo(() => {
      const sIn = txs.filter(t => t.type === 'income').reduce((a, c) => a + c.amount, 0);
      const sOut = txs.filter(t => t.type === 'expense').reduce((a, c) => a + c.amount, 0);
      const aEx = trs.filter(t => t.type === 'external').reduce((a, t) => a + (t.amount - (t.paid || 0)), 0);
      const aWm = trs.filter(t => t.type === 'with_me').reduce((a, t) => a + (t.amount - (t.paid || 0)), 0);
      const pTm = dbs.filter(d => d.type === 'to_me').reduce((a, d) => a + (d.amount - (d.paid || 0)), 0);
      const pOm = dbs.filter(d => d.type === 'on_me').reduce((a, d) => a + (d.amount - (d.paid || 0)), 0);
      const tA = ast.reduce((s, a) => s + parseFloat(a.currentValue || 0), 0);
      const tDf = pjs.reduce((a, p) => a + (parseFloat(p.devFund) || 0), 0);
      
      const mPc = pts.reduce((t, p) => {
        const me = p.partners?.find(x => x.name === 'أنت');
        if (!me) return t;
        if (p.allocationMode === 'capital') {
          return t + parseFloat(me.amount || 0);
        } else {
          return t; // لا يتم جمع حصص الشراكة اليدوية (المضاربة) مع أصولك لأنك لا تملك رأس المال
        }
      }, 0);

      let bB = 0; let cB = 0;
      
      txs.forEach(t => {
        const a = parseFloat(t.amount || 0);
        if (t.wallet === 'bank') {
          if (['income', 'trust_bank_in'].includes(t.type)) bB += a;
          if (['expense', 'trust_bank_out'].includes(t.type)) bB -= a;
        } else if (t.wallet === 'cash') {
          if (t.type === 'income') cB += a; if (t.type === 'expense') cB -= a;
        }
        if (t.type === 'transfer') {
          if (t.direction === 'cash_to_bank') { bB += a; cB -= a; }
          if (t.direction === 'bank_to_cash') { bB -= a; cB += a; }
        }
      });

      pts.forEach(p => {
        let myCap = 0; const me = p.partners?.find(x => x.name === 'أنت');
        if (me && p.allocationMode === 'capital') { 
          myCap = parseFloat(me.amount || 0); 
          if (myCap > 0) { if (p.wallet === 'bank') bB -= myCap; else cB -= myCap; }
        }
      });

      cB += aWm; const tAc = bB + cB; const aOc = tAc - aWm; 
      const nW = aOc + aEx + pTm + mPc + tA - pOm;
      
      return { tAc, aOc, aWm, nW, mPc, tA, pTm, pOm, aEx, tDf, bB, cB, tIn: sIn, tOut: sOut };
    }, [txs, dbs, trs, pts, pjs, ast]);

    const delI = (t, id) => {
      vib();
      if (t === 'ptnr') {
        const p = pts.find(x => x.id === id); if (!p) return;
        if (window.confirm('حذف الشراكة مع إبقاء الأرباح؟')) { setPts(pts.filter(x => x.id !== id)); shT('تم الحذف'); } 
        else if (window.confirm('تطهير الأرباح كاملة من الخزينة؟')) { setPts(pts.filter(x => x.id !== id)); setTxs(txs.filter(x => !(x.category || '').includes(p.name))); shT('تم التطهير'); }
        return;
      }
      if (t === 'project') {
        const p = pjs.find(x => x.id === id); if (!p) return;
        if (window.confirm('حذف المشروع مع إبقاء أرباحه السابقة في الخزينة؟')) { setPjs(pjs.filter(x => x.id !== id)); shT('حُذف المشروع فقط'); } 
        else if (window.confirm('تأكيد: تطهير الخزينة من كل أرباح هذا المشروع؟')) { setPjs(pjs.filter(x => x.id !== id)); setTxs(txs.filter(x => !(x.category || '').includes(p.name))); shT('تم الحذف والتطهير'); }
        return;
      }
      if (window.confirm('تأكيد الحذف من الخزينة؟')) {
        if (t === 'tx') {
          const txToDel = txs.find(x => x.id === id);
          if (txToDel && (txToDel.category || '').startsWith('مصروف تطوير (')) {
            const pName = txToDel.category.match(/\((.*?)\)/)?.[1];
            if (pName) setPjs(pjs.map(p => p.name === pName ? { ...p, devFund: (p.devFund || 0) + parseFloat(txToDel.amount) } : p));
          }
          setTxs(txs.filter(x => x.id !== id));
        }
        if (t === 'debt') setDbs(dbs.filter(x => x.id !== id));
        if (t === 'trust') setTrs(trs.filter(x => x.id !== id));
        shT('تم الحذف');
      }
    };

    const rst = () => {
      vib();
      if (window.confirm('تصفير كلي للحسابات؟ لا يمكن التراجع.')) {
        setTxs([]); setDbs([]); setPts([]); setPjs([]); setTrs([]);
        localStorage.removeItem(K.t); localStorage.removeItem(K.d); localStorage.removeItem(K.p); localStorage.removeItem(K.pj); localStorage.removeItem(K.tr); 
        shT('تم تصفير النظام');
      }
    };

    const savI = (t, d, id = null) => {
      vib(); const di = id || Date.now();
      if (t === 'transaction') { if (id) setTxs(txs.map(x => x.id === id ? { ...x, ...d } : x)); else setTxs([{ id: di, ...d }, ...txs]); shT('تم الحفظ'); } 
      else if (t === 'debt') { if (id) setDbs(dbs.map(x => x.id === id ? { ...x, ...d } : x)); else setDbs([{ id: di, paid: 0, ...d }, ...dbs]); shT('حُفظ'); } 
      else if (t === 'trust') { if (id) setTrs(trs.map(x => x.id === id ? { ...x, ...d } : x)); else setTrs([{ id: di, paid: 0, ...d }, ...trs]); shT('حُفظ'); } 
      else if (t === 'new_partnership') { if (id) setPts(pts.map(x => x.id === id ? { ...x, ...d } : x)); else setPts([{ id: di, evaluations: [], ...d }, ...pts]); shT('تم الحفظ'); } 
      else if (t === 'new_project') { if (id) setPjs(pjs.map(x => x.id === id ? { ...x, ...d } : x)); else setPjs([{ id: di, devFund: 0, ...d }, ...pjs]); shT('تم الحفظ'); } 
      else if (t === 'evaluation') {
        let mp = 0; let pn = '';
        const newPts = pts.map(p => {
          if (p.id === Number(d.projectId)) {
            pn = p.name;
            const prevVal = p.evaluations && p.evaluations.length > 0 ? parseFloat(p.evaluations[p.evaluations.length - 1].totalCash || 0) : parseFloat(p.capital || 0);
            const pr = parseFloat(d.totalCash || 0) - prevVal;
            if (pr > 0) {
              const tcp = p.allocationMode === 'capital' ? p.partners.reduce((s, x) => s + parseFloat(x.amount || 0), 0) || 1 : parseFloat(p.capital || 0);
              let sr = 0; const me = p.partners.find(x => x.name === 'أنت');
              if (me) { if (p.allocationMode === 'capital') sr = parseFloat(me.amount || 0) / tcp; else sr = parseFloat(me.share || 0) / 100; }
              mp = pr * sr;
            } else if (pr < 0) { mp = pr; }
            return { ...p, evaluations: [...(p.evaluations || []), { id: Date.now(), ...d, periodProfit: pr }] };
          }
          return p;
        });
        setPts(newPts);
        if (mp > 0) { setTxs(prev => [{ id: Date.now() + 5, type: 'income', amount: parseFloat(mp.toFixed(2)), wallet: d.wallet, category: `أرباح جرد (${pn})`, date: d.date }, ...prev]); shT(`أرباح الجرد لك: +${mp.toLocaleString()} ج`); } 
        else if (mp < 0) { shT(`تم الجرد - خسارة مسجلة`); } else { shT('استقرار في المال (لا ربح ولا خسارة)'); }
      }
      setQA(false); setED(null);
    };

    const svDf = (id, a) => { vib(); setPjs(pjs.map(p => p.id === id ? { ...p, devFund: (p.devFund || 0) + parseFloat(a) } : p)); setDM(null); shT('تم احتجاز مال التطوير ⚙️'); };
    const dDf = (id) => { vib(); setPjs(pjs.map(p => p.id === id ? { ...p, devFund: 0 } : p)); shT('تم إلغاء التخصيص 🗑️'); };
    const spDf = (id, a, w) => {
      vib(); let pn = '';
      setPjs(pjs.map(p => { if (p.id === id) { pn = p.name; return { ...p, devFund: (p.devFund || 0) - a }; } return p; }));
      setSpM(null);
      setTxs(x => [{ id: Date.now(), type: 'expense', amount: a, wallet: w, category: `مصروف تطوير (${pn})`, date: new Date().toISOString().split('T')[0] }, ...x]);
      shT('تم تقييد المنصرف 💸');
    };

    const pDb = (id, a, w) => {
      vib(); let cd = null;
      setDbs(dbs.map(d => { if (d.id === id) { cd = d; return { ...d, paid: (d.paid || 0) + a }; } return d; }));
      setPM(null);
      if (cd) {
        const tm = cd.type === 'to_me';
        setTxs(p => [{ id: Date.now(), type: tm ? 'income' : 'expense', amount: a, wallet: w, category: tm ? `استرداد من (${cd.person})` : `سداد لـ (${cd.person})`, date: new Date().toISOString().split('T')[0] }, ...p]);
        shT('تم السداد');
      }
    };

    const pTr = (id, a, w) => {
      vib(); let ct = null;
      setTrs(trs.map(t => { if (t.id === id) { ct = t; return { ...t, paid: (t.paid || 0) + a }; } return t; }));
      setTM(null);
      if (ct && w === 'bank') {
        const ex = ct.type === 'external';
        setTxs(p => [{ id: Date.now(), type: ex ? 'trust_bank_in' : 'trust_bank_out', amount: a, wallet: 'bank', category: ex ? `استرداد أمانة (${ct.person})` : `تسليم أمانة (${ct.person})`, date: new Date().toISOString().split('T')[0] }, ...p]);
      }
      if (ct) shT('تم التحديث');
    };

    const bkpD = async () => {
      vib(); const f = { tx: txs, db: dbs, pt: pts, prj: pjs, tr: trs, ast: ast }; const b = btoa(unescape(encodeURIComponent(JSON.stringify(f))));
      const t = `[أرشيف]\n${new Date().toLocaleDateString('ar-EG')}\n\n${b}`;
      const n = Date.now(); setLBkp(n); localStorage.setItem('sa_bkp', n);
      try { if (navigator.share) { await navigator.share({ title: 'أرشيف', text: t }); } else { await navigator.clipboard.writeText(t); shT('نُسخ الكود للحافظة'); } } catch (e) { shT('تم التحديث'); }
    };

    const resD = s => {
      vib();
      try {
        const e = s.match(/[A-Za-z0-9+/=]{50,}/)?.[0] || s.trim(); const d = JSON.parse(decodeURIComponent(escape(atob(e))));
        if (d.tx && d.db) {
          setTxs(d.tx); setDbs(d.db); setPts(d.pt || []); setPjs(d.prj || []); setTrs(d.tr || []); if(d.ast) setAst(d.ast);
          const n = Date.now(); setLBkp(n); localStorage.setItem('sa_bkp', n); shT('تمت الاستعادة بنجاح');
        } else { alert('الملف تالف'); }
      } catch (e) { alert('فشل فك التشفير'); }
    };

    const expC = () => {
      vib(); if (txs.length === 0) return alert('لا توجد حركات');
      let c = "data:text/csv;charset=utf-8,\uFEFFالتاريخ,الخزنة,النوع,البيان,المبلغ\r\n";
      txs.forEach(t => {
        const ts = t.type === 'income' ? 'إيداع' : (t.type === 'expense' ? 'منصرف' : 'تحويل');
        const ws = t.wallet === 'bank' ? 'بنك' : 'كاش'; const cc = (t.category || '').replace(/,/g, '-');
        c += `${t.date},${ws},${ts},${cc},${t.amount}\r\n`;
      });
      const l = document.createElement("a"); l.setAttribute("href", encodeURI(c)); l.setAttribute("download", `حركات.csv`);
      document.body.appendChild(l); l.click(); document.body.removeChild(l); shT('تم التصدير');
    };

    if (!auth) return <Auth v={vw} sV={setVw} sE={sE} sP={sP} sS={sS} oR={(e, p, s) => { localStorage.setItem('sa_em', e); localStorage.setItem('sa_pw', p); localStorage.setItem('sa_sec', s); localStorage.setItem('sa_ses', '1'); setSE(e); setSP(p); setSS(s); setAuth(true); }} oL={() => { localStorage.setItem('sa_ses', '1'); setAuth(true); }} oRp={np => { localStorage.setItem('sa_pw', np); setSP(np); setVw('login'); }} />;

    return (
      <div className="pb-28 min-h-screen flex flex-col bg-[#020617] relative">
        {tst && <div className="fixed top-6 left-4 right-4 z-[100] bg-emerald-500 text-slate-950 px-4 py-3 rounded-2xl flex justify-center items-center font-bold shadow-xl border border-emerald-400 pop max-w-sm mx-auto">{tst}</div>}
        
        <header className="bg-slate-900/80 backdrop-blur-md border-b border-emerald-500/20 p-4 sticky top-0 z-30 flex justify-between items-center shadow-lg">
          <div className="flex items-center gap-3">
            <div className="bg-gradient-to-br from-emerald-400 to-teal-500 p-2.5 rounded-2xl text-slate-900 text-xl shadow-lg shadow-emerald-500/20">💼</div>
            <div><h1 className="font-black text-white text-base tracking-tight">المحاسب الذكي</h1><p className="text-[10px] text-emerald-400 font-bold">إدارة السيولة والخزن</p></div>
          </div>
          <div className="flex items-center gap-2">
            <a href="assets.html" onClick={vib} className="flex items-center justify-center gap-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700/80 text-yellow-500 text-xs px-4 py-2.5 rounded-2xl font-black transition shadow-sm">🏢 الأصول</a>
            <button onClick={() => { vib(); localStorage.removeItem('sa_ses'); setAuth(false); setVw('login'); }} className="bg-slate-800 hover:bg-slate-700 border border-slate-700/80 text-slate-300 text-sm h-10 w-10 rounded-2xl flex items-center justify-center transition shadow-sm">🚪</button>
          </div>
        </header>

        <main className="p-4 max-w-md mx-auto w-full flex-1">
          {tab === 'dash' && <Dash c={clc} txs={txs} lb={lBkp} oD={id => delI('tx', id)} oE={t => { setQT('transaction'); setED(t); setQA(true); }} oR={r => setRM(r)} />}

                  <p className="text-[11px] text-emerald-400 font-bold mb-3 px-1">قائمة الشركاء:</p>
                  {pL.map((p, i) => (
                    <div key={i} className="flex gap-2 mb-3 items-center">
                      <input type="text" required value={p.name} onChange={x => { let l = [...pL]; l[i].name = x.target.value; sPl(l); }} className={cx.i + " w-[45%]"} placeholder="الاسم" />
                      {aM === 'capital' ? <input type="number" required value={p.amount} onChange={x => { let l = [...pL]; l[i].amount = x.target.value; sPl(l); }} className={cx.i + " w-[55%] text-center"} placeholder="أودع كم؟" /> : <input type="number" required value={p.share} onChange={x => { let l = [...pL]; l[i].share = x.target.value; sPl(l); }} className={cx.i + " w-[55%] text-center"} placeholder="النسبة %" />}
                      {i > 1 && <button type="button" onClick={() => sPl(pL.filter((_, id) => id !== i))} className="text-red-400 p-2 bg-red-500/10 rounded-xl hover:bg-red-500/20 transition">❌</button>}
                    </div>
                  ))}
                  <button type="button" onClick={() => sPl([...pL, { name: '', amount: '', share: '' }])} className="w-full text-emerald-400 py-3 mt-2 text-xs font-bold bg-emerald-500/10 rounded-xl border border-emerald-500/20 hover:bg-emerald-500/20 transition">➕ إضافة شريك جديد</button>
                </div>
              </>
            )}
            {t === 'evaluation' && (
              <>
                <div className="flex gap-2">
                  <button type="button" onClick={() => sW('bank')} className={`flex-1 py-3.5 rounded-xl border-2 text-xs font-bold transition ${w === 'bank' ? 'bg-blue-500 text-white border-blue-500 shadow-md' : 'text-slate-500 border-slate-800 bg-slate-900'}`}>أرباح للبنك</button>
                  <button type="button" onClick={() => sW('cash')} className={`flex-1 py-3.5 rounded-xl border-2 text-xs font-bold transition ${w === 'cash' ? 'bg-emerald-500 text-white border-emerald-500 shadow-md' : 'text-slate-500 border-slate-800 bg-slate-900'}`}>أرباح كاش</button>
                </div>
                <select required value={fD.projectId || ''} onChange={x => sFd({ ...fD, projectId: x.target.value })} className={cx.i}>
                  <option value="">اختر مشروع...</option>
                  {pts.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                </select>
                <input type="number" required placeholder="إجمالي المال الفعلي الحالي" value={fD.totalCash || ''} onChange={x => sFd({ ...fD, totalCash: x.target.value })} className={cx.i + " text-center font-black text-lg"} />
              </>
            )}
            <input type="date" required value={fD.date} onChange={x => sFd({ ...fD, date: x.target.value })} className={cx.i + " text-center font-mono font-bold tracking-widest"} />
            <button type="submit" className={cx.b + " mt-4"}>تأكيد وحفظ البيانات</button>
          </form>
        </div>
      </div>
    );
  }

  function DMod({ p, oC, oS, ti, ds }) {
    const [a, sA] = useState('');
    const sub = e => { e.preventDefault(); if (a > 0) oS(p.id, a); };
    return (
      <div className={cx.m}>
        <div className={cx.mc + " mb-10"}>
          <h2 className="font-bold text-white mb-2 text-base">{ti}</h2>
          <p className="text-xs text-slate-400 mb-6 font-semibold">{ds} <span className="text-white font-bold">({p.name})</span></p>
          <form onSubmit={sub}>
            <input type="number" value={a} onChange={x => sA(x.target.value)} required className={cx.i + " text-center text-2xl font-black tracking-tighter mb-6 focus:border-yellow-500"} placeholder="أدخل القيمة..." autoFocus />
            <button type="submit" className="w-full bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-black py-4 rounded-xl text-sm shadow-md transition">تأكيد العملية ⚙️</button>
          </form>
          <button onClick={oC} className="w-full mt-4 text-slate-400 hover:text-white text-sm py-2 font-semibold transition">إلغاء</button>
        </div>
      </div>
    );
  }

  function PMod({ i, oC, oS, ti, s }) {
    const [a, sA] = useState(''); const [w, sW] = useState('bank'); const r = i.amount - (i.paid || 0);
    const sub = e => { e.preventDefault(); const v = parseFloat(a); if (v > 0 && v <= r) { oS(i.id, v, w); } else { alert('خطأ في المبلغ المُدخل'); } };
    return (
      <div className={cx.m}>
        <div className={cx.mc + " mb-10"}>
          <h2 className="font-black text-white mb-2 text-base">{ti}</h2>
          <p className="text-xs text-slate-400 mb-6 font-semibold">{s} <span className="font-black text-white px-1" dir="ltr">{r.toLocaleString()}</span> ج</p>
          <div className="flex gap-2.5 mb-6">
            <button type="button" onClick={() => sW('bank')} className={`flex-1 py-3.5 rounded-xl text-xs font-bold transition ${w === 'bank' ? 'bg-blue-500 text-white shadow-md' : 'bg-slate-900 text-slate-500 border border-slate-800'}`}>البنك 📱</button>
            <button type="button" onClick={() => sW('cash')} className={`flex-1 py-3.5 rounded-xl text-xs font-bold transition ${w === 'cash' ? 'bg-emerald-500 text-white shadow-md' : 'bg-slate-900 text-slate-500 border border-slate-800'}`}>الكاش 💵</button>
          </div>
          <form onSubmit={sub}>
            <input type="number" value={a} onChange={x => sA(x.target.value)} required max={r} className={cx.i + " text-center text-2xl font-black tracking-tighter mb-6"} placeholder="المبلغ..." autoFocus />
            <button type="submit" className={cx.b}>تأكيد وتقييد</button>
          </form>
          <button onClick={oC} className="w-full mt-4 text-slate-400 hover:text-white text-sm py-2 font-semibold transition">إلغاء النافذة</button>
        </div>
      </div>
    );
  }

  function RMod({ d, oC, sT }) {
    if (!d) return null; 
    const a = d.amount ? parseFloat(d.amount) : 0; const rf = d.ref || '-'; const dt = d.date || '-'; const ti = d.title || 'سند'; const pr = d.person || 'عام';
    let t = `🧾 *${ti}*\n------------------\n`;
    if (d.isDetailed) { t += `▪️ الجهة: ${pr}\n▪️ التاريخ: ${dt}\n------------------\n💰 الإجمالي: ${a.toLocaleString()} ج\n✅ مُسدد: ${(d.paid || 0).toLocaleString()} ج\n⚠️ متبقي: ${(d.rem || 0).toLocaleString()} ج`; } 
    else { t += `▪️ المرجع: ${rf}\n▪️ التاريخ: ${dt}\n▪️ البيان: ${pr}\n------------------\n💰 المبلغ: ${a.toLocaleString()} ج`; }
    const cp = () => { vib(); navigator.clipboard.writeText(t); sT('تم النسخ للحافظة بنجاح'); };
    return (
      <div className={cx.m + " z-[70] pop"}>
        <div className="bg-white text-slate-900 w-full max-w-sm rounded-3xl p-7 shadow-2xl font-sans">
          <h2 className="font-black text-center border-b border-dashed border-slate-300 pb-3 mb-5 text-lg">{ti}</h2>
          {d.isDetailed ? (
            <>
              <div className="space-y-3 text-sm mb-6 font-semibold text-slate-700">
                <div className={cx.f}><span>المرجع:</span><span className="font-mono bg-slate-100 px-2 rounded">{rf}</span></div>
                <div className={cx.f}><span>التاريخ:</span><span className="font-mono">{dt}</span></div>
                <div className={cx.f}><span>الجهة:</span><span className="truncate max-w-[60%] text-left">{pr}</span></div>
              </div>
              <div className="bg-slate-50 p-5 rounded-2xl border border-slate-200 space-y-3">
                <div className={cx.f + " font-bold"}><span>الإجمالي:</span><span dir="ltr">{a.toLocaleString()} ج</span></div>
                <div className={cx.f + " text-emerald-600 font-bold"}><span>مُسدد:</span><span dir="ltr">{(d.paid || 0).toLocaleString()} ج</span></div>
                <div className={cx.f + " text-red-600 font-bold border-t border-slate-200 pt-2"}><span>المتبقي:</span><span dir="ltr">{(d.rem || 0).toLocaleString()} ج</span></div>
              </div>
            </>
          ) : (
            <>
              <div className="space-y-3 text-sm mb-6 font-semibold text-slate-700">
                <div className={cx.f}><span>المرجع:</span><span className="font-mono bg-slate-100 px-2 rounded">{rf}</span></div>
                <div className={cx.f}><span>التاريخ:</span><span className="font-mono">{dt}</span></div>
                <div className={cx.f}><span>البيان:</span><span className="truncate max-w-[60%] text-left">{pr}</span></div>
              </div>
              <div className="bg-slate-50 p-5 rounded-2xl border border-slate-200 flex justify-between items-center font-black text-lg"><span>المبلغ:</span><span dir="ltr">{a.toLocaleString()} ج</span></div>
            </>
          )}
          <div className="mt-6 flex gap-2">
            <button onClick={cp} className="flex-1 bg-blue-50 hover:bg-blue-100 text-blue-600 font-bold py-3 rounded-xl transition border border-blue-200">نسخ 📋</button>
            <button onClick={oC} className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 rounded-xl transition border border-slate-200">إغلاق ❌</button>
          </div>
        </div>
      </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>
</body>
</html>
